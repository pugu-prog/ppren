<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

const TYPEN = ["Fachgespréich", "Ziel-Iwwerpréiwung"];

function heutegDatumIso() { return new Date().toISOString().slice(0, 10); }
function isoZuDmy(iso) {
  const [j, m, t] = iso.split("-");
  return `${t}.${m}.${j}`;
}
function dmyZuIso(dmy) {
  if (!dmy) return "";
  const [t, m, j] = String(dmy).split(".");
  return `${j}-${m}-${t}`;
}

// ===== M8: .ics-Kalenner-Export =====
function pad(n) { return String(n).padStart(2, "0"); }

function nowStamp() {
  const d = new Date();
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}

function escapeIcs(text) {
  return String(text).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

/** Baut een eenzelnen VEVENT-Block. Mat Zäit: Dauer aus der Tabell (soss 30 Min.). Ouni Zäit: ganzen Dag. */
function baueIcsEvent(r) {
  const [t, m, j] = (r.Datum || "").split(".");
  if (!t || !m || !j) return "";
  const uid = (r.ID || `${j}${m}${t}-${Math.random().toString(36).slice(2)}`) + "@ppren";
  const summary = `PPREN: ${r.Typ} — ${r.Schüler}`;
  let dtstartZeil, dtendZeil;

  if (r.Zäit) {
    const [hh, mi] = r.Zäit.split(":");
    const dtstart = `${j}${m}${t}T${pad(hh)}${pad(mi)}00`;
    let endH = parseInt(hh, 10);
    let endM = parseInt(mi, 10) + (Number(r.Dauer) || 30);
    while (endM >= 60) { endM -= 60; endH += 1; }
    if (endH >= 24) endH -= 24;
    const dtend = `${j}${m}${t}T${pad(endH)}${pad(endM)}00`;
    dtstartZeil = `DTSTART:${dtstart}`;
    dtendZeil = `DTEND:${dtend}`;
  } else {
    const dtstart = `${j}${m}${t}`;
    const d = new Date(Number(j), Number(m) - 1, Number(t));
    d.setDate(d.getDate() + 1);
    const dtend = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    dtstartZeil = `DTSTART;VALUE=DATE:${dtstart}`;
    dtendZeil = `DTEND;VALUE=DATE:${dtend}`;
  }

  const beschreiwung = (r.Notiz || "").trim();
  const lines = [
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${nowStamp()}`,
    dtstartZeil,
    dtendZeil,
    `SUMMARY:${escapeIcs(summary)}`,
    beschreiwung ? `DESCRIPTION:${escapeIcs(beschreiwung)}` : null,
    "END:VEVENT",
  ].filter(Boolean);
  return lines.join("\r\n");
}

function baueIcsKalenner(liste) {
  const events = liste.map(baueIcsEvent).filter(Boolean).join("\r\n");
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//PPREN//Rendezvousen//DE",
    "CALSCALE:GREGORIAN",
    events,
    "END:VCALENDAR",
  ].join("\r\n");
}

function laadIcsErof(inhalt, dateiName) {
  const blob = new Blob([inhalt], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = dateiName;
  a.click();
  URL.revokeObjectURL(url);
}
// ===== Enn M8 =====

// ===== Slots & automatesch Verdeelen =====
// Fräi Zäit fir Rendez-vousen: Méindes 13:10–15:50, Dënschdes 13:10–14:50 (getUTCDay: 1 = Méindeg, 2 = Dënschdeg)
const SLOTS = { 1: { vun: "13:10", bis: "15:50" }, 2: { vun: "13:10", bis: "14:50" } };
const DAUER_STANDARD = { "Fachgespréich": 20, "Ziel-Iwwerpréiwung": 10 };
// Dauere wéi an zieluewerpreiwung.html (10–12 Min.) a fachgespraech.html (20 Min. Gespréich)
const DAUER_OPTIOUNEN = { "Ziel-Iwwerpréiwung": [10, 12] };
// Fachgespréich: 10 Min. Virbereedung virum Gespréich. De Schüler bereet sech vir, während de virege nach schwätzt,
// dofir fänkt nëmmen dat éischt Gespréich vum Dag 10 Min. méi spéit un.
const VIRBEREEDUNG = { "Fachgespréich": 10 };
// Virschlag fir de Mail-Text. {virnumm}, {terminer}, {ziler}, {meilensteng} ginn pro Schüler ersat (am Backend).
// Virgab Ziel-Iwwerpréiwung = KRITAEREN aus zieluewerpreiwung.html, Fachgespréich = Instruktionen_Pruefer_Fachgespraeche_DE.docx
const MAIL_VIRLAGEN = {
  "Ziel-Iwwerpréiwung":
`Hallo {virnumm},

fir dech ass eng Ziel-Iwwerpréiwung geplangt:

{terminer}

D'Gespréich dauert 10–12 Minutten an et gëtt keng Virbereedungszäit virop — bereet dech also doheem vir.

VIRGAB – doropshi gëtt d'Gespréich bewäert (wéi an der Ziel-Iwwerpréiwung):
  1. Fortschrëtt zënter der leschter Etapp
  2. Erreechung vun de gesate Ziler
  3. Autonomie / Eegenstännegkeet bei der Ëmsetzung
  4. Ëmgang mat opgetruedene Problemer
  5. Nächst Schrëtt sënnvoll geplangt

DENG ZILER (aus dengem Projektplang):
{ziler}

DENG MEILESTENG:
{meilensteng}

Du brauchs näischt matzebréngen – mir kucken alles direkt am PPREN (Projektplang, Meilesteng, Wochenberichter, Dokumentatioun). Suerg just dofir, dass do alles aktuell ass.

Du fënns den Termin och an dengem Suivi: https://pugu-prog.github.io/ppren/suivi.html
Am Unhang ass eng Kalennerdatei (.ics) – opmaachen, da kënnt den Termin mat Erënnerung an däin Handy-Kalenner. 2 Deeg virdrun kriss du nach eng Erënnerung per Mail.

Bis dann!`,
  "Fachgespréich":
`Hallo {virnumm},

fir dech ass e Fachgespréich geplangt:

{terminer}

Wichteg: Komm 10 Minutte virun der Zäit hei uewen. Du kriss dann d'Froen an hues 10 Minutte Virbereedungszäit. Duerno schwätze mir 20 Minutte (ongeféier 4 Minutte pro Fro).

Wat dech erwaart (Virgab fir d'Fachgespréicher):
  • D'Froe betreffen den theoreteschen Deel vun dësem Trimester/Semester – och Saachen, déi s du nach net oder nëmmen hallef bearbecht hues.
  • 5 Froen (oder 4 Froen, wann eng Zeechnung/Skizz derbäi ass), wéi bei enger Prüfung; Nofroe sinn erlaabt.
  • Bewäert gëtt: fachlecht Verständnis, wéi gutt s du et erkläers, an de Bezuch zu dengem Projet.

Bereet dech vir: Fachbegrëffer, Formelen a Zesummenhäng vun dengem Projet widderhuelen a sou erklären, dass een et versteet.

Du fënns den Termin och an dengem Suivi: https://pugu-prog.github.io/ppren/suivi.html
Am Unhang ass eng Kalennerdatei (.ics) – opmaachen, da kënnt den Termin mat Erënnerung an däin Handy-Kalenner. 2 Deeg virdrun kriss du nach eng Erënnerung per Mail.

Vill Erfolleg!`,
};

function notizMatVirbereedung(typ, notiz) {
  const v = VIRBEREEDUNG[typ];
  const hiwais = v ? `Komm ${v} Min. virdrun: ${v} Min. Virbereedungszäit (d'Froe ginn ausgedeelt), duerno d'Gespréich zu der Zäit hei uewen.` : "";
  return [hiwais, notiz].filter(Boolean).join(" ");
}
const DEEG = ["So", "Mé", "Dë", "Më", "Do", "Fr", "Sa"];
const DEEG_LANG = ["Sonndeg", "Méindeg", "Dënschdeg", "Mëttwoch", "Donneschdeg", "Freideg", "Samschdeg"];
// Wéi eng Timeline-Evenementer zu wéi engem Typ passen
const PASST_ZU_TYP = {
  "Ziel-Iwwerpréiwung": (e) => e.Kategorie === "Iwwerpréiwung" || /ziler|ziel/i.test(e.Titel || ""),
  "Fachgespréich": (e) => /fachgespr/i.test(e.Titel || ""),
};

function minVun(hhmm) { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + m; }
function zaeitVun(min) { return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`; }
function isoDatum(d) { return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function isoDag(iso) { const [j, m, t] = iso.split("-").map(Number); return new Date(Date.UTC(j, m - 1, t)); }
function isoPlus(iso, n) { const d = isoDag(iso); d.setUTCDate(d.getUTCDate() + n); return isoDatum(d); }
function wochendag(iso) { return isoDag(iso).getUTCDay(); }
function montagVun(iso) { const wd = wochendag(iso); return isoPlus(iso, wd === 0 ? -6 : 1 - wd); }
function kuerz(iso) { const [, m, t] = iso.split("-"); return `${t}.${m}.`; }
function istZaeit(z) { return /^\d{1,2}:\d{2}$/.test(String(z || "")); }

/** Besat Intervaller [start, enn] a Minutten pro Dag (iso) aus de bestoende Rendez-vousen. */
function besatVun(rendezvousen) {
  const besat = {};
  rendezvousen.forEach((r) => {
    if (!istZaeit(r.Zäit)) return;
    const iso = dmyZuIso(r.Datum);
    const s = minVun(r.Zäit);
    (besat[iso] = besat[iso] || []).push([s, s + (Number(r.Dauer) || 30)]);
  });
  return besat;
}

/** Verdeelt d'Schüler der Rei no op déi fräi Slots ab der Woch vu startIso. */
function verdeelen({ schueler, startIso, dauer, puffer, besat, ausgeloos, minIso, virlaf = 0 }) {
  const out = [];
  let i = 0;
  let iso = montagVun(startIso);
  for (let n = 0; n < 140 && i < schueler.length; n++, iso = isoPlus(iso, 1)) {
    const slot = SLOTS[wochendag(iso)];
    if (!slot || iso < minIso || ausgeloos.has(iso)) continue;
    const bl = [...(besat[iso] || [])];
    let t = minVun(slot.vun) + virlaf;
    const enn = minVun(slot.bis);
    while (i < schueler.length && t + dauer <= enn) {
      // och tëscht bestoende Rendez-vousen de Wiessel respektéieren
      const konflikt = bl.find(([a, b]) => t < b + puffer && t + dauer + puffer > a);
      if (konflikt) { t = Math.max(t + 1, konflikt[1] + puffer); continue; }
      out.push({ ...schueler[i], iso, zaeit: zaeitVun(t), dauer });
      bl.push([t, t + dauer]);
      t += dauer + puffer;
      i++;
    }
  }
  return { virschlag: out, netPlaz: schueler.slice(i) };
}

async function schecken(rendezvousen, mailSchecken, mailText) {
  const res = await fetch(WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      typ: "rendezvousenPlangen",
      token: window.PPREN_SESSION?.token || "",
      erstalltVum: window.PPREN_SESSION?.numm || "",
      mailSchecken,
      mailText,
      rendezvousen,
    }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
  return data;
}

function mailInfo(d, mailSchecken) {
  if (!mailSchecken) return "";
  return ` · ${d.mailen || 0} Mail(en) geschéckt` + (d.ouniMail && d.ouniMail.length ? ` (keng E-Mail fir: ${d.ouniMail.join(", ")})` : "");
}

function App() {
  // M1: Nimm live vum Backend lueden, keng hart-codéiert Lëscht méi.
  const [personen, setPersonen] = useState([]);
  useEffect(() => {
    fetch(WEB_APP_URL + "?namen=1&token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((r) => r.json())
      .then((d) => setPersonen(d.personen || []))
      .catch(() => {});
  }, []);
  // Matricule -> "Matricule · Virnumm" fir d'Uweisen
  const ufweis = (numm) => {
    const p = personen.find((x) => x.numm === numm);
    return p && p.virnumm ? `${numm} · ${p.virnumm}` : numm;
  };
  const SCHUELER = useMemo(
    () => personen.filter((p) => p.rolle === "Schüler").map((p) => ({ id: p.numm, name: p.numm, virnumm: p.virnumm || "", klasse: p.klasse })),
    [personen]
  );
  const KLASSEN = useMemo(() => [...new Set(SCHUELER.map((s) => s.klasse).filter(Boolean))].sort(), [SCHUELER]);

  const [modus, setModus] = useState("auto");
  const [schuelerId, setSchuelerId] = useState("");
  const [typ, setTyp] = useState("Ziel-Iwwerpréiwung");
  const [datum, setDatum] = useState(heutegDatumIso());
  const [zaeit, setZaeit] = useState("");
  const [dauer, setDauer] = useState(DAUER_STANDARD["Ziel-Iwwerpréiwung"]);
  const [notiz, setNotiz] = useState("");
  const [mailSchecken, setMailSchecken] = useState(true);
  const [mailText, setMailText] = useState(MAIL_VIRLAGEN["Ziel-Iwwerpréiwung"]);
  const [rendezvousen, setRendezvousen] = useState([]);
  const [zaitplang, setZaitplang] = useState([]);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [error, setError] = useState(null);
  const [toast, setToast] = useState(null);

  // Auto-Plangung
  const [klass, setKlass] = useState("");
  const [anker, setAnker] = useState("");
  const [startIso, setStartIso] = useState(heutegDatumIso());
  const [puffer, setPuffer] = useState(3);
  const [ausgeloos, setAusgeloos] = useState(new Set());
  const [ofgewielt, setOfgewielt] = useState(new Set());
  const [virschlag, setVirschlag] = useState(null);
  const [netPlaz, setNetPlaz] = useState([]);

  const currentSchueler = SCHUELER.find((s) => s.id === schuelerId);

  const lade = () => {
    setLoading(true);
    setError(null);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((res) => res.json())
      .then((data) => {
        setRendezvousen(data.rendezvousen || []);
        setZaitplang(data.offiziellZaitplang || []);
      })
      .catch(() => setError("Konnte Rendez-vous'er net lueden."))
      .finally(() => setLoading(false));
  };
  useEffect(() => { lade(); }, []);
  useEffect(() => { if (!klass && KLASSEN.length) setKlass(KLASSEN[0]); }, [KLASSEN]);
  useEffect(() => { setDauer(DAUER_STANDARD[typ] || 20); setMailText(MAIL_VIRLAGEN[typ] || ""); }, [typ]);

  const sortéiert = useMemo(
    () => [...rendezvousen].sort((a, b) => (dmyZuIso(a.Datum) + (a.Zäit || "")).localeCompare(dmyZuIso(b.Datum) + (b.Zäit || ""))),
    [rendezvousen]
  );

  const heidegIso = heutegDatumIso();
  const nurZukunft = sortéiert.filter((r) => dmyZuIso(r.Datum) >= heidegIso);
  const vergaangen = sortéiert.filter((r) => dmyZuIso(r.Datum) < heidegIso);
  const besat = useMemo(() => besatVun(rendezvousen), [rendezvousen]);

  // Timeline: opstoend Evenementer pro Klass, pro Woch + Titel gruppéiert
  const ankerFir = (kl, nurTyp) => {
    const gruppen = {};
    zaitplang
      .filter((e) => (!kl || e.Klasse === kl) && String(e.Datum) >= isoPlus(heidegIso, -6))
      .filter((e) => !nurTyp || PASST_ZU_TYP[nurTyp](e))
      .forEach((e) => {
        const key = `${montagVun(e.Datum)}|${e.Titel}`;
        (gruppen[key] = gruppen[key] || { key, montag: montagVun(e.Datum), titel: e.Titel, deeg: [] }).deeg.push(e.Datum);
      });
    return Object.values(gruppen).sort((a, b) => a.montag.localeCompare(b.montag));
  };
  const ankerLescht = useMemo(() => {
    const passend = ankerFir(klass, typ);
    return passend.length ? passend : ankerFir(klass, null);
  }, [zaitplang, klass, typ]);
  useEffect(() => {
    const a = ankerLescht[0];
    setAnker(a ? a.key : "");
    if (a) setStartIso(a.montag);
  }, [ankerLescht]);

  const klassSchueler = SCHUELER.filter((s) => s.klasse === klass);
  // Schüler, déi an där Woch schonn e Rendez-vous vum selwechten Typ hunn
  const schonnGeplangt = (s) => rendezvousen.find((r) => r.Schüler === s.name && r.Typ === typ &&
    Math.abs(isoDag(dmyZuIso(r.Datum)) - isoDag(montagVun(startIso))) <= 14 * 864e5);
  useEffect(() => {
    setOfgewielt(new Set(klassSchueler.filter((s) => schonnGeplangt(s)).map((s) => s.id)));
    setAusgeloos(new Set());
    setVirschlag(null);
  }, [klass, typ, startIso, SCHUELER, rendezvousen]);

  const maachVirschlag = (ausgeloosNei = ausgeloos) => {
    const r = verdeelen({
      schueler: klassSchueler.filter((s) => !ofgewielt.has(s.id)),
      startIso, dauer: Number(dauer) || 10, puffer: Number(puffer) || 0, besat, ausgeloos: ausgeloosNei, minIso: heidegIso, virlaf: VIRBEREEDUNG[typ] || 0,
    });
    setVirschlag(r.virschlag);
    setNetPlaz(r.netPlaz);
  };
  const dagAusloossen = (iso) => {
    const nei = new Set(ausgeloos); nei.add(iso);
    setAusgeloos(nei);
    maachVirschlag(nei);
  };
  const virschlagAenneren = (idx, feld, wert) => setVirschlag((v) => v.map((x, i) => (i === idx ? { ...x, [feld]: wert } : x)));

  const autoSpaicheren = async () => {
    if (!virschlag || virschlag.length === 0) return;
    if (mailSchecken && !confirm(`${virschlag.length} Rendez-vous(en) späicheren an all Schüler direkt eng Mail schécken?`)) return;
    setSyncing(true);
    setError(null);
    try {
      const d = await schecken(virschlag.map((v) => ({
        schueler: v.name, klasse: v.klasse, rvTyp: typ, datum: isoZuDmy(v.iso), zaeit: v.zaeit, dauer: Number(v.dauer) || Number(dauer), notiz: notizMatVirbereedung(typ, notiz),
      })), mailSchecken, mailText);
      setToast(`${virschlag.length} Rendez-vous(en) geplangt` + mailInfo(d, mailSchecken));
      setVirschlag(null);
      setNotiz("");
      lade();
    } catch (e) {
      setError("Konnte net plangen: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 6000);
    }
  };

  // Eenzel-Rendez-vous
  const canSubmit = schuelerId && datum;
  const eenzelAnker = useMemo(() => (currentSchueler ? ankerFir(currentSchueler.klasse, null).slice(0, 6) : []), [zaitplang, currentSchueler]);
  const nächstSlot = () => {
    const r = verdeelen({ schueler: [{}], startIso: datum, dauer: Number(dauer) || 10, puffer: Number(puffer) || 0, besat, ausgeloos: new Set(), minIso: datum < heidegIso ? heidegIso : datum, virlaf: VIRBEREEDUNG[typ] || 0 });
    if (r.virschlag[0]) { setDatum(r.virschlag[0].iso); setZaeit(r.virschlag[0].zaeit); }
  };

  const plangen = async () => {
    if (!canSubmit) return;
    setSyncing(true);
    setError(null);
    try {
      const d = await schecken([{
        schueler: currentSchueler.name, klasse: currentSchueler.klasse, rvTyp: typ, datum: isoZuDmy(datum), zaeit, dauer: zaeit ? Number(dauer) : "", notiz: notizMatVirbereedung(typ, notiz),
      }], mailSchecken, mailText);
      setToast("Rendez-vous geplangt" + mailInfo(d, mailSchecken));
      setNotiz("");
      lade();
    } catch (e) {
      setError("Konnte net plangen: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 5000);
    }
  };

  const läschen = async (id) => {
    if (!confirm("Dëse Rendez-vous wierklech läschen?")) return;
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "rendezvousLaeschen", id, token: window.PPREN_SESSION?.token || "" }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      lade();
    } catch (e) {
      alert("Konnte net läschen: " + e.message);
    }
  };

  const exportAlles = () => {
    if (nurZukunft.length === 0) return;
    laadIcsErof(baueIcsKalenner(nurZukunft.map((x) => ({ ...x, Schüler: ufweis(x.Schüler) }))), "PPREN_Rendezvousen.ics");
  };

  const exportEent = (r) => {
    const dateiName = `PPREN_${(r.Schüler || "").replace(/\s+/g, "_")}_${(r.Datum || "").replace(/\./g, "-")}.ics`;
    laadIcsErof(baueIcsKalenner([{ ...r, Schüler: ufweis(r.Schüler) }]), dateiName);
  };

  // Virschlag no Deeg gruppéieren
  const virschlagDeeg = useMemo(() => {
    if (!virschlag) return [];
    const g = {};
    virschlag.forEach((v, idx) => { (g[v.iso] = g[v.iso] || []).push({ ...v, idx }); });
    return Object.keys(g).sort().map((iso) => ({ iso, eintraeg: g[iso].sort((a, b) => a.zaeit.localeCompare(b.zaeit)) }));
  }, [virschlag]);
  const kapazitéit = (() => {
    const d = Number(dauer) || 10, p = Number(puffer) || 0;
    const v = VIRBEREEDUNG[typ] || 0;
    const pro2 = (s) => Math.floor((minVun(s.bis) - minVun(s.vun) - v + p) / (d + p));
    return { me: pro2(SLOTS[1]), de: pro2(SLOTS[2]) };
  })();

  const mailCheckbox = (
    <>
      <label className="check">
        <input type="checkbox" checked={mailSchecken} onChange={(e) => setMailSchecken(e.target.checked)} />
        📧 Schüler direkt per Mail informéieren (mat Kalennerdatei .ics) — 2 Deeg virdrun kënnt nach eng Erënnerung
      </label>
      {mailSchecken && (
        <details className="mail-editor">
          <summary>✉️ Mail-Text kucken / änneren</summary>
          <p className="hint">{"{virnumm}"}, {"{terminer}"}, {"{ziler}"} (aus dem Projektplang) an {"{meilensteng}"} (déi eege Meilesteng bis zum Termin, mat ✔/☐, plus déi nächst 2) ginn automatesch fir all Schüler ersat. Den Termin steet ausserdeem am Suivi vum Schüler (Iwwerbléck uewen + Kaart „📅 Termine mam Prof“).</p>
          <textarea className="textarea mail-text" rows={16} value={mailText} onChange={(e) => setMailText(e.target.value)} />
          <button className="btn-link" onClick={() => setMailText(MAIL_VIRLAGEN[typ] || "")}>↺ Virschlag zerécksetzen</button>
        </details>
      )}
    </>
  );

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">Rendez-vous'er plangen · Sciences Environnementales</span>
        </div>
      </header>

      <main className="content">
        <div className="tabs">
          <button className={`tab ${modus === "auto" ? "tab-aktiv" : ""}`} onClick={() => setModus("auto")}>⚡ Ganz Klass automatesch plangen</button>
          <button className={`tab ${modus === "eenzel" ? "tab-aktiv" : ""}`} onClick={() => setModus("eenzel")}>👤 Eenzelen Rendez-vous</button>
        </div>

        {modus === "auto" && (
          <section className="card">
            <h2>Ganz Klass automatesch plangen</h2>
            <p className="hint">
              ⏰ Fräi Zäit: <b>Méindes 13:10–15:50</b> ({kapazitéit.me} Plazen) an <b>Dënschdes 13:10–14:50</b> ({kapazitéit.de} Plazen) bei {dauer} Min.
              {Number(puffer) ? ` + ${puffer} Min. Wiessel` : ""}.
              {VIRBEREEDUNG[typ] ? ` Fachgespréich: ${VIRBEREEDUNG[typ]} Min. Virbereedung virdrun (déi éischt um 13:10, d'Gespréich ab 13:${10 + VIRBEREEDUNG[typ]}) — den Hiwäis kënnt automatesch an d'Mail.` : ""} Besat Zäiten (aner Rendez-vousen) ginn iwwersprongen.
            </p>
            <div className="grid3">
              <label className="field">
                <span className="field-label">Klass</span>
                <select className="select" value={klass} onChange={(e) => setKlass(e.target.value)}>
                  {KLASSEN.map((k) => <option key={k} value={k}>{k}</option>)}
                </select>
              </label>
              <label className="field">
                <span className="field-label">Typ</span>
                <select className="select" value={typ} onChange={(e) => setTyp(e.target.value)}>
                  {TYPEN.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </label>
              <div className="grid2 grid-tight">
                <label className="field">
                  <span className="field-label">Dauer (Min.)</span>
                  <input type="number" min="5" step="1" className="input" value={dauer} onChange={(e) => setDauer(e.target.value)} />
                </label>
                <label className="field">
                  <span className="field-label">Wiessel (Min.)</span>
                  <input type="number" min="0" step="5" className="input" value={puffer} onChange={(e) => setPuffer(e.target.value)} />
                </label>
                {(DAUER_OPTIOUNEN[typ] || []).length > 0 && (
                  <div className="dauer-knaepp">
                    {DAUER_OPTIOUNEN[typ].map((m) => (
                      <button key={m} className={`chip chip-btn ${Number(dauer) === m ? "chip-an" : ""}`} onClick={() => { setDauer(m); setVirschlag(null); }}>{m} Min.</button>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="grid2">
              <label className="field">
                <span className="field-label">Termin aus der Timeline ({klass})</span>
                <select className="select" value={anker} onChange={(e) => {
                  setAnker(e.target.value);
                  const a = ankerLescht.find((x) => x.key === e.target.value);
                  if (a) setStartIso(a.montag);
                }}>
                  {ankerLescht.length === 0 && <option value="">– keng opstoend Terminer –</option>}
                  {ankerLescht.map((a) => (
                    <option key={a.key} value={a.key}>
                      Woch vum {kuerz(a.montag)} · {a.titel} ({a.deeg.map((d) => `${DEEG[wochendag(d)]} ${kuerz(d)}`).join(", ")})
                    </option>
                  ))}
                </select>
              </label>
              <label className="field">
                <span className="field-label">Plangen ab der Woch vum</span>
                <input type="date" className="input" value={startIso} onChange={(e) => { setStartIso(e.target.value); setAnker(""); }} />
              </label>
            </div>

            <span className="field-label">Schüler/-innen ({klassSchueler.length - ofgewielt.size} vun {klassSchueler.length})</span>
            <div className="schueler-chips">
              {klassSchueler.map((s) => {
                const schonn = schonnGeplangt(s);
                const dran = !ofgewielt.has(s.id);
                return (
                  <label key={s.id} className={`chip ${dran ? "chip-an" : ""}`} title={schonn ? `Huet schonn: ${schonn.Typ} de ${schonn.Datum}` : ""}>
                    <input type="checkbox" checked={dran} onChange={() => {
                      const n = new Set(ofgewielt); dran ? n.add(s.id) : n.delete(s.id); setOfgewielt(n); setVirschlag(null);
                    }} />
                    {s.virnumm || s.name}{schonn ? ` ✔︎ ${schonn.Datum}` : ""}
                  </label>
                );
              })}
            </div>
            <label className="field">
              <span className="field-label">Notiz fir all (optional — kënnt an d'Mail)</span>
              <textarea className="textarea" rows={2} value={notiz} onChange={(e) => setNotiz(e.target.value)} placeholder="z. B. Raum B214" />
            </label>
            <button className="btn btn-sec" disabled={klassSchueler.length - ofgewielt.size === 0} onClick={() => maachVirschlag()}>
              🔄 Virschlag maachen
            </button>

            {virschlag && (
              <div className="virschlag">
                {virschlag.length === 0 && <p className="notice">Keng fräi Plaz fonnt.</p>}
                {virschlagDeeg.map((d) => (
                  <div key={d.iso} className="dag-block">
                    <div className="dag-kapp">
                      <span>{DEEG_LANG[wochendag(d.iso)]}, {isoZuDmy(d.iso)}</span>
                      <button className="btn-link" onClick={() => dagAusloossen(d.iso)} title="Ferien/Ausfall – dësen Dag net benotzen">✕ Dag ausloossen</button>
                    </div>
                    <table className="tabelle">
                      <tbody>
                        {d.eintraeg.map((v) => (
                          <tr key={v.idx}>
                            <td className="col-zaeit"><input type="time" className="input input-kleng" value={v.zaeit} onChange={(e) => virschlagAenneren(v.idx, "zaeit", e.target.value)} /></td>
                            <td>{zaeitVun(minVun(v.zaeit) + Number(v.dauer))}</td>
                            <td>{v.virnumm ? `${v.virnumm} · ` : ""}{v.name}</td>
                            <td><input type="date" className="input input-kleng" value={v.iso} onChange={(e) => virschlagAenneren(v.idx, "iso", e.target.value)} /></td>
                            <td><button className="icon-btn" title="Aus dem Virschlag huelen" onClick={() => setVirschlag((x) => x.filter((_, i) => i !== v.idx))}>✕</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ))}
                {ausgeloos.size > 0 && (
                  <p className="notice">Ausgeloos: {[...ausgeloos].sort().map(isoZuDmy).join(", ")} · <button className="btn-link" onClick={() => { setAusgeloos(new Set()); maachVirschlag(new Set()); }}>zerécksetzen</button></p>
                )}
                {netPlaz.length > 0 && <div className="sync-error">Keng Plaz fonnt fir: {netPlaz.map((s) => s.virnumm || s.name).join(", ")}</div>}
                {mailCheckbox}
                {error && <div className="sync-error">{error}</div>}
                <button className="btn btn-primary" disabled={syncing || virschlag.length === 0} onClick={autoSpaicheren}>
                  {syncing ? "Späichert…" : `✅ ${virschlag.length} Rendez-vous(en) späicheren${mailSchecken ? " & Mail schécken" : ""}`}
                </button>
              </div>
            )}
          </section>
        )}

        {modus === "eenzel" && (
          <section className="card">
            <h2>Neien Rendez-vous plangen</h2>
            <div className="grid2">
              <label className="field">
                <span className="field-label">Schüler/-in</span>
                <select className="select" value={schuelerId} onChange={(e) => setSchuelerId(e.target.value)}>
                  <option value="">– auswählen –</option>
                  {SCHUELER.map((s) => <option key={s.id} value={s.id}>{s.virnumm ? `${s.virnumm} — ` : ""}{s.name} ({s.klasse})</option>)}
                </select>
              </label>
              <label className="field">
                <span className="field-label">Typ</span>
                <select className="select" value={typ} onChange={(e) => setTyp(e.target.value)}>
                  {TYPEN.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </label>
            </div>
            {eenzelAnker.length > 0 && (
              <div className="field">
                <span className="field-label">Timeline {currentSchueler.klasse} — klicken fir d'Woch ze iwwerhuelen</span>
                <div className="schueler-chips">
                  {eenzelAnker.map((a) => (
                    <button key={a.key} className="chip chip-btn" onClick={() => setDatum(a.montag < heidegIso ? heidegIso : a.montag)}>
                      {kuerz(a.deeg[0])} · {a.titel}
                    </button>
                  ))}
                </div>
              </div>
            )}
            <div className="grid3">
              <label className="field">
                <span className="field-label">Datum</span>
                <input type="date" className="input" value={datum} onChange={(e) => setDatum(e.target.value)} />
              </label>
              <label className="field">
                <span className="field-label">Zäit (optional)</span>
                <input type="time" className="input" value={zaeit} onChange={(e) => setZaeit(e.target.value)} />
              </label>
              <label className="field">
                <span className="field-label">Dauer (Min.)</span>
                <input type="number" min="5" step="1" className="input" value={dauer} onChange={(e) => setDauer(e.target.value)} />
              </label>
            </div>
            <button className="btn-gen btn-slot" onClick={nächstSlot}>⏱ Nächste fräie Slot ab dësem Datum (Mé/Dë)</button>
            <label className="field">
              <span className="field-label">Notiz (optional — gëtt an der Mail matgeschéckt)</span>
              <textarea className="textarea" rows={2} value={notiz} onChange={(e) => setNotiz(e.target.value)} />
            </label>
            {mailCheckbox}
            {error && <div className="sync-error">{error}</div>}
            <button className="btn btn-primary" disabled={!canSubmit || syncing} onClick={plangen}>
              {syncing ? "Plangt…" : "📅 Rendez-vous plangen"}
            </button>
          </section>
        )}

        <section className="card">
          <div className="card-head-row">
            <h2>Opstoend Rendez-vous'er</h2>
            <button className="btn-gen" disabled={nurZukunft.length === 0} onClick={exportAlles}>
              📆 Alles als .ics exportéieren
            </button>
          </div>
          <p className="hint">Den Export funktionéiert mat Google Kalenner, Outlook, Apple Kalenner asw. — Datei einfach opmaachen oder an den eegene Kalenner importéieren.</p>
          {loading && <p className="notice">Lädt…</p>}
          {!loading && nurZukunft.length === 0 && <p className="notice">Nach keng geplangt.</p>}
          {!loading && nurZukunft.length > 0 && (
            <table className="tabelle">
              <thead><tr><th>Datum</th><th>Zäit</th><th>Schüler/-in</th><th>Typ</th><th>Erënnert?</th><th></th><th></th></tr></thead>
              <tbody>
                {nurZukunft.map((r, i) => (
                  <tr key={i}>
                    <td>{r.Datum || "–"}</td>
                    <td>{istZaeit(r.Zäit) ? r.Zäit + (r.Dauer ? `–${zaeitVun(minVun(r.Zäit) + Number(r.Dauer))}` : "") : "–"}</td>
                    <td>{ufweis(r.Schüler)}</td>
                    <td>{r.Typ}</td>
                    <td><span className={`pill ${r.Erënnert === "Jo" ? "pill-done" : "pill-pending"}`}>{r.Erënnert === "Jo" ? "Jo" : "Nach net"}</span></td>
                    <td><button className="icon-btn icon-btn-kal" onClick={() => exportEent(r)} title="Als .ics exportéieren">📅</button></td>
                    <td><button className="icon-btn" onClick={() => läschen(r.ID)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </section>

        {vergaangen.length > 0 && (
          <section className="card">
            <h2>Vergaangen</h2>
            <table className="tabelle">
              <thead><tr><th>Datum</th><th>Schüler/-in</th><th>Typ</th></tr></thead>
              <tbody>
                {vergaangen.slice(-10).map((r, i) => (
                  <tr key={i}><td>{r.Datum || "–"}</td><td>{ufweis(r.Schüler)}</td><td>{r.Typ}</td></tr>
                ))}
              </tbody>
            </table>
          </section>
        )}
      </main>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>

.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; }
.brand-sub { font-size: 13px; opacity: 0.85; }
.content { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

.card h2 { font-size: 15px; margin: 0 0 12px; color: #00A94F; }

.select, .input, .textarea { border: 1px solid #c9d5cd; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; background: #fff; color: #1c2621; width: 100%; }
.textarea { resize: vertical; }
.hint { font-size: 11.5px; color: #6d7d74; background: #eef3ef; padding: 8px 12px; border-radius: 7px; margin-bottom: 12px; }
.notice { font-size: 12.5px; color: #6d7d74; }
.sync-error { color: #8a2b1f; font-size: 12.5px; background: #fbe4e1; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
.btn { font-size: 13.5px; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; }
.btn-primary { background: #00A94F; color: #fff; }
.btn-primary:disabled { background: #b7c6bd; cursor: not-allowed; }
.btn-gen { font-size: 11.5px; font-weight: 700; color: #00A94F; background: #eef3ef; border: 1px solid #c9d5cd; padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn-gen:disabled { color: #b7c6bd; cursor: not-allowed; }

.tabelle th { text-align: left; font-size: 11px; text-transform: uppercase; color: #6d7d74; padding: 6px 8px; border-bottom: 1px solid #eef1ef; }
.tabelle td { padding: 7px 8px; font-size: 13px; border-bottom: 1px solid #f4f6f4; }

.pill-pending { background: #e6e9e6; color: #55625a; }
.pill-done { background: #d7ecdd; color: #00A94F; }
.icon-btn { border: none; background: transparent; color: #99392f; cursor: pointer; font-size: 13px; width: 24px; height: 24px; border-radius: 6px; }

.btn-sec { background: #eef3ef; color: #00A94F; border: 1px solid #00A94F; }
.btn-sec:disabled { color: #b7c6bd; border-color: #c9d5cd; cursor: not-allowed; }
.btn-slot { margin: -4px 0 14px; }
.btn-link { border: none; background: none; color: #99392f; font-size: 11.5px; cursor: pointer; padding: 0; font-family: inherit; }

.col-zaeit { width: 110px; }
.input-kleng { padding: 4px 6px; font-size: 12.5px; width: auto; }

.mail-editor { margin: 0 0 14px; }
.mail-editor summary { font-size: 12.5px; font-weight: 700; color: #294f3c; cursor: pointer; margin-bottom: 8px; }

.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: #294f3c; margin: 4px 0 14px; cursor: pointer; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
</style>
</body>
</html>
