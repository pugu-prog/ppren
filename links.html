<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN – Sciences Environnementales</title>
<script>
  // Zentral Astigspunkt: kennt direkt d'Roll (aus enger gëlteger Session) a
  // leet ouni Ëmweg op déi passend Hub-Säit weider — Proffen op proffen.html,
  // Schüler op schueler.html. Ouni gëlteg Session: direkt op d'Umeldung.
  // (function() wielt "replace" amplaz "href", fir dëse Sprong net an der
  // Browser-Historique ze hannerloossen — "Zréck" landt sou net hei erëm.)
  (function () {
    var token = localStorage.getItem("ppren_token");
    var rolle = localStorage.getItem("ppren_rolle");
    if (token && rolle) {
      window.location.replace(rolle === "Prof" ? "proffen.html" : "schueler.html");
    } else {
      window.location.replace("login.html");
    }
  })();
</script>
</head>
<body>
<div class="page">
  <img class="logo" src="LogoSE_weisHintergrund.png" alt="" />
  <div class="spinner"></div>
  <p class="hint">Ee Moment, mir leeden dech weider…</p>
  <noscript>
    <p>JavaScript ass néideg. <a href="login.html">Weider zur Umeldung</a></p>
  </noscript>
</div>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #ffffff; }
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .logo { width: 96px; height: auto; opacity: 0.92; }
  .spinner { width: 26px; height: 26px; border: 3px solid #e2e8e3; border-top-color: #00A94F; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .hint { font-size: 13px; color: #6d7d74; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
