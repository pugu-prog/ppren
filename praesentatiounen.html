<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN Presentatiounen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #f6f8f6; }
  .hero { background: #1c2621; padding: 40px 22px 30px; text-align: center; }
  .hero-bar { height: 3px; width: 90px; background: #F67E1B; margin: 0 auto 14px; border-radius: 2px; }
  .hero h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; color: #fff; }
  .hero p { font-size: 13px; color: #c9d5cd; margin: 0; }
  .content { max-width: 760px; margin: 0 auto; padding: 30px 20px 60px; }
  .grid { display: grid; gap: 14px; }
  .card { display: flex; gap: 16px; background: #fff; border: 1px solid #e2e8e3; border-radius: 14px; padding: 18px 20px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(28,38,33,0.03); transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
  .card:hover { border-color: #00A94F; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,169,79,0.12); }
  .card-icon { font-size: 30px; flex-shrink: 0; }
  .card-body { flex: 1; }
  .card-label { font-weight: 800; font-size: 15.5px; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: #93a098; margin-bottom: 6px; }
  .card-desc { font-size: 12.5px; color: #6d7d74; line-height: 1.5; }
  .empty-note { text-align: center; color: #93a098; font-size: 12.5px; margin-top: 40px; line-height: 1.6; }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-bar"></div>
    <h1>📊 PPREN Presentatiounen</h1>
    <p>All Presentatiounen fir d'Direktioun, Kolleegen oder aner Zwecker — ëmmer aktuell</p>
  </header>
  <main class="content">
    <div class="grid" id="grid"></div>
    <p class="empty-note">Nei Presentatiounen ginn hei automatesch mat opgelëscht, soubal se derbäigesat ginn.</p>
  </main>

<script>
/* Nei Presentatioun derbäisetzen: einfach en Objet hei uewen an der Lëscht derbäisetzen. */
const PRAESENTATIOUNEN = [
  {
    icon: "🏛️",
    label: "PPREN Präsentatioun — Direktioun",
    datum: "September 2026",
    desc: "Komplett Iwwersiicht iwwer d'Plattform: Kontext, Architektur, all Modul (M1–M11), Dateschutz, Status a nächst Schrëtter.",
    link: "praesentatioun-direktioun.html",
  },
];

const grid = document.getElementById("grid");
PRAESENTATIOUNEN.forEach((p) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = p.link;
  a.innerHTML = `
    <span class="card-icon">${p.icon}</span>
    <div class="card-body">
      <div class="card-label">${p.label}</div>
      <div class="card-meta">${p.datum}</div>
      <div class="card-desc">${p.desc}</div>
    </div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
