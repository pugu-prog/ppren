<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPREN Personen verwalten</title>
<script>window.PPREN_ERFUERDERT_ROLLE = "Prof";</script>
<script src="auth-guard.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' + (e.message || "") + "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect } = React;
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";
const KLASSEN = ["1GSE", "2GSE"];

function App() {
  const [personen, setPersonen] = useState([]);
  const [loading, setLoading] = useState(true);
  const [numm, setNumm] = useState(""); // Proffen: ganze Numm. Schüler: net benotzt.
  const [virnumm, setVirnumm] = useState(""); // Schüler: Virnumm (eenzegt Numm-Feld)
  const [rolle, setRolle] = useState("Schüler");
  const [klasse, setKlasse] = useState("1GSE");
  const [email, setEmail] = useState("");
  const [passwuert, setPasswuert] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [error, setError] = useState(null);
  const [neiPersoun, setNeiPersoun] = useState(null); // { matrikel, pin }
  const [sessiounPins, setSessiounPins] = useState([]);

  const [bulkNimm, setBulkNimm] = useState("");
  const [bulkRolle, setBulkRolle] = useState("Schüler");
  const [bulkKlasse, setBulkKlasse] = useState("1GSE");
  const [bulkSyncing, setBulkSyncing] = useState(false);
  const [bulkError, setBulkError] = useState(null);
  const [bulkResultater, setBulkResultater] = useState(null);

  const [resetNumm, setResetNumm] = useState(null);
  const [resetPasswuert, setResetPasswuert] = useState("");
  const [resetSyncing, setResetSyncing] = useState(false);
  const [resetErgebnis, setResetErgebnis] = useState(null);

  const token = () => window.PPREN_SESSION?.token || "";

  const lade = () => {
    setLoading(true);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(token()))
      .then((r) => r.json())
      .then((d) => setPersonen(d.personen || []))
      .finally(() => setLoading(false));
  };
  useEffect(() => { lade(); }, []);

  const speicheren = async () => {
    if (rolle === "Prof" && !numm.trim()) { setError("Numm erfuerderlech."); return; }
    if (rolle === "Schüler" && !virnumm.trim()) { setError("Virnumm erfuerderlech."); return; }
    setSyncing(true);
    setError(null);
    setNeiPersoun(null);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          typ: "personSpäicheren", proffToken: token(),
          numm: rolle === "Prof" ? numm.trim() : "",
          virnumm: rolle === "Schüler" ? virnumm.trim() : "",
          rolle, klasse: rolle === "Schüler" ? klasse : "",
          email: email.trim(), pin: passwuert.trim(),
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      if (data.neiPin) {
        setNeiPersoun({ matrikel: data.matrikel, pin: data.neiPin });
        setSessiounPins((l) => [...l, { numm: data.matrikel, pin: data.neiPin, zäit: new Date().toLocaleTimeString("de-DE") }]);
      }
      setNumm(""); setVirnumm(""); setEmail(""); setPasswuert("");
      lade();
    } catch (e) {
      setError(e.message);
    } finally {
      setSyncing(false);
    }
  };

  const bulkSpeicheren = async () => {
    const nimm = bulkNimm.split("\n").map((n) => n.trim()).filter(Boolean);
    if (nimm.length === 0) { setBulkError(bulkRolle === "Schüler" ? "Weg op d'mannst ee Virnumm aginn (ee pro Zeil)." : "Weg op d'mannst ee Numm aginn (ee pro Zeil)."); return; }
    setBulkSyncing(true);
    setBulkError(null);
    setBulkResultater(null);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          typ: "personenBulkSpäicheren",
          proffToken: token(),
          nimm,
          rolle: bulkRolle,
          klasse: bulkRolle === "Schüler" ? bulkKlasse : "",
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      setBulkResultater(data.resultater || []);
      const jetzt = new Date().toLocaleTimeString("de-DE");
      const neiPins = (data.resultater || [])
        .filter((r) => r.status === "nei" && r.pin)
        .map((r) => ({ numm: r.numm, pin: r.pin, zäit: jetzt }));
      if (neiPins.length > 0) setSessiounPins((l) => [...l, ...neiPins]);
      setBulkNimm("");
      lade();
    } catch (e) {
      setBulkError(e.message);
    } finally {
      setBulkSyncing(false);
    }
  };

  const toggleAktiv = async (p) => {
    try {
      await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "personDeaktivéieren", proffToken: token(), numm: p.numm, aktiv: false }),
      });
      lade();
    } catch (e) { alert(e.message); }
  };

  const permanentLaeschen = async (p) => {
    if (!confirm(`"${p.numm}" PERMANENT läschen? Dëst kann net réckgängeg gemaach ginn — all Login-Zougang geet verluer.`)) return;
    if (!confirm(`Sécher? Ee leschte Kéier: "${p.numm}" wierklech endgülteg läschen?`)) return;
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "personLoeschen", proffToken: token(), numm: p.numm }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      lade();
    } catch (e) { alert(e.message); }
  };

  const passwuertAendernOeffnen = (p) => {
    setResetNumm(p.numm);
    setResetPasswuert("");
    setResetErgebnis(null);
  };

  const passwuertAendernAbsenden = async () => {
    setResetSyncing(true);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          typ: "pinZuruecksetzen", proffToken: token(), numm: resetNumm,
          neiesPasswuert: resetPasswuert.trim(),
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      setResetErgebnis(data.pin);
      setSessiounPins((l) => [...l, { numm: resetNumm, pin: data.pin, zäit: new Date().toLocaleTimeString("de-DE") }]);
    } catch (e) {
      alert(e.message);
    } finally {
      setResetSyncing(false);
    }
  };

  const pinListeEroflueden = () => {
    if (sessiounPins.length === 0) return;
    const kopfZeil = "PPREN – Passwierder/PINs generéiert an dëser Sessioun (" + new Date().toLocaleDateString("de-DE") + ")\n" +
      "⚠️ Dës Datei enthält Kloertext-Passwierder — sécher späicheren an duerno läschen!\n\n";
    const zeilen = sessiounPins.map((p) => `${p.numm.padEnd(28)} ${p.pin}   (${p.zäit})`).join("\n");
    const inhalt = kopfZeil + zeilen + "\n";
    const blob = new Blob([inhalt], { type: "text/plain;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `PPREN_Passwierder_${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const anzuelNei = bulkResultater ? bulkResultater.filter((r) => r.status === "nei").length : 0;
  const anzuelSchoDo = bulkResultater ? bulkResultater.filter((r) => r.status === "scho do").length : 0;

  return (
    <div className="wrap">
      <header className="topbar">
        <span className="brand-mark">PPREN</span>
        <span className="brand-sub">Personen verwalten · nëmmen Proffen</span>
      </header>
      <main className="content">
        {sessiounPins.length > 0 && (
          <div className="download-banner">
            <span>📄 {sessiounPins.length} nei Passwuert/PIN{sessiounPins.length > 1 ? "er" : ""} an dëser Sessioun generéiert.</span>
            <button className="btn-klein" onClick={pinListeEroflueden}>⬇️ Lëscht eroflueden</button>
          </div>
        )}
        <section className="card">
          <h2>Nei Persoun</h2>
          <div className="grid2">
            {rolle === "Prof" ? (
              <label className="field"><span>Numm</span><input className="input" value={numm} onChange={(e) => setNumm(e.target.value)} placeholder="Virnumm Familljennumm" /></label>
            ) : (
              <label className="field"><span>Virnumm</span><input className="input" value={virnumm} onChange={(e) => setVirnumm(e.target.value)} placeholder="z.B. Ben" /></label>
            )}
            <label className="field"><span>Roll</span>
              <select className="select" value={rolle} onChange={(e) => setRolle(e.target.value)}>
                <option value="Schüler">Schüler</option>
                <option value="Prof">Prof</option>
              </select>
            </label>
          </div>
          {rolle === "Schüler" && (
            <>
              <label className="field"><span>Klasse</span>
                <select className="select" value={klasse} onChange={(e) => setKlasse(e.target.value)}>
                  {KLASSEN.map((k) => <option key={k} value={k}>{k}</option>)}
                </select>
              </label>
              <p className="hint">ℹ️ D'Matrikelnummer gëtt automatesch generéiert (z.B. 26-1GSE-01) — kee Familljennumm gëtt gespäichert.</p>
            </>
          )}
          <label className="field">
            <span>Passwuert (optional — mindestens 6 Zeechen fir e stäerkert Passwuert unzeginn; eidel loossen fir en automateschen 4-Zuel-PIN)</span>
            <input className="input" type="text" value={passwuert} onChange={(e) => setPasswuert(e.target.value)} placeholder="z.B. Waasser2027!" />
          </label>
          <label className="field"><span>Email (optional)</span><input className="input" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
          {error && <p className="error">{error}</p>}
          <button className="btn" disabled={syncing} onClick={speicheren}>{syncing ? "…" : "➕ Derbäisetzen"}</button>
          {neiPersoun && (
            <div className="pin-box">
              <span>Nei Matrikel: <strong>{neiPersoun.matrikel}</strong></span>
              <span>PIN/Passwuert:</span>
              <span className="pin-zuel">{neiPersoun.pin}</span>
            </div>
          )}
        </section>

        <section className="card">
          <h2>Vill Persoune mat enger Lëscht derbäisetzen</h2>
          <p className="hint">
            {bulkRolle === "Schüler"
              ? <>Ee Virnumm pro Zeil (z.B. aus enger Klasslëscht). D'Matrikelnummer gëtt automatesch fir all Persoun generéiert.</>
              : <>Ee ganze Numm pro Zeil. Persounen, déi et scho gëtt, ginn iwwersprongen.</>}
          </p>
          <div className="grid2">
            <label className="field"><span>Roll</span>
              <select className="select" value={bulkRolle} onChange={(e) => setBulkRolle(e.target.value)}>
                <option value="Schüler">Schüler</option>
                <option value="Prof">Prof</option>
              </select>
            </label>
            {bulkRolle === "Schüler" && (
              <label className="field"><span>Klasse</span>
                <select className="select" value={bulkKlasse} onChange={(e) => setBulkKlasse(e.target.value)}>
                  {KLASSEN.map((k) => <option key={k} value={k}>{k}</option>)}
                </select>
              </label>
            )}
          </div>
          <label className="field">
            <span>{bulkRolle === "Schüler" ? "Virnimm (ee pro Zeil)" : "Nimm (ee pro Zeil)"}</span>
            <textarea
              className="textarea"
              rows={6}
              placeholder={bulkRolle === "Schüler" ? "Léa\nBen\nNoah" : "Guy Putz\nPol Medernach"}
              value={bulkNimm}
              onChange={(e) => setBulkNimm(e.target.value)}
            />
          </label>
          {bulkError && <p className="error">{bulkError}</p>}
          <button className="btn" disabled={bulkSyncing} onClick={bulkSpeicheren}>
            {bulkSyncing ? "…" : "📋 Lëscht derbäisetzen"}
          </button>

          {bulkResultater && (
            <div className="bulk-resultat">
              <p className="bulk-summary">✅ {anzuelNei} nei derbäigesat{anzuelSchoDo > 0 ? ` · ${anzuelSchoDo} scho virhannen (iwwersprongen)` : ""}</p>
              <table className="tabelle">
                <thead><tr><th>{bulkRolle === "Schüler" ? "Matrikel" : "Numm"}</th><th>Virnumm</th><th>Status</th><th>PIN</th></tr></thead>
                <tbody>
                  {bulkResultater.map((r, i) => (
                    <tr key={i}>
                      <td>{r.numm}</td>
                      <td>{r.virnumm || "–"}</td>
                      <td>{r.status === "nei" ? "✅ nei" : "⏭️ scho do"}</td>
                      <td className="pin-zell">{r.pin || "–"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className="hint" style={{ marginTop: "10px" }}>⚠️ Dës PINs ginn hei nëmmen eemol ugewisen — notéier oder exportéier se, ier s du dës Säit verléiss.</p>
            </div>
          )}
        </section>

        <section className="card">
          <h2>All Personen</h2>
          {loading && <p>Lädt…</p>}
          {!loading && (
            <table className="tabelle">
              <thead><tr><th>Virnumm</th><th>Matrikel/Numm</th><th>Roll</th><th>Klasse</th><th></th></tr></thead>
              <tbody>
                {personen.map((p, i) => (
                  <React.Fragment key={i}>
                    <tr>
                      <td>{p.virnumm || "–"}</td><td>{p.numm}</td><td>{p.rolle}</td><td>{p.klasse || "–"}</td>
                      <td className="aktioun-zell">
                        <button className="icon-btn icon-btn-blo" onClick={() => passwuertAendernOeffnen(p)}>🔑 Passwuert</button>
                        <button className="icon-btn" onClick={() => toggleAktiv(p)}>Deaktivéieren</button>
                        <button className="icon-btn icon-btn-rout" onClick={() => permanentLaeschen(p)}>🗑️ Läschen</button>
                      </td>
                    </tr>
                    {resetNumm === p.numm && (
                      <tr className="reset-zeil">
                        <td colSpan={5}>
                          <div className="reset-box">
                            <span className="reset-label">Neit Passwuert fir <strong>{p.virnumm ? `${p.virnumm} (${p.numm})` : p.numm}</strong> setzen:</span>
                            <input
                              className="input reset-input"
                              type="text"
                              value={resetPasswuert}
                              onChange={(e) => setResetPasswuert(e.target.value)}
                              placeholder="mindestens 6 Zeechen fir e stäerkert Passwuert, oder eidel fir automatesche 4-Zuel-PIN"
                            />
                            <button className="btn-klein" disabled={resetSyncing} onClick={passwuertAendernAbsenden}>
                              {resetSyncing ? "…" : "Späicheren"}
                            </button>
                            <button className="btn-klein btn-klein-ghost" onClick={() => setResetNumm(null)}>Ofbriechen</button>
                            {resetErgebnis && (
                              <div className="reset-ergebnis">
                                ✅ Neit Passwuert/PIN: <span className="pin-zuel-klein">{resetErgebnis}</span>
                              </div>
                            )}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          )}
        </section>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: sans-serif; background: #f6f8f6; color: #1c2621; }
.topbar { padding: 14px 22px; background: #00A94F; color: #fff; display: flex; gap: 10px; align-items: baseline; }
.brand-mark { font-weight: 800; } .content { max-width: 640px; margin: 0 auto; padding: 24px 20px; }
.card { background: #fff; border: 1px solid #e2e8e3; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.download-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #eaf0f8; color: #294f3c; border: 1px solid #c3d3e6; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.card h2 { color: #00A94F; margin-top: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 12.5px; font-weight: 700; color: #294f3c; }
.input, .select, .textarea { border: 1px solid #c9d5cd; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; width: 100%; }
.textarea { resize: vertical; font-family: ui-monospace, monospace; }
.hint { font-size: 11.5px; color: #6d7d74; margin: 0 0 12px; line-height: 1.6; }
.hint code { background: #eef3ef; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
.btn { background: #00A94F; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
.btn:disabled { background: #b7c6bd; cursor: not-allowed; }
.error { color: #8a2b1f; background: #fbe4e1; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px; }
.pin-box { margin-top: 12px; background: #eef3ef; padding: 12px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.pin-zuel { display: block; font-size: 24px; font-weight: 800; color: #00A94F; letter-spacing: 6px; word-break: break-all; }
.bulk-resultat { margin-top: 14px; padding-top: 14px; border-top: 1px solid #eef1ef; }
.bulk-summary { font-size: 13px; font-weight: 700; color: #294f3c; margin: 0 0 10px; }
.pin-zell { font-weight: 800; color: #00A94F; letter-spacing: 2px; }
.tabelle { width: 100%; border-collapse: collapse; }
.tabelle th { text-align: left; font-size: 11px; color: #6d7d74; padding: 6px; }
.tabelle td { padding: 7px 6px; font-size: 13px; border-top: 1px solid #f4f6f4; }
.aktioun-zell { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn { font-size: 11px; color: #99392f; background: #fbe4e1; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.icon-btn-blo { color: #4576B5; background: #eaf0f8; }
.icon-btn-rout { color: #fff; background: #99392f; }
.reset-zeil td { background: #fafbfa; padding: 10px 6px; }
.reset-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.reset-label { font-size: 12.5px; font-weight: 700; color: #294f3c; }
.reset-input { flex: 1; min-width: 220px; }
.btn-klein { background: #00A94F; color: #fff; border: none; padding: 7px 12px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-klein-ghost { background: #eef3ef; color: #294f3c; }
.reset-ergebnis { width: 100%; font-size: 12.5px; color: #00A94F; font-weight: 700; }
.pin-zuel-klein { font-size: 15px; letter-spacing: 2px; }
</style>
</body>
</html>
