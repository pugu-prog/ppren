<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN Wochenberichter korrigéieren</title>
<script>window.PPREN_ERFUERDERT_ROLLE = "Prof";</script>
<script src="auth-guard.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' +
      (e.message || "Unbekannter Fehler") +
      (e.filename ? "\n\nDatei: " + e.filename + " Zeile " + e.lineno : "") +
      "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

const PERIODEN_2GSE = ["Trimester 1", "Trimester 2", "Trimester 3"];
const PERIODEN_1GSE = ["Semester 1", "Semester 2"];

function montagDerWoche(datum) {
  const d = new Date(datum);
  const tag = d.getDay();
  const diff = d.getDate() - tag + (tag === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}
function formatDatum(d) {
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function wocheLabelFuerDatum(datum) {
  const montag = montagDerWoche(new Date(datum));
  const sonntag = new Date(montag);
  sonntag.setDate(montag.getDate() + 6);
  return `${formatDatum(montag)} – ${formatDatum(sonntag)}`;
}

function dateiZuBase64(datei) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(datei);
  });
}

const MAX_DATEI_MB = 10;

// Virgefäerdegt Sätz fir de Kommentar zum Wochenbericht (nom Muster vun de
// Remarquen an der Bewertung). Een Klick hänkt de Saz un de Kommentar un; dee
// bleift ëmmer fräi editéierbar, d'Sätz sinn nëmmen Hëllef.
const KOMMENTAR_VORLAGEN = [
  { thema: "Zusammenfassung", positiv: "Die Wochenzusammenfassung ist ausführlich und gut nachvollziehbar.", negativ: "Die Zusammenfassung ist zu kurz bzw. oberflächlich – bitte konkreter beschreiben, was genau gemacht wurde." },
  { thema: "Fortschritt", positiv: "Der Fortschritt im Vergleich zum Plan wird klar und realistisch eingeschätzt.", negativ: "Die Einschätzung des Fortschritts bleibt vage – bitte einen klaren Bezug zum Plan herstellen." },
  { thema: "Meilensteine", positiv: "Gute Verknüpfung mit den Meilensteinen und Zielen des Projektplans.", negativ: "Der Bezug zu den Meilensteinen und Zielen des Projektplans fehlt." },
  { thema: "Probleme", positiv: "Aufgetretene Probleme werden benannt und Lösungsansätze reflektiert.", negativ: "Probleme und Schwierigkeiten werden nicht angesprochen oder nicht reflektiert." },
  { thema: "Nächste Schritte", positiv: "Die nächsten Schritte sind klar und konkret formuliert.", negativ: "Bitte nächste Schritte für die kommende Woche konkret angeben." },
  { thema: "Belege", positiv: "Fotos bzw. Belege dokumentieren die Arbeit sehr gut.", negativ: "Es fehlen Fotos, Belege oder Quellen zur Dokumentation der Arbeit." },
  { thema: "Sprache", positiv: "Sprachlich korrekt und gut verständlich.", negativ: "Auf Rechtschreibung, Grammatik und Satzbau achten." },
  { thema: "Umfang", positiv: "Umfang und Detailtiefe sind angemessen.", negativ: "Der geforderte Mindestumfang (5 Zeilen pro Feld) wurde nicht erreicht." },
  { thema: "Eigenständigkeit", positiv: "Selbstständige und zielstrebige Arbeitsweise erkennbar.", negativ: "Mehr Eigeninitiative bei der Projektarbeit zeigen." },
  { thema: "Pünktlichkeit", positiv: "Der Bericht wurde pünktlich abgegeben.", negativ: "Der Bericht wurde verspätet abgegeben – bitte die Frist (Sonntag 22:00) einhalten." },
  { thema: "Gesamt", positiv: "Insgesamt ein überzeugender Wochenbericht.", negativ: "Insgesamt noch ausbaufähig – bitte die Hinweise beim nächsten Bericht beachten." },
];

function KommentarFeld({ wert, setWert }) {
  const einfuegen = (text) => setWert((alt) => ((alt && !/\s$/.test(alt)) ? alt + " " : (alt || "")) + text);
  return (
    <div className="kommentar-box">
      <span className="modal-label">💬 Kommentar fir de Schüler</span>
      <details className="vorlagen">
        <summary>Virgefäerdegt Sätz (klicken fir un de Kommentar unzehänken)</summary>
        <div className="vorlagen-liste">
          {KOMMENTAR_VORLAGEN.map((v) => (
            <div className="vorlag-row" key={v.thema}>
              <button type="button" className="vorlag-btn vorlag-pos" onClick={() => einfuegen(v.positiv)}>✓ {v.positiv}</button>
              <button type="button" className="vorlag-btn vorlag-neg" onClick={() => einfuegen(v.negativ)}>✗ {v.negativ}</button>
            </div>
          ))}
        </div>
      </details>
      <textarea
        className="kommentar-textarea"
        rows={4}
        value={wert}
        onChange={(e) => setWert(e.target.value)}
        placeholder="Kommentar schreiwen oder Sätz uklicken … (bleift ëmmer editéierbar)"
      />
      {wert && <button type="button" className="link-btn-klein" onClick={() => setWert("")}>Kommentar läschen</button>}
    </div>
  );
}

function App() {
  const [alle, setAlle] = useState([]);
  const [externOffen, setExternOffen] = useState(false);
  const [externSchueler, setExternSchueler] = useState("");
  const [externPeriode, setExternPeriode] = useState("");
  const [externDatum, setExternDatum] = useState("");
  const [externPunkte, setExternPunkte] = useState({ zusammenfassung: "", fortschritt: "", anhaenge: "", grammatik: "" });
  const [externDateien, setExternDateien] = useState([]);
  const [externDragOver, setExternDragOver] = useState(false);
  const [externNotiz, setExternNotiz] = useState("");
  const [externKommentar, setExternKommentar] = useState("");
  const [kommentar, setKommentar] = useState("");
  const [personen, setPersonen] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [filterSchueler, setFilterSchueler] = useState("alle");
  const [filterStatus, setFilterStatus] = useState("Agereecht");
  const [offen, setOffen] = useState(null);
  const [punkte, setPunkte] = useState({ zusammenfassung: "", fortschritt: "", anhaenge: "", grammatik: "" });
  const [syncing, setSyncing] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    fetch(WEB_APP_URL + "?namen=1&token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((r) => r.json())
      .then((d) => setPersonen(d.personen || []))
      .catch(() => {});
  }, []);
  const virnummVun = useMemo(() => {
    const map = {};
    personen.forEach((p) => { if (p.virnumm) map[p.numm] = p.virnumm; });
    return map;
  }, [personen]);
  const ufweis = (numm) => (virnummVun[numm] ? `${virnummVun[numm]} — ${numm}` : numm);

  const lade = () => {
    setLoading(true);
    setError(null);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((res) => res.json())
      .then((data) => setAlle(data.wochenberichte || []))
      .catch(() => setError("Konnte Berichter net lueden."))
      .finally(() => setLoading(false));
  };
  useEffect(() => { lade(); }, []);

  const schuelerListe = useMemo(() => ["alle", ...new Set(alle.map((w) => w.Schüler))], [alle]);

  const gefiltert = alle.filter((w) => {
    if (filterSchueler !== "alle" && w.Schüler !== filterSchueler) return false;
    if (filterStatus !== "alle" && w.Status !== filterStatus) return false;
    return true;
  });

  const oeffnen = (w) => {
    setOffen(w);
    setKommentar(w.Kommentar || "");
    setPunkte({ zusammenfassung: "2", fortschritt: "1.5", anhaenge: "1", grammatik: "0.5" });
  };

  const entschellegen = async () => {
    const grond = prompt("Grond fir d'Entschëllegung (z.B. Krankheet, Attest):");
    if (grond === null) return;
    setSyncing(true);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "wochenberichtEntschellegen", token: window.PPREN_SESSION?.token || "", id: offen.ID, grond }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setToast("Entschëllegt.");
      setOffen(null);
      lade();
    } catch (e) {
      alert("Konnte net späicheren: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 3000);
    }
  };

  // Läscht en automateschen "Verpasst"-Eintrag (0 Punkte). Néideg ass dat
  // normalerweis net méi: eng richteg Ofgab vum Schüler ersetzt den
  // Placeholder automatesch. Mat dësem Knäppchen kann de Prof en awer
  // ganz ewechhuelen (z.B. wann een Schüler guer näischt ofginn muss).
  const remOpmaachen = async () => {
    if (!confirm(`De verpassten Eintrag vun ${ufweis(offen.Schüler)} fir d'Woch ${offen.Woche} läschen, sou datt en/si nach eng Kéier e richtege Bericht ka areechen?`)) return;
    setSyncing(true);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "wochenberichtRemOpmaachen", token: window.PPREN_SESSION?.token || "", id: offen.ID }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setToast("Rem opgemaach — kann elo nach eng Kéier areecht ginn.");
      setOffen(null);
      lade();
    } catch (e) {
      alert("Konnte net rem opmaachen: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 3500);
    }
  };

  const schuelerListeVollstaendeg = useMemo(
    () => personen.filter((p) => p.rolle === "Schüler"),
    [personen]
  );
  const externSchuelerObj = schuelerListeVollstaendeg.find((s) => s.numm === externSchueler);
  const externPerioden = externSchuelerObj?.klasse === "2GSE" ? PERIODEN_2GSE : PERIODEN_1GSE;
  const externWoche = externDatum ? wocheLabelFuerDatum(externDatum) : "";
  const EXTERN_GRENZEN = { zusammenfassung: 2, fortschritt: 1.5, anhaenge: 1, grammatik: 0.5 };
  const externFeldGueltig = (k) => {
    const v = externPunkte[k];
    return v !== "" && !isNaN(Number(v)) && Number(v) >= 0 && Number(v) <= EXTERN_GRENZEN[k];
  };
  const externAllePunkteGueltig = Object.keys(EXTERN_GRENZEN).every(externFeldGueltig);
  const externSumme = Object.keys(EXTERN_GRENZEN).reduce((s, k) => s + (externFeldGueltig(k) ? Number(externPunkte[k]) : 0), 0);
  const externKannSpeicheren = externSchueler && externPeriode && externWoche && externAllePunkteGueltig;
  const EXTERN_FELD_NAMEN = { zusammenfassung: "Punkte Zesummefaassung", fortschritt: "Punkte Fortschrëtt", anhaenge: "Punkte Ahänk", grammatik: "Punkte Grammatik" };
  const externFehlt = [
    !externSchueler && "Schüler/-in",
    !externPeriode && "Periode",
    !externDatum && "Datum aus där Woch",
    ...Object.keys(EXTERN_GRENZEN).filter((k) => !externFeldGueltig(k)).map((k) => EXTERN_FELD_NAMEN[k]),
  ].filter(Boolean);

  const externDateienBeifuegen = (fileList) => {
    const neie = Array.from(fileList || []);
    const zuGross = neie.filter((f) => f.size > MAX_DATEI_MB * 1024 * 1024);
    if (zuGross.length > 0) {
      alert(`Zu grouss (max. ${MAX_DATEI_MB} MB pro Datei): ` + zuGross.map((f) => f.name).join(", "));
    }
    const ok = neie.filter((f) => f.size <= MAX_DATEI_MB * 1024 * 1024);
    setExternDateien((alt) => [...alt, ...ok]);
  };

  // Wochebericht, deen ausserhalb vun der App bewäert gouf (z.B. op Pabeier):
  // mat de véier Punkte-Kategorien (selwecht Skala wéi bei der Korrektur) als
  // "Bewäert" aginn, optional mam Bericht selwer als Datei (Word, PDF, Foto).
  const externSpeicheren = async () => {
    setSyncing(true);
    try {
      const anhaengeDateien = await Promise.all(
        externDateien.map(async (d) => ({
          dateiName: d.name,
          mimeType: d.type || "application/octet-stream",
          inhaltBase64: await dateiZuBase64(d),
        }))
      );
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          typ: "wochenberichtExternEintragen",
          token: window.PPREN_SESSION?.token || "",
          schueler: externSchueler,
          klasse: externSchuelerObj?.klasse || "",
          periode: externPeriode,
          woche: externWoche,
          punkteDetail: {
            zusammenfassung: Number(externPunkte.zusammenfassung),
            fortschritt: Number(externPunkte.fortschritt),
            anhaenge: Number(externPunkte.anhaenge),
            grammatik: Number(externPunkte.grammatik),
          },
          notiz: externNotiz,
          kommentar: externKommentar,
          anhaengeDateien,
        }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setToast(`Extern bewäert Bericht (${externWoche}) agedroen.`);
      setExternDatum("");
      setExternPunkte({ zusammenfassung: "", fortschritt: "", anhaenge: "", grammatik: "" });
      setExternNotiz("");
      setExternKommentar("");
      setExternDateien([]);
      lade();
    } catch (e) {
      alert("Konnte net späicheren: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 3500);
    }
  };

  const kommentarSpeichern = async () => {
    setSyncing(true);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "wochenberichtKommentar", token: window.PPREN_SESSION?.token || "", id: offen.ID, kommentar }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setToast("Kommentar gespäichert.");
      setOffen((o) => (o ? { ...o, Kommentar: kommentar } : o));
      lade();
    } catch (e) {
      alert("Konnte de Kommentar net späicheren: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 3000);
    }
  };

  const speicherePunkte = async () => {
    setSyncing(true);
    try {
      const p = {
        zusammenfassung: Math.min(2, Math.max(0, parseFloat(punkte.zusammenfassung) || 0)),
        fortschritt: Math.min(1.5, Math.max(0, parseFloat(punkte.fortschritt) || 0)),
        anhaenge: Math.min(1, Math.max(0, parseFloat(punkte.anhaenge) || 0)),
        grammatik: Math.min(0.5, Math.max(0, parseFloat(punkte.grammatik) || 0)),
      };
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "wochenberichtBewerten", token: window.PPREN_SESSION?.token || "", id: offen.ID, punkte: p, kommentar }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setToast("Bewäert.");
      setOffen(null);
      lade();
    } catch (e) {
      alert("Konnte net späicheren: " + e.message);
    } finally {
      setSyncing(false);
      setTimeout(() => setToast(null), 3000);
    }
  };

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">Wochenberichter korrigéieren</span>
        </div>
        <button className="refresh-btn" onClick={lade} disabled={loading}>{loading ? "Lädt…" : "🔄 Aktualiséieren"}</button>
      </header>

      <main className="content">
        <div className="controls">
          <select className="select" value={filterSchueler} onChange={(e) => setFilterSchueler(e.target.value)}>
            {schuelerListe.map((s) => <option key={s} value={s}>{s === "alle" ? "All Schüler" : ufweis(s)}</option>)}
          </select>
          <select className="select" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
            <option value="Agereecht">Nach ze korrigéieren</option>
            <option value="Verpasst">Verpasst (automatesch 0)</option>
            <option value="Entschëllegt">Entschëllegt</option>
            <option value="Bewäert">Scho bewäert</option>
            <option value="alle">All</option>
          </select>
          <button className="btn-gen btn-extern" onClick={() => setExternOffen(true)}>➕ Extern bewäert Bericht aginn</button>
        </div>

        {loading && <div className="empty">Lädt…</div>}
        {error && <div className="empty error">{error}</div>}
        {!loading && !error && gefiltert.length === 0 && <div className="empty">Keng Berichter fonnt.</div>}

        {!loading && !error && gefiltert.length > 0 && (
          <table className="table">
            <thead>
              <tr><th>Schüler/-in</th><th>Klasse</th><th>Periode</th><th>Woch</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              {gefiltert.map((w) => (
                <tr key={w.ID}>
                  <td className="cell-strong">{ufweis(w.Schüler)}</td>
                  <td>{w.Klasse}</td>
                  <td>{w.Periode}</td>
                  <td>{w.Woche}</td>
                  <td><span className={`pill ${w.Status === "Bewäert" ? "pill-done" : w.Status === "Verpasst" ? "pill-verpasst" : w.Status === "Entschëllegt" ? "pill-entschellegt" : "pill-pending"}`}>{w.Status}</span>{w.Kommentar ? <span title="Kommentar vorhanden"> 💬</span> : null}</td>
                  <td><button className="btn-gen" onClick={() => oeffnen(w)}>{w.Status === "Agereecht" ? "Korrigéieren" : "Kucken"}</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </main>

      {offen && (
        <div className="modal-overlay" onClick={() => setOffen(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <h2>{ufweis(offen.Schüler)} — {offen.Woche}</h2>

            {offen.Status === "Verpasst" && (
              <p className="verpasst-hint">
                ⚠️ Dëse Bericht gouf automatesch als <strong>"Verpasst"</strong> markéiert (0 Punkte), well de Schüler bis
                zur Frist näischt ofginn huet. Gëtt de Schüler elo nach e richtege Bericht of, ersetzt dee
                <strong> automatesch</strong> dëse Placeholder. Mat "Rem opmaachen" kanns de en och ganz läschen.
              </p>
            )}

            <div className="modal-feld">
              <span className="modal-label">Zesummefaassung</span>
              <p>{offen.Zusammenfassung}</p>
            </div>
            <div className="modal-feld">
              <span className="modal-label">Fortschrëtt</span>
              <p>{offen.Fortschritt}</p>
            </div>
            {offen["Anhänge"] && (
              <div className="modal-feld">
                <span className="modal-label">Ahänk</span>
                <div className="anhaenge-liste">
                  {offen["Anhänge"].split("\n").filter(Boolean).map((zeil, i) =>
                    zeil.trim().startsWith("http") ? (
                      <a key={i} href={zeil.trim()} target="_blank" rel="noreferrer" className="anhang-link">📎 {zeil.trim().split("/").pop() || "Datei " + (i + 1)}</a>
                    ) : (
                      <p key={i}>{zeil}</p>
                    )
                  )}
                </div>
              </div>
            )}

            {offen.Status !== "Verpasst" && (
              <div className="punkte-grid">
                <label className="punkte-feld">
                  <span>Zesummefaassung (max 2)</span>
                  <input type="number" step="0.5" min="0" max="2" value={punkte.zusammenfassung} onChange={(e) => setPunkte({ ...punkte, zusammenfassung: e.target.value })} disabled={offen.Status === "Bewäert"} />
                </label>
                <label className="punkte-feld">
                  <span>Fortschrëtt (max 1,5)</span>
                  <input type="number" step="0.5" min="0" max="1.5" value={punkte.fortschritt} onChange={(e) => setPunkte({ ...punkte, fortschritt: e.target.value })} disabled={offen.Status === "Bewäert"} />
                </label>
                <label className="punkte-feld">
                  <span>Ahänk (max 1)</span>
                  <input type="number" step="0.5" min="0" max="1" value={punkte.anhaenge} onChange={(e) => setPunkte({ ...punkte, anhaenge: e.target.value })} disabled={offen.Status === "Bewäert"} />
                </label>
                <label className="punkte-feld">
                  <span>Grammatik (max 0,5)</span>
                  <input type="number" step="0.5" min="0" max="0.5" value={punkte.grammatik} onChange={(e) => setPunkte({ ...punkte, grammatik: e.target.value })} disabled={offen.Status === "Bewäert"} />
                </label>
              </div>
            )}

            <KommentarFeld wert={kommentar} setWert={setKommentar} />

            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => setOffen(null)}>Zoumaachen</button>
              <button className="btn btn-komm" disabled={syncing} onClick={kommentarSpeichern}>💬 Kommentar späicheren</button>
              {offen.Status === "Verpasst" && (
                <button className="btn btn-open" disabled={syncing} onClick={remOpmaachen}>🔓 Rem opmaachen fir Nogeschécken</button>
              )}
              {(offen.Status === "Agereecht" || offen.Status === "Verpasst") && (
                <button className="btn btn-warn" disabled={syncing} onClick={entschellegen}>🩹 Als entschëllegt markéieren</button>
              )}
              {offen.Status !== "Bewäert" && offen.Status !== "Entschëllegt" && offen.Status !== "Verpasst" && (
                <button className="btn btn-primary" disabled={syncing} onClick={speicherePunkte}>{syncing ? "Späichert…" : "✅ Bewäertung späicheren"}</button>
              )}
            </div>
            {offen.Status === "Entschëllegt" && offen["Entschëllegung-Grond"] && (
              <p className="entschellegung-grond">🩹 Entschëllegt: {offen["Entschëllegung-Grond"]}</p>
            )}
          </div>
        </div>
      )}
      {externOffen && (
        <div className="modal-overlay" onClick={() => setExternOffen(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <h2>➕ Extern bewäert Wochenbericht aginn</h2>
            <p className="extern-hint">
              Fir Berichter, déi ausserhalb vun der App bewäert goufen. Si ginn als „Bewäert“ gespäichert a gi
              mat de selwechte Punkte-Kategorien wéi bei der Korrektur (max. 5) an der Bewertung matgezielt. Ass fir déi Woch nëmmen en automatesche „Verpasst“-Eintrag
              do, gëtt deen ersat.
            </p>
            <label className="punkte-feld extern-feld">
              <span>Schüler/-in</span>
              <select className="select" value={externSchueler} onChange={(e) => { setExternSchueler(e.target.value); setExternPeriode(""); }}>
                <option value="">– auswielen –</option>
                {schuelerListeVollstaendeg.map((s) => <option key={s.numm} value={s.numm}>{s.virnumm ? `${s.virnumm} — ` : ""}{s.numm} ({s.klasse})</option>)}
              </select>
            </label>
            <label className="punkte-feld extern-feld">
              <span>Periode</span>
              <select className="select" value={externPeriode} onChange={(e) => setExternPeriode(e.target.value)} disabled={!externSchueler}>
                <option value="">– auswielen –</option>
                {externPerioden.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </label>
            <label className="punkte-feld extern-feld">
              <span>Eng Datum aus där Woch {externWoche && <em className="extern-woche">→ {externWoche}</em>}</span>
              <input type="date" className="select" value={externDatum} onChange={(e) => setExternDatum(e.target.value)} />
            </label>
            <div className="punkte-grid extern-punkte-grid">
              <label className="punkte-feld">
                <span>Zesummefaassung (max 2)</span>
                <input type="number" step="0.5" min="0" max="2" value={externPunkte.zusammenfassung} onChange={(e) => setExternPunkte({ ...externPunkte, zusammenfassung: e.target.value })} />
              </label>
              <label className="punkte-feld">
                <span>Fortschrëtt (max 1,5)</span>
                <input type="number" step="0.5" min="0" max="1.5" value={externPunkte.fortschritt} onChange={(e) => setExternPunkte({ ...externPunkte, fortschritt: e.target.value })} />
              </label>
              <label className="punkte-feld">
                <span>Ahänk (max 1)</span>
                <input type="number" step="0.5" min="0" max="1" value={externPunkte.anhaenge} onChange={(e) => setExternPunkte({ ...externPunkte, anhaenge: e.target.value })} />
              </label>
              <label className="punkte-feld">
                <span>Grammatik (max 0,5)</span>
                <input type="number" step="0.5" min="0" max="0.5" value={externPunkte.grammatik} onChange={(e) => setExternPunkte({ ...externPunkte, grammatik: e.target.value })} />
              </label>
            </div>
            <p className="extern-summe">Total: <strong>{externSumme}</strong> / 5</p>
            <div className="punkte-feld extern-feld">
              <span>Bericht (optional) — Word, PDF, Foto, ...</span>
              <div
                className={`dropzone${externDragOver ? " dropzone-aktiv" : ""}`}
                onDragOver={(e) => { e.preventDefault(); setExternDragOver(true); }}
                onDragLeave={() => setExternDragOver(false)}
                onDrop={(e) => { e.preventDefault(); setExternDragOver(false); externDateienBeifuegen(e.dataTransfer.files); }}
                onClick={() => document.getElementById("extern-datei-input").click()}
              >
                📎 Dateien hei dropen oder klicken zum Auswielen
                <input
                  id="extern-datei-input"
                  type="file"
                  multiple
                  accept="image/*,.pdf,.doc,.docx,.odt,.rtf,.txt,.xlsx,.pptx"
                  style={{ display: "none" }}
                  onChange={(e) => { externDateienBeifuegen(e.target.files); e.target.value = ""; }}
                />
              </div>
              {externDateien.length > 0 && (
                <ul className="extern-datei-liste">
                  {externDateien.map((d, i) => (
                    <li key={i}>
                      <span>{d.name} ({Math.round(d.size / 1024)} KB)</span>
                      <button type="button" className="datei-weg" onClick={() => setExternDateien((l) => l.filter((_, j) => j !== i))}>✕</button>
                    </li>
                  ))}
                </ul>
              )}
            </div>
            <KommentarFeld wert={externKommentar} setWert={setExternKommentar} />
            <label className="punkte-feld extern-feld">
              <span>Notiz (optional, z.B. wou bewäert)</span>
              <input type="text" className="select" value={externNotiz} onChange={(e) => setExternNotiz(e.target.value)} placeholder="z.B. op Pabeier bewäert" />
            </label>
            {externFehlt.length > 0 && (
              <p className="extern-fehlt">⚠️ Fir ze späicheren nach ausfëllen: {externFehlt.join(", ")}</p>
            )}
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => setExternOffen(false)}>Zoumaachen</button>
              <button className="btn btn-primary" disabled={!externKannSpeicheren || syncing} onClick={externSpeicheren}>{syncing ? "Späichert…" : "💾 Aginn"}</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
