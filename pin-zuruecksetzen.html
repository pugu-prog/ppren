<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN PIN zrécksetzen</title>
<script>window.PPREN_ERFUERDERT_ROLLE = "Prof";</script>
<script src="auth-guard.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' +
      (e.message || "Unbekannter Fehler") +
      (e.filename ? "\n\nDatei: " + e.filename + " Zeile " + e.lineno : "") +
      "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

function App() {
  // M1: Nimm live vum Backend lueden, keng hart-codéiert Lëschten méi.
  const [personen, setPersonen] = useState([]);
  useEffect(() => {
    fetch(WEB_APP_URL + "?namen=1")
      .then((r) => r.json())
      .then((d) => setPersonen(d.personen || []))
      .catch(() => {});
  }, []);
  const SCHUELER = useMemo(() => personen.filter((p) => p.rolle === "Schüler").map((p) => p.numm), [personen]);
  const PROFFEN = useMemo(() => personen.filter((p) => p.rolle === "Prof").map((p) => p.numm), [personen]);

  const [rolle, setRolle] = useState("Schüler");
  const [numm, setNumm] = useState("");
  const [neiesPasswuert, setNeiesPasswuert] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [error, setError] = useState(null);
  const [resultat, setResultat] = useState(null); // { numm, pin }
  const [kopéiert, setKopéiert] = useState(false);

  const nimm = rolle === "Schüler" ? SCHUELER : PROFFEN;

  const zrécksetzen = async () => {
    if (!numm) {
      setError("Weg éischt en Numm auswielen.");
      return;
    }
    if (!confirm(`De PIN/Passwuert vun "${numm}" wierklech zrécksetzen? Den ale PIN funktionéiert duerno net méi.`)) return;
    setSyncing(true);
    setError(null);
    setResultat(null);
    setKopéiert(false);
    try {
      const token = window.PPREN_SESSION?.token;
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "pinZuruecksetzen", numm, proffToken: token, neiesPasswuert: neiesPasswuert.trim() }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setResultat({ numm: data.numm, pin: data.pin });
      setNeiesPasswuert("");
    } catch (e) {
      setError(e.message);
    } finally {
      setSyncing(false);
    }
  };

  const kopéieren = () => {
    if (!resultat) return;
    navigator.clipboard.writeText(resultat.pin).then(() => {
      setKopéiert(true);
      setTimeout(() => setKopéiert(false), 2000);
    });
  };

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">PIN zrécksetzen · nëmmen Proffen</span>
        </div>
        <a className="topbar-link" href="proffen.html">← Zréck</a>
      </header>

      <main className="content">
        <section className="card">
          <h2>Fir wien?</h2>
          <div className="rolle-switch">
            <button className={`switch-btn ${rolle === "Schüler" ? "active" : ""}`} onClick={() => { setRolle("Schüler"); setNumm(""); setResultat(null); }}>Schüler/-in</button>
            <button className={`switch-btn ${rolle === "Prof" ? "active" : ""}`} onClick={() => { setRolle("Prof"); setNumm(""); setResultat(null); }}>Prof/Kolleg</button>
          </div>

          <label className="field">
            <span className="field-label">Numm</span>
            <select className="select" value={numm} onChange={(e) => { setNumm(e.target.value); setResultat(null); }}>
              <option value="">– auswählen –</option>
              {nimm.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          </label>

          <label className="field">
            <span className="field-label">Neit Passwuert (optional — mindestens 6 Zeechen fir e stäerkert Passwuert; eidel loossen fir en automateschen 4-Zuel-PIN)</span>
            <input
              className="select"
              type="text"
              value={neiesPasswuert}
              onChange={(e) => setNeiesPasswuert(e.target.value)}
              placeholder="z.B. Waasser2027!"
            />
          </label>

          {error && <p className="error">{error}</p>}

          <button className="btn btn-primary" disabled={syncing || !numm} onClick={zrécksetzen}>
            {syncing ? "Setzt zréck…" : "🔑 PIN/Passwuert zrécksetzen"}
          </button>

          <p className="hint">Ouni eegent Passwuert generéiert de Backend en neie zoufällegen 4-stellege PIN a läscht den ale sofort. Deel de neie PIN/Passwuert direkt der Persoun mat.</p>
        </section>

        {resultat && (
          <section className="card resultat-card">
            <span className="resultat-label">Neie PIN/Passwuert fir</span>
            <span className="resultat-numm">{resultat.numm}</span>
            <div className="pin-box">
              <span className="pin-zuel">{resultat.pin}</span>
              <button className="btn-gen" onClick={kopéieren}>{kopéiert ? "✓ Kopéiert" : "📋 Kopéieren"}</button>
            </div>
            <p className="resultat-hint">⚠️ Dëse PIN/Passwuert gëtt hei nëmmen eemol ugewisen — notéier en oder deel en direkt matt.</p>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #f6f8f6; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: #1c2621; color: #fff; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; }
.brand-sub { font-size: 13px; opacity: 0.85; }
.topbar-link { color: #fff; font-size: 12.5px; font-weight: 700; text-decoration: none; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 7px; }
.content { max-width: 460px; margin: 0 auto; padding: 24px 20px 60px; }
.card { background: #fff; border: 1px solid #e2e8e3; border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 14px; color: #00A94F; }
.rolle-switch { display: flex; gap: 6px; margin-bottom: 16px; }
.switch-btn { flex: 1; font-size: 13px; font-weight: 700; padding: 9px; border-radius: 8px; border: 1px solid #c9d5cd; background: #fff; color: #55625a; cursor: pointer; }
.switch-btn.active { background: #00A94F; border-color: #00A94F; color: #fff; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }
.field-label { font-size: 12.5px; font-weight: 700; color: #294f3c; }
.select { border: 1px solid #c9d5cd; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fff; color: #1c2621; width: 100%; }
.error { color: #8a2b1f; font-size: 12.5px; background: #fbe4e1; padding: 8px 12px; border-radius: 8px; margin: 0 0 14px; }
.btn { width: 100%; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 9px; border: none; cursor: pointer; }
.btn-primary { background: #00A94F; color: #fff; }
.btn-primary:disabled { background: #b7c6bd; cursor: not-allowed; }
.hint { font-size: 11.5px; color: #93a098; margin: 14px 0 0; line-height: 1.5; }
.resultat-card { background: #eef3ef; text-align: center; }
.resultat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #6d7d74; font-weight: 700; }
.resultat-numm { display: block; font-size: 16px; font-weight: 800; color: #294f3c; margin: 4px 0 14px; }
.pin-box { display: flex; align-items: center; justify-content: center; gap: 12px; background: #fff; border: 1px solid #c9d5cd; border-radius: 10px; padding: 14px; }
.pin-zuel { font-size: 24px; font-weight: 800; letter-spacing: 4px; color: #00A94F; word-break: break-all; }
.btn-gen { font-size: 11.5px; font-weight: 700; color: #00A94F; background: #eef3ef; border: 1px solid #c9d5cd; padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.resultat-hint { font-size: 11.5px; color: #8a5a12; margin: 12px 0 0; }
</style>
</body>
</html>
