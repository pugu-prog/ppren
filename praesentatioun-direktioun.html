<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Calibri, Arial, sans-serif; background: #1c2621; color: #1c2621; overflow: hidden; }
.stage-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.stage { width: 100%; max-width: 1180px; aspect-ratio: 16/9; position: relative; }
.slide { position: absolute; inset: 0; background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity 0.35s ease; overflow: hidden; display: flex; flex-direction: column; }
.slide.active { opacity: 1; pointer-events: auto; }

/* ===== Titel/Ofschloss-Slides ===== */
.slide.dark { background: linear-gradient(160deg, #1c2621, #294f3c); color: #fff; justify-content: center; padding: 60px 70px; }
.dark .bar { height: 6px; width: 100px; background: #F67E1B; border-radius: 3px; margin-bottom: 22px; }
.dark h1 { font-size: 40px; margin: 0 0 12px; font-weight: 800; }
.dark p.sub { font-size: 16px; color: #c9d5cd; max-width: 640px; line-height: 1.6; margin: 0 0 24px; }
.dark ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.dark li { font-size: 13.5px; color: #eef3ef; display: flex; align-items: center; gap: 10px; }
.dark li::before { content: "✓"; color: #48B5CA; font-weight: 900; }
.dark .footline { position: absolute; bottom: 42px; left: 70px; font-size: 12px; color: #48B5CA; font-weight: 700; }

/* ===== Inhalts-Slides ===== */
.pad { padding: 34px 44px 26px; height: 100%; display: flex; flex-direction: column; }
.tag { display: inline-block; padding: 6px 16px; border-radius: 20px; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 14px; align-self: flex-start; }
h2.slide-title { font-size: 25px; font-weight: 800; color: #1c2621; margin: 0 0 18px; }
.two-col { display: grid; grid-template-columns: 1fr 1.05fr; gap: 28px; flex: 1; min-height: 0; }
.two-col.wide-left { grid-template-columns: 1.15fr 1fr; }
.bul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; align-content: start; }
.bul li { font-size: 13px; line-height: 1.5; color: #1c2621; padding-left: 20px; position: relative; }
.bul li::before { content: "●"; position: absolute; left: 0; color: #1c2621; font-size: 8px; top: 6px; }

/* ===== Browser-Mockup ===== */
.browser-frame { background: #fff; border: 1px solid #e2e8e3; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden; display: flex; flex-direction: column; height: 100%; }
.browser-bar { background: #eef1ef; padding: 7px 10px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #e2e8e3; }
.bdot { width: 8px; height: 8px; border-radius: 50%; }
.bdot.r { background: #ee6a5f; } .bdot.y { background: #f5bd4f; } .bdot.g { background: #61c454; }
.mock-body { flex: 1; overflow: hidden; background: #f6f8f6; display: flex; flex-direction: column; }
.app-topbar { background: #00A94F; color: #fff; padding: 10px 16px; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; }
.app-topbar .sub { font-weight: 400; opacity: 0.85; font-size: 10px; }
.app-inner { padding: 14px 16px; flex: 1; overflow: hidden; }
.app-card { background: #fff; border: 1px solid #e2e8e3; border-radius: 9px; padding: 11px 13px; margin-bottom: 9px; }
.app-card h3 { margin: 0 0 6px; font-size: 10.5px; color: #00A94F; }
.pos-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #eef1ef; font-size: 10px; }
.pos-row .nm { flex: 1; font-weight: 600; }
.pos-row .pt { width: 34px; border: 1px solid #c9d5cd; border-radius: 5px; text-align: center; padding: 2px; font-size: 10px; background: #fbfcfb; }
.pill { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin: 2px 4px 2px 0; }
.pill-g { background: #d7ecdd; color: #00A94F; } .pill-r { background: #fbe4e1; color: #99392f; } .pill-o { background: #fbe8c6; color: #8a5a12; }
.mini-btn { display: inline-block; font-size: 8.5px; font-weight: 700; padding: 5px 10px; border-radius: 6px; }
.mini-btn.primary { background: #00A94F; color: #fff; }
.mini-btn.ghost { background: #eef3ef; color: #294f3c; border: 1px solid #c9d5cd; }
.textarea-mock { border: 1px dashed #c9d5cd; border-radius: 6px; padding: 7px 9px; font-size: 9px; color: #6d7d74; font-family: ui-monospace, monospace; background: #fbfcfb; line-height: 1.5; }
.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-card { background: #fff; border: 1px solid #e2e8e3; border-radius: 8px; padding: 9px; text-align: center; font-size: 9.5px; font-weight: 700; }
.mini-card .ic { font-size: 16px; display: block; margin-bottom: 4px; }
.status-flow { display: flex; align-items: center; gap: 5px; font-size: 9px; }
.status-step { padding: 4px 9px; border-radius: 20px; background: #eef1ef; color: #6d7d74; }
.status-step.active { background: #d7ecdd; color: #00A94F; font-weight: 700; }
.gantt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.gantt-label { width: 78px; font-size: 9px; color: #1c2621; }
.gantt-track { flex: 1; height: 14px; position: relative; }
.gantt-bar { position: absolute; height: 12px; border-radius: 6px; top: 1px; }
.progress-mock { height: 8px; border-radius: 4px; background: #eef1ef; overflow: hidden; margin: 4px 0; }
.progress-mock .fill { height: 100%; background: #00A94F; }
.timer-circle { width: 68px; height: 68px; border-radius: 50%; border: 3px solid #00A94F; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #00A94F; font-size: 15px; margin: 6px auto; }

/* ===== Architektur-Diagramm ===== */
.arch-row { display: flex; align-items: stretch; gap: 14px; flex: 1; }
.arch-box { flex: 1; border: 2px solid; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.arch-head { padding: 9px; text-align: center; font-weight: 800; color: #fff; font-size: 13px; }
.arch-sub { text-align: center; font-size: 10.5px; font-weight: 700; padding: 6px 0 2px; }
.arch-body { padding: 10px 14px; font-size: 10.5px; line-height: 1.7; flex: 1; }
.arch-arrow { display: flex; align-items: center; font-size: 24px; color: #6d7d74; font-weight: 900; }

/* ===== Tabell (Status) ===== */
table.status-table { width: 100%; border-collapse: collapse; font-size: 11px; }
table.status-table th { background: #1c2621; color: #fff; padding: 7px 10px; text-align: left; }
table.status-table td { padding: 6px 10px; border-bottom: 1px solid #eef1ef; }
table.status-table tr:nth-child(even) td { background: #f6f8f6; }
.status-ok { color: #00A94F; font-weight: 700; }
.status-warn { color: #8a5a12; font-weight: 700; }

/* ===== Dateschutz-Warnbox ===== */
.warn-box { background: #fbe8c6; border-radius: 10px; padding: 16px 18px; height: 100%; overflow: auto; }
.warn-box h4 { margin: 0 0 10px; color: #8a5a12; font-size: 13px; }
.warn-box ul { margin: 0; padding-left: 16px; }
.warn-box li { font-size: 11px; color: #8a5a12; margin-bottom: 8px; line-height: 1.5; }

/* ===== Fakte-Kaarten (GSE-Kontext) ===== */
.fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact-card { background: #fff; border: 1px solid #e2e8e3; border-radius: 9px; padding: 11px 13px; }
.fact-card h3 { margin: 0 0 5px; font-size: 11px; color: #1c2621; }
.fact-card div { font-size: 9.5px; color: #6d7d74; line-height: 1.5; }
.tag-row { display: flex; flex-wrap: wrap; gap: 8px 16px; background: #eef3ef; border-radius: 9px; padding: 10px 13px; font-size: 10.5px; font-weight: 700; }

/* ===== Oflaf-Etappen (4-Schrëtt-Prozess) ===== */
.oflaf-row { display: flex; align-items: stretch; gap: 12px; flex: 1; margin-top: 6px; }
.oflaf-step { flex: 1; border: 2px solid; border-radius: 10px; padding: 16px 10px 12px; position: relative; text-align: center; }
.oflaf-num { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.oflaf-step h4 { margin: 10px 0 8px; font-size: 12.5px; color: #1c2621; }
.oflaf-step div { font-size: 9.5px; color: #6d7d74; line-height: 1.6; }
.oflaf-arrow { display: flex; align-items: center; font-size: 18px; color: #93a098; font-weight: 900; }

/* ===== Steuerung (nëmmen um Bildschierm, net am Drock) ===== */
.controls { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 14px; z-index: 50; }
.ctrl-btn { background: rgba(255,255,255,0.95); border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
.ctrl-btn:hover { background: #fff; }
.dots { display: flex; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); cursor: pointer; }
.dot.active { background: #F67E1B; width: 20px; border-radius: 4px; }
.counter { color: #c9d5cd; font-size: 12px; min-width: 44px; }
.hint { position: fixed; top: 14px; right: 18px; color: #c9d5cd; font-size: 11px; z-index: 50; }
.hint a { color: #48B5CA; text-decoration: none; }

/* ===== Drock (all Slide op eng Säit) ===== */
@media print {
  html, body { overflow: visible; background: #fff; height: auto; }
  .stage-wrap { padding: 0; height: auto; display: block; }
  .stage { max-width: none; aspect-ratio: auto; }
  .slide { position: relative; inset: auto; opacity: 1 !important; pointer-events: auto; box-shadow: none; border-radius: 0;
    page-break-after: always; width: 100%; height: 100vh; }
  .controls, .hint { display: none !important; }
}
</style>

// ===== Rendering =====
const stage = document.getElementById("stage");
let idx = 0;

function renderSlide(sl) {
  if (sl.type === "dark") return `<div class="slide dark">${sl.html}</div>`;
  const bodyInner = sl.full
    ? sl.full
    : `<div class="two-col ${sl.wideLeft ? "wide-left" : ""}"><div>${sl.left}</div><div>${sl.right}</div></div>`;
  return `<div class="slide"><div class="pad">${tag(sl.tag, sl.tagColor)}<h2 class="slide-title">${sl.title}</h2>${bodyInner}</div></div>`;
}

SLIDES.forEach((sl) => { stage.insertAdjacentHTML("beforeend", renderSlide(sl)); });
const slideEls = document.querySelectorAll(".slide");
const dotsEl = document.getElementById("dots");
SLIDES.forEach((_, i) => {
  const d = document.createElement("div");
  d.className = "dot" + (i === 0 ? " active" : "");
  d.onclick = () => goTo(i);
  dotsEl.appendChild(d);
});

function goTo(n) {
  idx = Math.max(0, Math.min(SLIDES.length - 1, n));
  slideEls.forEach((el, i) => el.classList.toggle("active", i === idx));
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === idx));
  document.getElementById("counter").textContent = (idx + 1) + " / " + SLIDES.length;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goTo(idx + 1); }
  if (e.key === "ArrowLeft") goTo(idx - 1);
});
goTo(0);
</script>
