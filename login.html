<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN Umeldung</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' +
      (e.message || "Unbekannter Fehler") +
      (e.filename ? "\n\nDatei: " + e.filename + " Zeile " + e.lineno : "") +
      "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";
const SE_LOGO_URL = "LogoSE_weisHintergrund.png";
const LTETT_LOGO_URL = "LTEtt_Logo.png";

// Säiten, déi just fir eng bestëmmte Roll gedaach sinn — gëtt benotzt fir
// de "zréck"-Parameter ze préiwen, sou datt kee mat der falscher Roll op
// eng gespaart Säit geleet gëtt (och net iwwer en ale Link).
const PROF_SÄITEN = ["admin.html", "proffen.html", "bewertung.html", "dashboard.html", "fachgespraech.html", "zieluewerpreiwung.html", "wochenberichte-korrigeieren.html", "zeitplang-verwalten.html", "noten.html", "pin-zuruecksetzen.html", "rendezvousen.html", "personen-verwalten.html"];
const SCHUELER_SÄITEN = ["index.html", "wochenbericht.html", "schueler.html"];

/** Gëtt eng sécher Ziel-Säit zréck: benotzt "zréck" nëmmen, wann d'Roll do och Zougrëff huet. */
function sécherZiel(zréckParam, rolle) {
  const standard = rolle === "Prof" ? "proffen.html" : "schueler.html";
  if (!zréckParam) return standard;
  const seitenNumm = zréckParam.split("?")[0];
  if (rolle === "Prof" && SCHUELER_SÄITEN.includes(seitenNumm)) return standard;
  if (rolle === "Schüler" && PROF_SÄITEN.includes(seitenNumm)) return standard;
  return zréckParam;
}

function App() {
  // M1: Login geschitt elo iwwer d'Matrikelnummer (Schüler, méi sécher wéi
  // de Numm, well net direkt ze roden) oder de ganze Numm (Proffen).
  // D'Roll gëtt server-säiteg festgestallt, duerfir brauch et keng
  // Roll-Ëmschalter méi hei.
  const [eingabe, setEingabe] = useState("");
  const [pin, setPin] = useState("");
  const [pinSiichtbar, setPinSiichtbar] = useState(false);
  const [error, setError] = useState(null);
  const [syncing, setSyncing] = useState(false);

  useEffect(() => {
    const bestehendToken = localStorage.getItem("ppren_token");
    const bestehendRolle = localStorage.getItem("ppren_rolle");
    if (bestehendToken && bestehendRolle) {
      const zréckParam = new URLSearchParams(window.location.search).get("zréck");
      window.location.href = sécherZiel(zréckParam, bestehendRolle);
      return;
    }
  }, []);

  const umellen = async () => {
    if (!eingabe.trim() || pin.length < 4) {
      setError("Weg Matrikel (oder Numm) an PIN/Passwuert (mindestens 4 Zeechen) aginn.");
      return;
    }
    setSyncing(true);
    setError(null);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "login", numm: eingabe.trim(), pin }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Umeldung feelgeschloen.");
      localStorage.setItem("ppren_token", data.token);
      localStorage.setItem("ppren_numm", data.numm);
      localStorage.setItem("ppren_rolle", data.rolle);
      localStorage.setItem("ppren_klasse", data.klasse || "");
      const zréckParam = new URLSearchParams(window.location.search).get("zréck");
      window.location.href = sécherZiel(zréckParam, data.rolle);
    } catch (e) {
      setError(e.message);
    } finally {
      setSyncing(false);
    }
  };

  return (
    <div className="page">
      {/* ===== Deckblatt-inspiréierten Header ===== */}
      <header className="hero">
        <img className="hero-logo-top" src={SE_LOGO_URL} alt="" />
        <div className="hero-inner">
          <div className="wordmark">
            <span className="wordmark-line">SCIENCES</span>
            <span className="wordmark-line">ENVIRONNEMENTALES</span>
          </div>
          <div className="subwordmark">ËMWELTWËSSENSCHAFTEN</div>
          <div className="bar bar-orange"></div>
          <div className="ppren-line">PROJET PERSONNEL ENCADRÉ (PPREN)</div>
          <div className="typ-line">Umeldung</div>
        </div>
      </header>

      {/* ===== Login-Kaart ===== */}
      <main className="main">
        <div className="card">
          <label className="field">
            <span className="field-label">Matrikel (oder Numm)</span>
            <input
              type="text" className="input" autoCapitalize="none" autoCorrect="off" spellCheck="false"
              placeholder="z.B. 26-1GSE-01"
              value={eingabe} onChange={(e) => setEingabe(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && document.getElementById("pin-feld")?.focus()}
            />
          </label>

          <label className="field">
            <span className="field-label">PIN oder Passwuert</span>
            <div className="pin-wrapper">
              <input
                id="pin-feld"
                type={pinSiichtbar ? "text" : "password"} autoCapitalize="none" autoCorrect="off" spellCheck="false"
                className="input pin-input"
                maxLength={64}
                value={pin} onChange={(e) => setPin(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && umellen()}
              />
              <button
                type="button" className="pin-toggle" tabIndex={-1}
                onClick={() => setPinSiichtbar((v) => !v)}
                aria-label={pinSiichtbar ? "PIN verstoppen" : "PIN weisen"}
              >
                {pinSiichtbar ? "🙈" : "👁️"}
              </button>
            </div>
          </label>

          {error && <p className="error">{error}</p>}

          <button className="btn btn-primary" disabled={syncing} onClick={umellen}>
            {syncing ? "Mellt un…" : "Umellen"}
          </button>

          <p className="footer-hint">Keng Matrikel? Numm benotzen. PIN/Passwuert vergiess? Frot Ären Prof, en zréckzesetzen.</p>
        </div>
      </main>

      {/* ===== Deckblatt-inspiréierten Footer mat Logoen ===== */}
      <footer className="foot">
        <img className="foot-logo-se" src={SE_LOGO_URL} alt="Sciences Environnementales" />
        <div className="foot-right">
          <img className="foot-logo-ltett" src={LTETT_LOGO_URL} alt="Lycée Technique d'Ettelbruck" />
          <div className="bar bar-teal"></div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #ffffff; }
.page { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

/* ===== Header (Deckblatt-Wordmark) ===== */
.hero { position: relative; padding: 44px 24px 30px; overflow: hidden; }
.hero-logo-top { position: absolute; top: -60px; right: -40px; width: 220px; opacity: 0.94; pointer-events: none; }
.hero-inner { position: relative; max-width: 460px; margin: 0 auto; text-align: left; }
.wordmark { display: flex; flex-direction: column; line-height: 1; }
.wordmark-line { font-weight: 800; font-size: clamp(26px, 7vw, 34px); color: #00A94F; letter-spacing: 0.01em; }
.subwordmark { font-weight: 700; font-size: clamp(15px, 4vw, 18px); color: #1c2621; margin-top: 10px; }
.bar { height: 7px; border-radius: 2px; }
.bar-orange { width: 130px; background: #F67E1B; margin: 16px 0 14px; }
.bar-teal { width: 130px; background: #48B5CA; margin-top: 10px; }
.ppren-line { font-weight: 700; font-size: 12px; color: #4576B5; letter-spacing: 0.03em; margin-bottom: 4px; }
.typ-line { font-weight: 800; font-size: clamp(20px, 5vw, 24px); color: #4576B5; }

/* ===== Login-Kaart ===== */
.main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 4px 24px 30px; }
.card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e2e8e3; border-radius: 16px; padding: 26px 26px 22px; box-shadow: 0 4px 20px rgba(28,38,33,0.06); }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.field-label { font-size: 12.5px; font-weight: 700; color: #294f3c; }
.select, .input { border: 1px solid #c9d5cd; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fff; color: #1c2621; width: 100%; }
.pin-input { font-size: 16px; font-weight: 700; text-align: center; letter-spacing: 2px; padding-right: 40px; }
.pin-wrapper { position: relative; display: flex; }
.pin-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: none; background: none; font-size: 17px; line-height: 1; padding: 6px 8px; cursor: pointer; opacity: 0.65; }
.pin-toggle:hover { opacity: 1; }
.error { color: #8a2b1f; font-size: 12.5px; background: #fbe4e1; padding: 8px 12px; border-radius: 8px; margin: -4px 0 14px; }
.btn { width: 100%; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 9px; border: none; cursor: pointer; }
.btn-primary { background: #00A94F; color: #fff; }
.btn-primary:disabled { background: #b7c6bd; cursor: not-allowed; }
.footer-hint { text-align: center; font-size: 11.5px; color: #93a098; margin: 16px 0 0; line-height: 1.5; }

/* ===== Footer (Deckblatt-Logoen) — einfache Flexbox, keng absolut Positioun ===== */
.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 28px 24px 30px 4px; flex-wrap: wrap; }
.foot-logo-se { width: 260px; max-width: 42vw; height: auto; display: block; }
.foot-right { display: flex; flex-direction: column; align-items: flex-end; padding-right: 4px; }
.foot-logo-ltett { width: 120px; height: auto; display: block; }

@media (max-width: 420px) {
  .hero-logo-top { width: 150px; top: -46px; right: -30px; }
  .foot { padding: 20px 16px 24px 2px; }
  .foot-logo-se { width: 190px; max-width: 55vw; }
  .foot-logo-ltett { width: 90px; }
}
</style>
</body>
</html>
