<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN – Projetsvirschléi</title>
<script src="auth-guard.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #f6f8f6; }
  .hero { background: #fff; border-bottom: 1px solid #e2e8e3; padding: 32px 22px 26px; text-align: center; }
  .hero h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .hero p { font-size: 14px; color: #55625a; margin: 0; }
  .content { max-width: 820px; margin: 0 auto; padding: 24px 20px 90px; }
  .filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .filter button { border: 1px solid #c9d5cd; background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: #294f3c; }
  .filter button.aktiv { background: #00A94F; border-color: #00A94F; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips small { background: #e8f4ec; color: #294f3c; border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .idee { background: #fff; border: 1px solid #e2e8e3; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .idee b { display: block; font-size: 14.5px; margin-bottom: 4px; }
  .idee span { display: block; font-size: 13px; color: #55625a; line-height: 1.45; margin-top: 6px; }
  .idee span em { font-style: normal; font-weight: 700; color: #294f3c; }
  .leer { color: #6d7d74; font-size: 13.5px; background: #fff; border: 1px dashed #c9d5cd; border-radius: 12px; padding: 22px; text-align: center; }
</style>
</head>
<body>
<header class="hero">
  <h1>💡 Projetsvirschléi</h1>
  <p>Iddien, wou s de dech fir däi Projet inspiréiere kanns — mat de passenden GSE-Themen driwwer.</p>
</header>
<main class="content">
  <div class="filter" id="filter"></div>
  <div id="liste"></div>
</main>
<script>
  // Hei nei Virschléi derbäisetzen:
  //   { themen: ["buedem", ...], titel: "...", abschnitter: [["Label", "Text"], ...] }
  // themen: "buedem" | "loft" | "waasser" | "offall" | "mobiliteit" | "energie"
  // (eng Iddi ka bei méi Themen gehéieren: si gëtt just 1x gewisen, d'Themen stinn driwwer; abschnitter ass optional)
  const IDEEN = [
    {
      themen: ["buedem", "offall", "loft"],
      titel: "Nistkästen fir einheimesch Vullen am Arboretum vum LTEtt",
      abschnitter: [
        ["Kontext", "D'Arboretum vum LTEtt ass en Naturraum vu ronn 6 Hektar matten an Ettelbréck. Mat gezielt entwéckelten Nistkëschte soll de Liewensraum fir zu Lëtzebuerg bréiend Vullenaarten ënnerstëtzt an d'Biodiversitéit gefërdert ginn."],
        ["Aufgab", "Wielt eng zu Lëtzebuerg bréiend Vullenaart aus, analyséiert hir ekologesch Besoinen an entwéckelt dofir en eegene funktionellen Nistkasten. Vum éischte Konzept iwwer den digitale Modell an de Prototyp bis zur Installatioun am Arboretum soll de ganze Prozess dokumentéiert ginn."],
        ["Ziler", "Biologie a Biodiversitéit verstoen; technesch Ufuerderungen aus enger Recherche ofleeden; en 2D-/3D-Modell entwéckelen; e Prototyp hierstellen, testen a verbesseren; eng nohalteg an nobaulech Léisung dokumentéieren."],
        ["Ofzeginn Aarbechten / Resultater", "Dokumentatioun vun der Vullenaart; Skizzen; digitalen 2D-/3D-Modell; Fabrikatiounspläng; Material- a Käschtenlëscht; funktionelle Prototyp; Montage- an Installatiounsuleedung; fräi zougänglech Donnéeë fir den Nobau; Installatioun am Arboretum vum LTEtt."],
        ["Zäitplang", "Hierscht 2026: Recherche an Konzept. Wanter 2026/27: Design, digital Modelléierung a Prototyping. Spéitstens Fréijoer 2027: final Fabrikatioun an Installatioun vun den Nistkëschten am Arboretum."],
      ],
    },
    {
      themen: ["offall"],
      titel: "Wiederverwendbar „Schachtel“",
      abschnitter: [
        ["Aufgab", "Eng wiederverwendbar „Schachtel“ (oder en aneren Géigestand) designen, mat Plänen a Materialwiel, an e Modell am Maker Space hierstellen (z. B. mam Lasercutter)."],
        ["Ziler", "Kreeslafwirtschaft a Wiederverwendung verstoen; de Projet a Primärschoulen virstellen an den Géigestand mat de Schüler zesumme fäerdegstellen."],
      ],
    },
    {
      themen: ["waasser", "buedem"],
      titel: "Ammoniak- an Nitrat-Miessstatioun",
      abschnitter: [
        ["Kontext", "An der Landwirtschaft ass et wichteg ze wëssen, wéi vill Stickstoff (als Ammoniak an Nitrat) mam Reen an duerch Depositioune um Buedem landen. Dës Donnéeë si schwéier ze kréien."],
        ["Aufgab", "E Reeësammler opstellen, Nitrat an Ammonium am Reewaasser regelméisseg moossen an d'Resultater auswäerten. Eventuell am Kader vun engem Erasmus+ Projet."],
      ],
    },
    {
      themen: ["waasser"],
      titel: "Waasseranalysen",
      abschnitter: [
        ["Aufgab", "Waasserproben analyséieren: Nitrat, Nitrit an Ammonium moossen an d'Resultater interpretéieren."],
      ],
    },
    {
      themen: ["loft"],
      titel: "Entstehung vum Wand (Modell / Wandmobil)",
      abschnitter: [
        ["Aufgab", "Verstoen, wéi de Wand entsteet, an dat mat engem Modell weisen, zum Beispill mat engem Wandmobil."],
      ],
    },
    {
      themen: ["energie", "loft", "mobiliteit"],
      titel: "Flettner-Rotor fir e Strandfahrzeug",
      abschnitter: [
        ["Kontext", "E liichte, windbetriwwent Strandfahrzeug (dräiräderegt, op enger modularer Aluminiumsbasis, z. B. dem Infento Legend Kit) gëtt mat engem Flettner-Rotor ugedriwwen. De Rotor ass e vertikalen, rotéierenden Zylinder, deen d'Magnus-Prinzip notzt: bei Säitewand entsteet eng Kraaft, déi de Wagen no vir dréckt. E klengen Elektromotor hält de Rotor a Rotatioun, gelenkt gëtt mat engem steierbare Virrad."],
        ["Aufgab", "D'Steierung fir d'Rotorrotatioun mat engem Mikrocontroller (z. B. Arduino) programméieren; e funktionellen Flettner-Rotor bauen (z. B. aus PVC, Aluminium oder 3D-Drock-Deeler); de Magnus-Effekt theoretesch erklären a grafesch duerstellen; d'Kraaft bei enger gewësser Wandgeschwindegkeet a Rotatiounsgeschwindegkeet ausrechnen."],
        ["Messungen an Energie", "Um Fahrzeug Geschwindegkeet, Wandrichtung, Rotordrehzahl an Energieverbrauch moossen; e Solarkonzept (PV-Modul fir de Rotormotor) an e klenge Akkusystem fir Rotor a Steierung mat Lued- a Sécherheetskonzept plangen."],
        ["Sécherheet", "Kippschutz an Notausschaltung vum Rotor mat aplangen. D'Fahrzeug soll méiglechst liicht sinn an en déiwe Schwéierpunkt hunn."],
      ],
    },
  ];

  const THEMEN = [
    { id: "buedem", label: "Buedem", icon: "🌱" },
    { id: "loft", label: "Loft", icon: "💨" },
    { id: "waasser", label: "Waasser", icon: "💧" },
    { id: "offall", label: "Offall", icon: "♻️" },
    { id: "mobiliteit", label: "Mobilitéit", icon: "🚲" },
    { id: "energie", label: "Energie", icon: "⚡" },
  ];
  let aktiv = "all";
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    const f = document.getElementById("filter");
    f.innerHTML = [{ id: "all", label: "Alles", icon: "" }, ...THEMEN]
      .map((t) => `<button class="${aktiv === t.id ? "aktiv" : ""}" data-id="${t.id}">${t.icon} ${t.label}</button>`.replace("> ", ">"))
      .join("");
    f.querySelectorAll("button").forEach((b) => (b.onclick = () => { aktiv = b.dataset.id; render(); }));

    const box = document.getElementById("liste");
    if (IDEEN.length === 0) {
      box.innerHTML = '<div class="leer">Nach keng Virschléi do — si kommen geschwënn. 🌱</div>';
      return;
    }
    const lëscht = IDEEN.filter((i) => aktiv === "all" || i.themen.includes(aktiv));
    const html = lëscht.map((i) => {
      const chips = i.themen
        .map((id) => THEMEN.find((t) => t.id === id))
        .filter(Boolean)
        .map((t) => `<small>${t.icon} ${t.label}</small>`)
        .join("");
      return `<div class="idee"><div class="chips">${chips}</div><b>${esc(i.titel)}</b>` +
        (i.abschnitter || []).map(([l, x]) => `<span><em>${esc(l)}:</em> ${esc(x)}</span>`).join("") + "</div>";
    }).join("");
    box.innerHTML = html || '<div class="leer">Fir dëst Thema gëtt et nach keng Virschléi.</div>';
  }
  render();
</script>
</body>
</html>
