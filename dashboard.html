<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN Lehrer-Dashboard</title>
<script>window.PPREN_ERFUERDERT_ROLLE = "Prof";</script>
<script src="auth-guard.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' +
      (e.message || "Unbekannter Fehler") +
      (e.filename ? "\n\nDatei: " + e.filename + " Zeile " + e.lineno : "") +
      "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

function statusMeta(status) {
  if (!status) return { key: "draft", label: "Entwurf" };
  if (status.startsWith("Frei")) return { key: "done", label: "Freigegeben" };
  if (status.startsWith("Ein")) return { key: "pending", label: "Eingereicht" };
  return { key: "draft", label: "Entwurf" };
}

function App() {
  const [projekte, setProjekte] = useState([]);
  const [bewertungen, setBewertungen] = useState([]);
  const [wochenberichte, setWochenberichte] = useState([]);
  const [budget, setBudget] = useState([]);
  const [ausgaben, setAusgaben] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [filterKlasse, setFilterKlasse] = useState("alle");
  const [filterBetreuer, setFilterBetreuer] = useState("alle");
  const [suche, setSuche] = useState("");
  const [aendernId, setAendernId] = useState(null);
  const [genehmegId, setGenehmegId] = useState(null);
  const [wiedereroeffnenId, setWiedereroeffnenId] = useState(null);

  const lade = () => {
    setLoading(true);
    setError(null);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) {
          setError(data.error || "Konnte Übersicht nicht laden.");
          return;
        }
        setProjekte(data.projekte || []);
        setBewertungen(data.bewertungen || []);
        setWochenberichte(data.wochenberichte || []);
        setBudget(data.budget || []);
        setAusgaben(data.ausgaben || []);
      })
      .catch(() => setError("Konnte Übersicht nicht laden."))
      .finally(() => setLoading(false));
  };

  useEffect(() => { lade(); }, []);

  const kostenplanGenehmegen = async (schueler, klasse) => {
    setGenehmegId(schueler);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "kostenplanGenehmegen", token: window.PPREN_SESSION?.token || "", schueler, klasse }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unbekannter Fehler");
      lade();
    } catch (e) {
      alert("Konnte net genehmegen: " + e.message);
    } finally {
      setGenehmegId(null);
    }
  };

  const wiedereroeffnen = async (schueler) => {
    if (!confirm(`Projektplang vun "${schueler}" wierklech zréck op Entwurf setzen? De Schüler kann duerno nees änneren.`)) return;
    setWiedereroeffnenId(schueler);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "projektplanWiedereroeffnen", proffToken: window.PPREN_SESSION?.token || "", schueler }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setProjekte((ps) => ps.map((p) => (p.Schüler === schueler ? { ...p, Status: "Entwurf" } : p)));
    } catch (e) {
      alert("Konnte net zréck op Entwurf setzen: " + e.message);
    } finally {
      setWiedereroeffnenId(null);
    }
  };

  const ausgiFuer = (schueler) => ausgaben.filter((a) => a.Schüler === schueler).reduce((s, a) => s + (Number(a.Betrag) || 0), 0);

  const statusAendern = async (schueler, periode, neuerStatus) => {
    const id = `${schueler}__${periode}`;
    setAendernId(id);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "statusAendern", token: window.PPREN_SESSION?.token || "", schueler, periode, neuerStatus }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unbekannter Fehler");
      setBewertungen((bs) => bs.map((b) => (b.Schüler === schueler && b.Periode === periode ? { ...b, Status: neuerStatus } : b)));
    } catch (e) {
      alert("Konnte Status nicht ändern: " + e.message);
    } finally {
      setAendernId(null);
    }
  };

  const klassen = useMemo(() => ["alle", ...new Set(projekte.map((p) => p.Klasse).filter(Boolean))], [projekte]);
  const betreuerListe = useMemo(() => ["alle", ...new Set(projekte.map((p) => p.Betreuer).filter(Boolean))], [projekte]);

  const gefiltert = projekte.filter((p) => {
    if (filterKlasse !== "alle" && p.Klasse !== filterKlasse) return false;
    if (filterBetreuer !== "alle" && p.Betreuer !== filterBetreuer) return false;
    if (suche && !`${p.Schüler} ${p.Titel}`.toLowerCase().includes(suche.toLowerCase())) return false;
    return true;
  });

  const zaehler = {
    total: projekte.length,
    done: projekte.filter((p) => statusMeta(p.Status).key === "done").length,
    pending: projekte.filter((p) => statusMeta(p.Status).key === "pending").length,
    draft: projekte.filter((p) => statusMeta(p.Status).key === "draft").length,
  };

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">Lehrer-Dashboard · Sciences Environnementales</span>
        </div>
        <button className="refresh-btn" onClick={lade} disabled={loading}>{loading ? "Lädt…" : "🔄 Aktualisieren"}</button>
      </header>

      <div className="tools-row">
        <a className="tool-link" href="suivi.html" target="_blank">📖 Suivien vun de Schüler</a>
        <a className="tool-link" href="bewertung.html" target="_blank">📊 Bewertung</a>
        <a className="tool-link" href="fachgespraech.html" target="_blank">🗣️ Fachgespréich</a>
        <a className="tool-link" href="zieluewerpreiwung.html" target="_blank">🎯 Ziler iwwerpréiwen</a>
        <a className="tool-link" href="wochenberichte-korrigeieren.html" target="_blank">📋 Wochenberichter</a>
        <a className="tool-link" href="rendezvousen.html" target="_blank">📅 Rendez-vousen plangen</a>
        <a className="tool-link" href="zeitplang-verwalten.html" target="_blank">🔒 Zäitplang verwalten</a>
        <a className="tool-link" href="#budget">💰 Budget genehmegen</a>
      </div>

      <div className="stats-row">
        <div className="stat-card">
          <span className="stat-num">{zaehler.total}</span>
          <span className="stat-label">Projekte gesamt</span>
        </div>
        <div className="stat-card stat-done">
          <span className="stat-num">{zaehler.done}</span>
          <span className="stat-label">Freigegeben</span>
        </div>
        <div className="stat-card stat-pending">
          <span className="stat-num">{zaehler.pending}</span>
          <span className="stat-label">Wartet auf Freigabe</span>
        </div>
        <div className="stat-card stat-draft">
          <span className="stat-num">{zaehler.draft}</span>
          <span className="stat-label">Im Entwurf</span>
        </div>
        <div className="stat-card stat-pending">
          <span className="stat-num">{wochenberichte.filter((w) => w.Status === "Agereecht").length}</span>
          <span className="stat-label">Wochenberichter ze korrigéieren</span>
        </div>
      </div>

      <div className="controls">
        <input className="search" placeholder="Suche nach Schüler/-in oder Titel…" value={suche} onChange={(e) => setSuche(e.target.value)} />
        <select className="select" value={filterKlasse} onChange={(e) => setFilterKlasse(e.target.value)}>
          {klassen.map((k) => <option key={k} value={k}>{k === "alle" ? "Alle Klassen" : k}</option>)}
        </select>
        <select className="select" value={filterBetreuer} onChange={(e) => setFilterBetreuer(e.target.value)}>
          {betreuerListe.map((b) => <option key={b} value={b}>{b === "alle" ? "Alle Betreuer/-innen" : b}</option>)}
        </select>
      </div>

      <main className="table-wrap">
        {loading && <div className="empty">Lädt…</div>}
        {error && <div className="empty error">{error}</div>}
        {!loading && !error && gefiltert.length === 0 && <div className="empty">Noch keine Projekte eingereicht.</div>}

        {!loading && !error && gefiltert.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Betreuer/-in</th><th>Titel</th><th>Status</th><th>Zuletzt aktualisiert</th><th>Projektplan</th><th>Suivi</th><th>Dokumentatioun</th><th></th>
              </tr>
            </thead>
            <tbody>
              {gefiltert.map((p, i) => {
                const meta = statusMeta(p.Status);
                return (
                  <tr key={i}>
                    <td className="cell-strong">{p.Schüler}</td>
                    <td>{p.Klasse}</td>
                    <td>{p.Betreuer}</td>
                    <td className="cell-muted">{p.Titel || "–"}</td>
                    <td><span className={`pill pill-${meta.key}`}>{meta.label}</span></td>
                    <td className="cell-muted">{p["Zuletzt aktualisiert"]}</td>
                    <td className="link-cell">
                      {p["Projektplan-Link"] ? <a className="link" href={p["Projektplan-Link"]} target="_blank" rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                      {p["Projektplan-PDF-Link"] && <a className="link link-pdf" href={p["Projektplan-PDF-Link"]} target="_blank" rel="noreferrer">PDF ↗</a>}
                    </td>
                    <td className="link-cell">
                      {p["Suivi-Link"] ? <a className="link" href={p["Suivi-Link"]} target="_blank" rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                      {p["Suivi-PDF-Link (Schüler)"] && <a className="link link-pdf" href={p["Suivi-PDF-Link (Schüler)"]} target="_blank" rel="noreferrer">PDF ↗</a>}
                    </td>
                    <td>{p["Dokumentatioun-Link"] ? <a className="link" href={p["Dokumentatioun-Link"]} target="_blank" rel="noreferrer">SharePoint ↗</a> : <span className="cell-muted">–</span>}</td>
                    <td>
                      {(meta.key === "pending" || meta.key === "done") && (
                        <button
                          className="btn-gen btn-gen-warn"
                          disabled={wiedereroeffnenId === p.Schüler}
                          onClick={() => wiedereroeffnen(p.Schüler)}
                          title="Projektplang zréck op Entwurf setzen, sou datt de Schüler nees änneren kann"
                        >
                          {wiedereroeffnenId === p.Schüler ? "…" : "🔓 Wiedereröffnen"}
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 className="section-titel">Bewertungen — Status</h2>
      <main className="table-wrap">
        {!loading && !error && bewertungen.length === 0 && <div className="empty">Noch keine Bewertungen abgegeben.</div>}
        {!loading && !error && bewertungen.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Periode</th><th>Note</th><th>Status</th><th>Suivi</th>
              </tr>
            </thead>
            <tbody>
              {bewertungen.map((b, i) => {
                const id = `${b.Schüler}__${b.Periode}`;
                const finalisiert = b.Status === "Finalisiert";
                return (
                  <tr key={i}>
                    <td className="cell-strong">{b.Schüler}</td>
                    <td>{b.Periode}</td>
                    <td>{b.Note} / 60</td>
                    <td>
                      <select
                        className={`status-select ${finalisiert ? "status-select-final" : "status-select-draft"}`}
                        value={b.Status || "Entwurf"}
                        disabled={aendernId === id}
                        onChange={(e) => statusAendern(b.Schüler, b.Periode, e.target.value)}
                      >
                        <option value="Entwurf">Entwurf</option>
                        <option value="Finalisiert">Finalisiert</option>
                      </select>
                    </td>
                    <td className="link-cell">
                      {b["Suivi-Link"] ? <a className="link" href={b["Suivi-Link"]} target="_blank" rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                      {b["Suivi-PDF-Link (Schüler)"] && <a className="link link-pdf" href={b["Suivi-PDF-Link (Schüler)"]} target="_blank" rel="noreferrer">PDF ↗</a>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 id="budget" className="section-titel">💰 Budget / Kostepläng</h2>
      <main className="table-wrap">
        {!loading && !error && budget.length === 0 && <div className="empty">Nach keng Kostepläng ugefrot.</div>}
        {!loading && !error && budget.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Status</th><th>Ausgi / Max</th><th></th>
              </tr>
            </thead>
            <tbody>
              {budget.map((b, i) => {
                const ausgi = ausgiFuer(b.Schüler);
                const max = Number(b.Max) || 500;
                return (
                  <tr key={i}>
                    <td className="cell-strong">{b.Schüler}</td>
                    <td>{b.Klasse}</td>
                    <td><span className={`pill pill-${b.Status === "Genehmegt" ? "done" : "pending"}`}>{b.Status}</span></td>
                    <td className="cell-muted">{b.Status === "Genehmegt" ? `${ausgi.toFixed(2)} € / ${max} €` : "–"}</td>
                    <td>
                      {b.Status === "Ageraecht" && (
                        <button className="btn-gen" disabled={genehmegId === b.Schüler} onClick={() => kostenplanGenehmegen(b.Schüler, b.Klasse)}>
                          {genehmegId === b.Schüler ? "…" : "✅ Genehmegen"}
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 className="section-titel">Wochenberichter</h2>
      <main className="table-wrap">
        <div className="wb-link-row">
          <a className="link-btn" href="wochenberichte-korrigeieren.html" target="_blank">📋 Alleguer korrigéieren →</a>
        </div>
        {!loading && !error && wochenberichte.length === 0 && <div className="empty">Nach keng Wochenberichter ofginn.</div>}
        {!loading && !error && wochenberichte.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Periode</th><th>Woch</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {wochenberichte
                .slice()
                .sort((a, b) => (a.Status === "Agereecht" ? -1 : 1) - (b.Status === "Agereecht" ? -1 : 1))
                .slice(0, 15)
                .map((w, i) => (
                  <tr key={i}>
                    <td className="cell-strong">{w.Schüler}</td>
                    <td>{w.Klasse}</td>
                    <td>{w.Periode}</td>
                    <td>{w.Woche}</td>
                    <td><span className={`pill pill-${w.Status === "Bewäert" ? "done" : "pending"}`}>{w.Status}</span></td>
                  </tr>
                ))}
            </tbody>
          </table>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; color: #1c2621; background: #f6f8f6; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: #00A94F; color: #fff; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; }
.brand-sub { font-size: 13px; opacity: 0.85; }
.refresh-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.refresh-btn:hover { background: rgba(255,255,255,0.25); }
.tools-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 22px 0; }
.tool-link { font-size: 12.5px; font-weight: 700; color: #00A94F; background: #eef3ef; border: 1px solid #c9d5cd; padding: 7px 14px; border-radius: 8px; text-decoration: none; }
.tool-link:hover { background: #e3ece5; }
.stats-row { display: flex; gap: 14px; padding: 20px 22px 4px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 140px; background: #fff; border: 1px solid #e2e8e3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat-num { font-size: 26px; font-weight: 800; color: #00A94F; }
.stat-label { font-size: 12px; color: #6d7d74; font-weight: 600; }
.stat-pending .stat-num { color: #8a5a12; }
.stat-draft .stat-num { color: #55625a; }
.controls { display: flex; gap: 10px; padding: 16px 22px; flex-wrap: wrap; }

.error { color: #8a2b1f; }
.btn-gen { font-size: 11.5px; font-weight: 700; color: #00A94F; background: #eef3ef; border: 1px solid #c9d5cd; padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn-gen:disabled { opacity: 0.6; cursor: wait; }
.btn-gen-warn { color: #8a5a12; background: #fbe8c6; border-color: #f0d29a; }
</style>
</body>
</html>
