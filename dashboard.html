<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

function statusMeta(status) {
  if (!status) return { key: "draft", label: "Entwurf" };
  if (status.startsWith("Frei")) return { key: "done", label: "Freigegeben" };
  if (status.startsWith("Ein")) return { key: "pending", label: "Eingereicht" };
  return { key: "draft", label: "Entwurf" };
}

// ===== Plang-Check: automatesch Regelen (Kritären aus dem Bewäertungsraster) =====
// D'Texter riichte sech un de Schüler (Däitsch, "du"), well se als Kommentar
// bei him landen. De Prof kann se am Plang-Check-Fënster änneren.
const GSE_WIERDER = /energie|strom|watt|kwh|solar|wind|luft|co2|co₂|emission|klima|wasser|abwasser|meer|boden|erosion|kompost|abfall|recycl|upcycl|wiederverw|müll|plastik|mobilit|verkehr|transport|nachhaltig|umwelt|environment|sustainab|renewable/i;
const ZWECK_WIERDER = /kinder|schüler|klasse|publikum|besucher|zeig|erklär|vorführ|demonstr|workshop|lehr|lern|children|pupils|students|show|explain|teach/i;

function plangDetailsVun(p) {
  try { return JSON.parse(p["Projektplan-Details (JSON)"] || "{}") || {}; } catch (e) { return {}; }
}

function datumVunText(t) {
  const s = String(t || "");
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}

function plangRegelCheck(p) {
  const d = plangDetailsVun(p);
  const t = (x) => String(x || "").trim();
  const punkte = [];
  const add = (feld, prioritaet, text) => punkte.push({ feld, prioritaet, text });
  const ass1GSE = /1GSE/i.test(String(p.Klasse || ""));

  if (!p["Projektplan-Details (JSON)"]) {
    add("Allgemein", "wichtig", "Dein Projektplan ist noch nicht gespeichert. Fülle das Formular aus und speichere es.");
    return punkte;
  }

  const titel = t(p.Titel);
  if (!titel) add("Titel", "wichtig", "Gib deinem Projekt einen kurzen, klaren Titel.");
  else if (titel.length > 90 || titel.includes("?")) add("Titel", "klein", "Formuliere den Titel kürzer und als Aussage, nicht als Frage (höchstens eine Zeile).");

  const inhalt = t(d.inhalt);
  if (!inhalt) add("Beschreibung", "wichtig", "Die Beschreibung fehlt. Beschreibe, was du genau baust oder untersuchst.");
  else if (inhalt.length < 500) add("Beschreibung", "wichtig", "Deine Beschreibung ist zu kurz. Beschreibe konkret: Aufbau, Material/Bauteile, Versuche und Messungen. Füge eine Skizze als Anhang hinzu.");

  const motivation = t(d.motivation);
  if (!motivation) add("Motivation", "wichtig", "Die Motivation fehlt. Warum hast du dieses Projekt gewählt, und was hat es mit Umweltwissenschaften zu tun?");
  else if (motivation.length < 200) add("Motivation", "mittel", "Deine Motivation ist sehr kurz. Erkläre, warum dich das Thema interessiert und welchen Bezug es zu den Umweltwissenschaften hat.");

  const ziele = t(d.ziele);
  const zielDatumer = (ziele.match(/\b\d{1,2}\.\s?(\d{1,2}\.)?/g) || []).length;
  const zielListe = ziele.split(/\n/).filter((z) => /^\s*[-•*]/.test(z)).length;
  if (!ziele) add("Ziele", "wichtig", "Die Ziele fehlen. Formuliere ein übergeordnetes Ziel und 3–5 messbare Teilziele.");
  else if (zielDatumer >= 3) add("Ziele", "wichtig", "Im Feld „Ziele“ stehen vor allem Termine. Termine gehören zu den Meilensteinen. Formuliere hier echte Ziele: Was soll am Ende erreicht und überprüfbar sein?");
  else if (zielListe >= 8) add("Ziele", "mittel", "Unter „Ziele“ steht eine lange Liste von Arbeitsschritten. Verschiebe sie ins Feld „Aufgaben“ und schreibe unter „Ziele“ 3–5 überprüfbare Ziele.");
  else if (ziele.length < 150) add("Ziele", "mittel", "Deine Ziele sind zu knapp. Formuliere ein übergeordnetes Ziel und messbare Teilziele (z. B. Leistung, Anzahl Messungen, Vorführung).");
  if (ziele && !ZWECK_WIERDER.test(ziele)) add("Ziele", "mittel", "Übergeordnetes Ziel: Wozu dient dein Ergebnis? Wo wird es eingesetzt, wer (z. B. Kinder, Mitschüler) lernt was daraus, und wie vermittelst du es?");

  const themen = d.gseThemen || [];
  if (themen.length === 0) add("Umweltbezug", "mittel", "Wähle im Formular 1–3 GSE-Themen aus, zu denen dein Projekt passt.");
  if (!GSE_WIERDER.test(motivation + " " + ziele)) add("Umweltbezug", "wichtig", "Der Bezug zu den Umweltwissenschaften fehlt. Zeige in Motivation und Zielen, wie dein Projekt mit Energie, Luft, Wasser, Boden, Abfall oder Mobilität zusammenhängt.");

  const aufgaben = t(d.aufgabenteilung);
  if (aufgaben.length < 50) add("Aufgaben", "wichtig", "Das Feld „Aufgaben“ ist leer oder sehr kurz. Gib konkrete Arbeitsschritte an – jeweils mit Theorie (für deine Dokumentation) und Praxis (Bau, Messung, Versuch).");

  const ms = (d.meilensteine || []).filter((m) => t(m.beschreibung || m.titel));
  if (ms.length === 0) add("Meilensteine", "wichtig", "Du hast keine Meilensteine. Plane mindestens 4–6 Meilensteine mit Datum und einem überprüfbaren Ergebnis.");
  else {
    if (ms.length < 4) add("Meilensteine", "mittel", "Du hast nur wenige Meilensteine. Plane mindestens 4–6, verteilt über das " + (ass1GSE ? "Semester" : "Trimester") + ".");
    const datumer = ms.map((m) => datumVunText(m.datum));
    if (datumer.some((x) => !x)) add("Meilensteine", "mittel", "Nicht alle Meilensteine haben ein Datum. Gib für jeden ein Soll-Datum an.");
    const gutt = datumer.filter((x) => x);
    let reiefolleg = true, zeNoh = false;
    for (let i = 1; i < gutt.length; i++) {
      if (gutt[i] < gutt[i - 1]) reiefolleg = false;
      if (Math.abs(gutt[i] - gutt[i - 1]) < 2 * 86400000) zeNoh = true;
    }
    if (!reiefolleg) add("Meilensteine", "mittel", "Deine Meilensteine sind nicht in zeitlicher Reihenfolge. Sortiere sie nach Datum und prüfe, ob die Reihenfolge Sinn ergibt.");
    if (zeNoh) add("Meilensteine", "klein", "Zwei Meilensteine liegen nur einen Tag auseinander. Fasse sie zusammen oder plane mehr Zeit ein.");
    const themaOnly = ms.filter((m) => t(m.beschreibung || m.titel).split(/\s+/).length <= 3).length;
    if (themaOnly >= Math.ceil(ms.length / 2)) add("Meilensteine", "mittel", "Viele Meilensteine nennen nur ein Thema. Formuliere jeden als überprüfbares Ergebnis (z. B. „Prototyp gebaut und getestet“ statt „Prototyp“).");
    if (ass1GSE) add("Meilensteine", "klein", "Trage bei jedem Meilenstein zusätzlich das Ist-Datum ein, sobald er erreicht ist (Soll-Ist-Vergleich).");
  }

  if (!d.kostenplanNoetig) add("Kostenplan", "mittel", "Du hast „Kostenplan nicht erforderlich“ angegeben. Brauchst du wirklich kein Material (Bauteile, Sensoren, Verbrauchsmaterial)? Wenn doch, erstelle einen Kostenplan.");
  else {
    const kosten = d.kosten || [];
    if (kosten.length === 0) add("Kostenplan", "wichtig", "Dein Kostenplan ist leer. Liste alle Positionen mit Preis auf.");
    if (kosten.some((k) => !(parseFloat(k.betrag) > 0))) add("Kostenplan", "mittel", "Einige Positionen haben keinen Betrag oder 0 €. Gib für jede Position einen Preis an (mit Link oder Angebot) oder schreibe dazu, dass das Teil schon vorhanden ist.");
    const summ = kosten.reduce((a, k) => a + (parseFloat(k.betrag) || 0), 0);
    if (summ > 500) add("Kostenplan", "wichtig", "Dein Kostenplan liegt über 500 €. Kürze oder begründe die Positionen.");
  }
  return punkte;
}

const FEEDBACK_MAX_MB = 10;

function App() {
  const [projekte, setProjekte] = useState([]);
  const [bewertungen, setBewertungen] = useState([]);
  const [wochenberichte, setWochenberichte] = useState([]);
  const [budget, setBudget] = useState([]);
  const [ausgaben, setAusgaben] = useState([]);
  const [plangKommentarer, setPlangKommentarer] = useState([]);
  const [personen, setPersonen] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [filterKlasse, setFilterKlasse] = useState("alle");
  const [filterBetreuer, setFilterBetreuer] = useState("alle");
  const [suche, setSuche] = useState("");
  const [aendernId, setAendernId] = useState(null);
  const [genehmegId, setGenehmegId] = useState(null);
  const [wiedereroeffnenId, setWiedereroeffnenId] = useState(null);
  const [expandedSchueler, setExpandedSchueler] = useState(null);
  const [kommentarModal, setKommentarModal] = useState(null);
  const [kommentarModalText, setKommentarModalText] = useState("");
  const [kommentarModalSenden, setKommentarModalSenden] = useState(false);
  const [suiviPdfId, setSuiviPdfId] = useState(null);
  const [plangFeedbackPdfs, setPlangFeedbackPdfs] = useState([]);
  const [feedbackModal, setFeedbackModal] = useState(null);
  const [feedbackDateien, setFeedbackDateien] = useState([]);
  const [feedbackDragOver, setFeedbackDragOver] = useState(false);
  const [feedbackSenden, setFeedbackSenden] = useState(false);
  const [feedbackLoeschId, setFeedbackLoeschId] = useState(null);
  const [plangFeedbackChecks, setPlangFeedbackChecks] = useState([]);
  const [checkModal, setCheckModal] = useState(null);
  const [checkLaeuftId, setCheckLaeuftId] = useState(null);
  const [checkFehler, setCheckFehler] = useState(null);

  // Matrikelnummer -> Virnumm (aus der Personen-Lëscht vum Backend), fir
  // hannert der Nummer och de Virnumm unzeweisen.
  const virnummVun = useMemo(() => {
    const map = {};
    personen.forEach((p) => { if (p.virnumm) map[p.numm] = p.virnumm; });
    return map;
  }, [personen]);
  const ufweis = (numm) => (virnummVun[numm] ? `${numm} · ${virnummVun[numm]}` : numm);

  const lade = () => {
    setLoading(true);
    setError(null);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) {
          setError(data.error || "Konnte Übersicht nicht laden.");
          return;
        }
        setProjekte(data.projekte || []);
        setBewertungen(data.bewertungen || []);
        setWochenberichte(data.wochenberichte || []);
        setBudget(data.budget || []);
        setAusgaben(data.ausgaben || []);
        setPlangKommentarer(data.plangKommentarer || []);
        setPlangFeedbackPdfs(data.plangFeedbackPdfs || []);
        setPlangFeedbackChecks(data.plangFeedbackChecks || []);
        setPersonen(data.personen || []);
      })
      .catch(() => setError("Konnte Übersicht nicht laden."))
      .finally(() => setLoading(false));
  };

  useEffect(() => { lade(); }, []);

  const kostenplanGenehmegen = async (schueler, klasse) => {
    setGenehmegId(schueler);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "kostenplanGenehmegen", token: window.PPREN_SESSION?.token || "", schueler, klasse }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unbekannter Fehler");
      lade();
    } catch (e) {
      alert("Konnte net genehmegen: " + e.message);
    } finally {
      setGenehmegId(null);
    }
  };

  // "wiedereroeffnen" a "kommentarHinzefuegen" benotzen elo béid ee gemeinsamt
  // Fënster (kommentarModal) mat engem grousse Textfeld, amplaz vum wénzege
  // native prompt()-Popup, dat just eng Zeil weist.
  const oeffneKommentarModal = (schueler, klasse, mode) => {
    setKommentarModal({ schueler, klasse, mode });
    setKommentarModalText("");
  };

  const schliesKommentarModal = () => {
    if (kommentarModalSenden) return;
    setKommentarModal(null);
    setKommentarModalText("");
  };

  const kommentarModalAbschécken = async () => {
    if (!kommentarModal) return;
    const { schueler, klasse, mode } = kommentarModal;
    const text = kommentarModalText.trim();
    if (mode === "add" && !text) return;
    setKommentarModalSenden(true);
    try {
      if (mode === "reopen") {
        setWiedereroeffnenId(schueler);
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ typ: "projektplanWiedereroeffnen", proffToken: window.PPREN_SESSION?.token || "", schueler, kommentar: text }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
        setProjekte((ps) => ps.map((p) => (p.Schüler === schueler ? { ...p, Status: "Entwurf" } : p)));
        if (text) lade();
      } else {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ typ: "plangKommentarHinzefuegen", token: window.PPREN_SESSION?.token || "", schueler, klasse, text }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
        setExpandedSchueler(schueler);
        lade();
      }
      setKommentarModal(null);
      setKommentarModalText("");
    } catch (e) {
      alert(mode === "reopen" ? "Konnte net zréck op Entwurf setzen: " + e.message : "Konnte de Kommentar net späicheren: " + e.message);
    } finally {
      setWiedereroeffnenId(null);
      setKommentarModalSenden(false);
    }
  };

  const kommentarerFuer = (schueler) => plangKommentarer.filter((k) => k.Schüler === schueler);

  // ===== Feedback als PDF zum Projektplang =====
  const feedbackFuer = (schueler) => plangFeedbackPdfs.filter((f) => f.Schüler === schueler);

  const oeffneFeedbackModal = (schueler, klasse) => {
    setFeedbackModal({ schueler, klasse });
    setFeedbackDateien([]);
  };
  const schliesFeedbackModal = () => {
    if (feedbackSenden) return;
    setFeedbackModal(null);
    setFeedbackDateien([]);
  };
  const feedbackDateienBeifuegen = (fileList) => {
    const neie = Array.from(fileList || []);
    const keenPdf = neie.filter((f) => !/\.pdf$/i.test(f.name));
    if (keenPdf.length > 0) alert("Nëmmen PDF-Dateien sinn erlaabt: " + keenPdf.map((f) => f.name).join(", "));
    const pdfs = neie.filter((f) => /\.pdf$/i.test(f.name));
    const zuGross = pdfs.filter((f) => f.size > FEEDBACK_MAX_MB * 1024 * 1024);
    if (zuGross.length > 0) alert(`Zu grouss (max. ${FEEDBACK_MAX_MB} MB pro Datei): ` + zuGross.map((f) => f.name).join(", "));
    const ok = pdfs.filter((f) => f.size <= FEEDBACK_MAX_MB * 1024 * 1024);
    setFeedbackDateien((alt) => [...alt, ...ok]);
  };
  const feedbackDateiZuBase64 = (datei) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(datei);
  });
  const feedbackEropLueden = async () => {
    if (!feedbackModal || feedbackDateien.length === 0) return;
    const { schueler, klasse } = feedbackModal;
    setFeedbackSenden(true);
    const fehler = [];
    for (const d of feedbackDateien) {
      try {
        const inhaltBase64 = await feedbackDateiZuBase64(d);
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ typ: "plangFeedbackPdfHinzefuegen", token: window.PPREN_SESSION?.token || "", schueler, klasse, dateiName: d.name, inhaltBase64 }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      } catch (e) {
        fehler.push(d.name + ": " + e.message);
      }
    }
    setFeedbackSenden(false);
    setFeedbackDateien([]);
    lade();
    if (fehler.length > 0) alert("Net all Dateien konnten erop geluede ginn:\n" + fehler.join("\n"));
  };
  const feedbackLoeschen = async (f) => {
    if (!window.confirm(`Feedback-PDF "${f.Dateiname}" wierklech ewechhuelen? (Datei geet an de Drive-Pabeierkuerf.)`)) return;
    setFeedbackLoeschId(f.ID);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "plangFeedbackPdfLoeschen", token: window.PPREN_SESSION?.token || "", id: f.ID }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setPlangFeedbackPdfs((l) => l.filter((x) => x.ID !== f.ID));
    } catch (e) {
      alert("Konnt d'PDF net ewechhuelen: " + e.message);
    } finally {
      setFeedbackLoeschId(null);
    }
  };

  // ===== Feedback-Check (KI): gouf d'Feedback am neie Projektplang ëmgesat? =====
  const zeitVun = (wert) => {
    if (!wert) return 0;
    const t = String(wert);
    const m = t.match(/(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
    const d = Date.parse(t);
    return isNaN(d) ? 0 : d;
  };
  const letzterCheckFuer = (schueler) => {
    const l = plangFeedbackChecks.filter((c) => c.Schüler === schueler);
    return l.length ? l.reduce((a, b) => (zeitVun(b.Erstallt) >= zeitVun(a.Erstallt) ? b : a)) : null;
  };
  // 🔔 = de Schüler huet de Plang NOM leschte Feedback nei areecht an et gouf nach kee Check.
  const neiNoFeedback = (p) => {
    const fb = feedbackFuer(p.Schüler);
    if (fb.length === 0 || !String(p.Status || "").startsWith("Ein")) return false;
    const letztesFb = Math.max(...fb.map((f) => zeitVun(f.Erstallt)));
    const c = letzterCheckFuer(p.Schüler);
    const planZait = zeitVun(p["Zuletzt aktualisiert"]);
    return planZait > letztesFb && planZait > (c ? zeitVun(c.Erstallt) : 0);
  };
  const oeffneCheck = (schueler, klasse) => {
    setCheckFehler(null);
    setCheckModal({ schueler, klasse });
  };
  const schliesCheck = () => {
    if (checkLaeuftId) return;
    setCheckModal(null);
  };
  const starteCheck = async () => {
    if (!checkModal) return;
    if (!window.confirm("D'Feedback-PDF(en) (mat dem Schülernumm am Kapp) an den Projektplang-Text ginn elo un d'Claude-API geschéckt. Weiderfueren?")) return;
    const { schueler, klasse } = checkModal;
    setCheckLaeuftId(schueler);
    setCheckFehler(null);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "plangFeedbackCheck", token: window.PPREN_SESSION?.token || "", schueler, klasse }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setPlangFeedbackChecks((l) => [...l, {
        ID: data.id, Schüler: schueler, Klasse: klasse, Erstallt: data.erstallt, VunProf: "",
        "Feedback-Dateien": (data.dateien || []).join(" | "),
        Zesummefaassung: data.resultat.zesummefaassung,
        "Resultat (JSON)": JSON.stringify(data.resultat),
      }]);
    } catch (e) {
      setCheckFehler(e.message);
    } finally {
      setCheckLaeuftId(null);
    }
  };
  const checkAktuell = checkModal ? letzterCheckFuer(checkModal.schueler) : null;
  let checkResultat = null;
  if (checkAktuell) {
    try { checkResultat = JSON.parse(checkAktuell["Resultat (JSON)"]); } catch (e) { checkResultat = null; }
  }
  const CHECK_STATUS = {
    emgesat: { label: "✅ ëmgesat", klass: "check-emgesat" },
    deelweis: { label: "🟡 deelweis", klass: "check-deelweis" },
    oppen: { label: "⛔ oppen", klass: "check-oppen" },
  };

  // ===== Plang-Check: automatesch Regelen + KI-Entworf → Kommentaren =====
  const [plangCheckModal, setPlangCheckModal] = useState(null);
  const [plangCheckPunkte, setPlangCheckPunkte] = useState([]);
  const [plangKiLaeuft, setPlangKiLaeuft] = useState(false);
  const [plangKiFehler, setPlangKiFehler] = useState(null);
  const [plangKiLehrer, setPlangKiLehrer] = useState(null);
  const [plangCheckSenden, setPlangCheckSenden] = useState(false);

  const oeffnePlangCheck = (p) => {
    const regelen = plangRegelCheck(p).map((k, i) => ({ ...k, id: "r" + i, quell: "Regel", aktiv: k.prioritaet !== "klein" }));
    setPlangCheckPunkte(regelen);
    setPlangKiFehler(null);
    setPlangKiLehrer(null);
    setPlangCheckModal({ schueler: p.Schüler, klasse: p.Klasse, titel: p.Titel });
  };
  const schliesPlangCheck = () => {
    if (plangKiLaeuft || plangCheckSenden) return;
    setPlangCheckModal(null);
  };
  const plangPunktAendern = (id, patch) =>
    setPlangCheckPunkte((l) => l.map((k) => (k.id === id ? { ...k, ...patch } : k)));

  const plangKiStarten = async () => {
    if (!plangCheckModal) return;
    if (!window.confirm("De Projektplang-Text gëtt elo un d'Claude-API geschéckt, fir e Feedback-Entworf ze maachen. Weiderfueren?")) return;
    setPlangKiLaeuft(true);
    setPlangKiFehler(null);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "plangKiFeedback", token: window.PPREN_SESSION?.token || "", schueler: plangCheckModal.schueler, klasse: plangCheckModal.klasse }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      const r = data.resultat || {};
      const nei = (r.kommentare || []).map((k, i) => ({
        id: "k" + Date.now() + i, quell: "KI", feld: k.feld, prioritaet: k.prioritaet, text: k.text, aktiv: k.prioritaet !== "klein",
      }));
      if ((r.aufgaben_vorschlag || []).length > 0) {
        nei.push({
          id: "ka" + Date.now(), quell: "KI", feld: "Aufgaben", prioritaet: "wichtig", aktiv: true,
          text: "Vorschlag für deine Aufgaben (jeweils Theorie und Praxis):\n" +
            r.aufgaben_vorschlag.map((a) => `• ${a.schritt} – Theorie: ${a.theorie} | Praxis: ${a.praxis}`).join("\n"),
        });
      }
      if ((r.meilenstein_vorschlag || []).length > 0) {
        nei.push({
          id: "km" + Date.now(), quell: "KI", feld: "Meilensteine", prioritaet: "mittel", aktiv: true,
          text: "Vorschlag für deine Meilensteine (überprüfbare Ergebnisse, Daten bitte anpassen):\n" +
            r.meilenstein_vorschlag.map((m) => `• ${m.datum}: ${m.ergebnis}`).join("\n"),
        });
      }
      setPlangCheckPunkte((l) => [...l, ...nei]);
      setPlangKiLehrer(r.fuer_lehrer || null);
    } catch (e) {
      setPlangKiFehler(e.message);
    } finally {
      setPlangKiLaeuft(false);
    }
  };

  const plangCheckAlsKommentar = async () => {
    if (!plangCheckModal) return;
    const auswiel = plangCheckPunkte.filter((k) => k.aktiv && String(k.text || "").trim());
    if (auswiel.length === 0) return;
    if (!window.confirm(`${auswiel.length} Kommentar(en) un de Schüler schécken?`)) return;
    setPlangCheckSenden(true);
    let ok = 0;
    try {
      for (const k of auswiel) {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            typ: "plangKommentarHinzefuegen", token: window.PPREN_SESSION?.token || "",
            schueler: plangCheckModal.schueler, klasse: plangCheckModal.klasse,
            text: `[${k.feld}] ${String(k.text).trim()}`,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
        ok++;
      }
      setExpandedSchueler(plangCheckModal.schueler);
      setPlangCheckModal(null);
      lade();
    } catch (e) {
      alert(`Nëmmen ${ok} vun ${auswiel.length} Kommentaren gespäichert: ` + e.message);
      lade();
    } finally {
      setPlangCheckSenden(false);
    }
  };
  const PRIO_LABEL = { wichtig: "🔴 wichteg", mittel: "🟠 mëttel", klein: "⚪ kleng" };

  const ausgiFuer = (schueler) => ausgaben.filter((a) => a.Schüler === schueler).reduce((s, a) => s + (Number(a.Betrag) || 0), 0);

  const statusAendern = async (schueler, periode, neuerStatus) => {
    const id = `${schueler}__${periode}`;
    setAendernId(id);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "statusAendern", token: window.PPREN_SESSION?.token || "", schueler, periode, neuerStatus }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Unbekannter Fehler");
      setBewertungen((bs) => bs.map((b) => (b.Schüler === schueler && b.Periode === periode ? { ...b, Status: neuerStatus } : b)));
    } catch (e) {
      alert("Konnte Status nicht ändern: " + e.message);
    } finally {
      setAendernId(null);
    }
  };

  // Erstellt/aktualiséiert de Suivi-PDF onofhängeg vun enger Fräigab/
  // Finaliséierung -- hëlleft z.B. nodeems eng Bewertung am Sheet vun Hand
  // ugepasst gouf, oder wann de leschte Versuch feelgeschloen ass.
  const suiviPdfGeneréieren = async (schueler) => {
    setSuiviPdfId(schueler);
    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ typ: "suiviPdfGeneréieren", token: window.PPREN_SESSION?.token || "", schueler }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Onbekannte Feeler");
      setProjekte((ps) => ps.map((p) => (p.Schüler === schueler ? { ...p, "Suivi-PDF-Link (Schüler)": data.url } : p)));
      setBewertungen((bs) => bs.map((b) => (b.Schüler === schueler ? { ...b, "Suivi-PDF-Link (Schüler)": data.url } : b)));
    } catch (e) {
      alert("Konnte de Suivi-PDF net generéieren: " + e.message);
    } finally {
      setSuiviPdfId(null);
    }
  };

  const klassen = useMemo(() => ["alle", ...new Set(projekte.map((p) => p.Klasse).filter(Boolean))], [projekte]);
  const betreuerListe = useMemo(() => ["alle", ...new Set(projekte.map((p) => p.Betreuer).filter(Boolean))], [projekte]);

  const gefiltert = projekte.filter((p) => {
    if (filterKlasse !== "alle" && p.Klasse !== filterKlasse) return false;
    if (filterBetreuer !== "alle" && p.Betreuer !== filterBetreuer) return false;
    if (suche && !`${p.Schüler} ${virnummVun[p.Schüler] || ""} ${p.Titel}`.toLowerCase().includes(suche.toLowerCase())) return false;
    return true;
  });

  const zaehler = {
    total: projekte.length,
    done: projekte.filter((p) => statusMeta(p.Status).key === "done").length,
    pending: projekte.filter((p) => statusMeta(p.Status).key === "pending").length,
    draft: projekte.filter((p) => statusMeta(p.Status).key === "draft").length,
  };

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">Lehrer-Dashboard · Sciences Environnementales</span>
        </div>
        <button className="refresh-btn" onClick={lade} disabled={loading}>{loading ? "Lädt…" : "🔄 Aktualisieren"}</button>
      </header>

      <div className="tools-row">
        <a className="tool-link" href="suivi.html">📖 Suivien vun de Schüler</a>
        <a className="tool-link" href="bewertung.html">📊 Bewertung</a>
        <a className="tool-link" href="fachgespraech.html">🗣️ Fachgespréich</a>
        <a className="tool-link" href="zieluewerpreiwung.html">🎯 Ziler iwwerpréiwen</a>
        <a className="tool-link" href="wochenberichte-korrigeieren.html">📋 Wochenberichter</a>
        <a className="tool-link" href="rendezvousen.html">📅 Rendez-vousen plangen</a>
        <a className="tool-link" href="zeitplang-verwalten.html">🔒 Zäitplang verwalten</a>
        <a className="tool-link" href="#budget">💰 Budget genehmegen</a>
      </div>

      <div className="stats-row">
        <div className="stat-card">
          <span className="stat-num">{zaehler.total}</span>
          <span className="stat-label">Projekte gesamt</span>
        </div>
        <div className="stat-card stat-done">
          <span className="stat-num">{zaehler.done}</span>
          <span className="stat-label">Freigegeben</span>
        </div>
        <div className="stat-card stat-pending">
          <span className="stat-num">{zaehler.pending}</span>
          <span className="stat-label">Wartet auf Freigabe</span>
        </div>
        <div className="stat-card stat-draft">
          <span className="stat-num">{zaehler.draft}</span>
          <span className="stat-label">Im Entwurf</span>
        </div>
        <div className="stat-card stat-pending">
          <span className="stat-num">{wochenberichte.filter((w) => w.Status === "Agereecht").length}</span>
          <span className="stat-label">Wochenberichter ze korrigéieren</span>
        </div>
      </div>

      <div className="controls">
        <input className="search" placeholder="Suche nach Schüler/-in oder Titel…" value={suche} onChange={(e) => setSuche(e.target.value)} />
        <select className="select" value={filterKlasse} onChange={(e) => setFilterKlasse(e.target.value)}>
          {klassen.map((k) => <option key={k} value={k}>{k === "alle" ? "Alle Klassen" : k}</option>)}
        </select>
        <select className="select" value={filterBetreuer} onChange={(e) => setFilterBetreuer(e.target.value)}>
          {betreuerListe.map((b) => <option key={b} value={b}>{b === "alle" ? "Alle Betreuer/-innen" : b}</option>)}
        </select>
      </div>

      <main className="table-wrap">
        {loading && <div className="empty">Lädt…</div>}
        {error && <div className="empty error">{error}</div>}
        {!loading && !error && gefiltert.length === 0 && <div className="empty">Noch keine Projekte eingereicht.</div>}

        {!loading && !error && gefiltert.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Betreuer/-in</th><th>Titel</th><th>Status</th><th>Zuletzt aktualisiert</th><th>Projektplan</th><th>Suivi</th><th>Dokumentatioun</th><th>Kommentarer</th><th></th>
              </tr>
            </thead>
            <tbody>
              {gefiltert.map((p, i) => {
                const meta = statusMeta(p.Status);
                const ks = kommentarerFuer(p.Schüler);
                const fbn = feedbackFuer(p.Schüler).length;
                const neiFb = neiNoFeedback(p);
                const oppen = ks.filter((k) => k.Erledegt !== "Jo").length;
                const expanded = expandedSchueler === p.Schüler;
                return (
                  <React.Fragment key={i}>
                    <tr>
                      <td className="cell-strong">{ufweis(p.Schüler)}</td>
                      <td>{p.Klasse}</td>
                      <td>{p.Betreuer}</td>
                      <td className="cell-muted">{p.Titel || "–"}</td>
                      <td><span className={`pill pill-${meta.key}`}>{meta.label}</span></td>
                      <td className="cell-muted">{p["Zuletzt aktualisiert"]}</td>
                      <td className="link-cell">
                        {p["Projektplan-Link"] ? <a className="link" href={p["Projektplan-Link"]} rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                        {p["Projektplan-PDF-Link"] && <a className="link link-pdf" href={p["Projektplan-PDF-Link"]} rel="noreferrer">PDF ↗</a>}
                      </td>
                      <td className="link-cell">
                        {p["Suivi-Link"] ? <a className="link" href={p["Suivi-Link"]} rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                        {p["Suivi-PDF-Link (Schüler)"] && <a className="link link-pdf" href={p["Suivi-PDF-Link (Schüler)"]} rel="noreferrer">PDF ↗</a>}
                        <button
                          type="button"
                          className="btn-gen btn-gen-icon"
                          disabled={suiviPdfId === p.Schüler}
                          onClick={() => suiviPdfGeneréieren(p.Schüler)}
                          title="Suivi-PDF (nei) generéieren"
                        >
                          {suiviPdfId === p.Schüler ? "…" : "📄"}
                        </button>
                      </td>
                      <td>{p["Dokumentatioun-Link"] ? <a className="link" href={p["Dokumentatioun-Link"]} rel="noreferrer">SharePoint ↗</a> : <span className="cell-muted">–</span>}</td>
                      <td>
                        <div className="kommentar-cell">
                          {ks.length > 0 && (
                            <button
                              type="button"
                              className={`kommentar-toggle${oppen > 0 ? " oppen" : ""}`}
                              onClick={() => setExpandedSchueler(expanded ? null : p.Schüler)}
                            >
                              {oppen > 0 ? `🟠 ${oppen} oppen` : `✅ ${ks.length}`}
                            </button>
                          )}
                          <button type="button" className="btn-gen" onClick={() => oeffneKommentarModal(p.Schüler, p.Klasse, "add")} title="Kommentar derbäisetzen">
                            💬 +
                          </button>
                          <button type="button" className="btn-gen" onClick={() => oeffneFeedbackModal(p.Schüler, p.Klasse)} title="Feedback als PDF eroplueden">
                            📄 PDF{fbn > 0 ? ` (${fbn})` : ""}
                          </button>
                          <button type="button" className="btn-gen" onClick={() => oeffnePlangCheck(p)} title="Plang-Check: automatesch Kritären + KI-Entworf → Kommentaren">
                            🧪 Plang-Check
                          </button>
                          {fbn > 0 && (
                            <button
                              type="button"
                              className={`btn-gen${neiFb ? " btn-gen-warn" : ""}`}
                              onClick={() => oeffneCheck(p.Schüler, p.Klasse)}
                              title={neiFb ? "Nei areecht nom Feedback — Feedback-Check méiglech" : "Feedback-Check: gouf d'Feedback ëmgesat?"}
                            >
                              🔍 Check{neiFb ? " 🔔" : ""}
                            </button>
                          )}
                        </div>
                      </td>
                      <td>
                        {(meta.key === "pending" || meta.key === "done") && (
                          <button
                            className="btn-gen btn-gen-warn"
                            disabled={wiedereroeffnenId === p.Schüler}
                            onClick={() => oeffneKommentarModal(p.Schüler, p.Klasse, "reopen")}
                            title="Projektplang zréck op Entwurf setzen, sou datt de Schüler nees änneren kann"
                          >
                            {wiedereroeffnenId === p.Schüler ? "…" : "🔓 Wiedereröffnen"}
                          </button>
                        )}
                      </td>
                    </tr>
                    {expanded && (
                      <tr>
                        <td colSpan="11" className="kommentar-expand">
                          {ks.length === 0 ? (
                            <span className="cell-muted">Nach keng Kommentarer.</span>
                          ) : (
                            [...ks].reverse().map((k) => (
                              <div key={k.ID} className={`kommentar-row-mini${k.Erledegt === "Jo" ? " erledegt" : ""}`}>
                                <span className="kommentar-text-mini">{k.Text}</span>
                                <span className="kommentar-meta-mini">
                                  {k.VunProf} · {k.Erstallt}
                                  {k.Erledegt === "Jo" ? ` · ✅ vum Schüler als geännert markéiert (${k.ErledegtZait})` : " · ⏳ nach net markéiert"}
                                </span>
                              </div>
                            ))
                          )}
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 className="section-titel">Bewertungen — Status</h2>
      <main className="table-wrap">
        {!loading && !error && bewertungen.length === 0 && <div className="empty">Noch keine Bewertungen abgegeben.</div>}
        {!loading && !error && bewertungen.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Periode</th><th>Note</th><th>Status</th><th>Suivi</th>
              </tr>
            </thead>
            <tbody>
              {bewertungen.map((b, i) => {
                const id = `${b.Schüler}__${b.Periode}`;
                const finalisiert = b.Status === "Finalisiert";
                return (
                  <tr key={i}>
                    <td className="cell-strong">{ufweis(b.Schüler)}</td>
                    <td>{b.Periode}</td>
                    <td>{b.Note} / 60</td>
                    <td>
                      <select
                        className={`status-select ${finalisiert ? "status-select-final" : "status-select-draft"}`}
                        value={b.Status || "Entwurf"}
                        disabled={aendernId === id}
                        onChange={(e) => statusAendern(b.Schüler, b.Periode, e.target.value)}
                      >
                        <option value="Entwurf">Entwurf</option>
                        <option value="Finalisiert">Finalisiert</option>
                      </select>
                    </td>
                    <td className="link-cell">
                      {b["Suivi-Link"] ? <a className="link" href={b["Suivi-Link"]} rel="noreferrer">Word ↗</a> : <span className="cell-muted">–</span>}
                      {b["Suivi-PDF-Link (Schüler)"] && <a className="link link-pdf" href={b["Suivi-PDF-Link (Schüler)"]} rel="noreferrer">PDF ↗</a>}
                      <button
                        type="button"
                        className="btn-gen btn-gen-icon"
                        disabled={suiviPdfId === b.Schüler}
                        onClick={() => suiviPdfGeneréieren(b.Schüler)}
                        title="Suivi-PDF (nei) generéieren"
                      >
                        {suiviPdfId === b.Schüler ? "…" : "📄"}
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 id="budget" className="section-titel">💰 Budget / Kostepläng</h2>
      <main className="table-wrap">
        {!loading && !error && budget.length === 0 && <div className="empty">Nach keng Kostepläng ugefrot.</div>}
        {!loading && !error && budget.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Status</th><th>Ausgi / Max</th><th></th>
              </tr>
            </thead>
            <tbody>
              {budget.map((b, i) => {
                const ausgi = ausgiFuer(b.Schüler);
                const max = Number(b.Max) || 500;
                return (
                  <tr key={i}>
                    <td className="cell-strong">{ufweis(b.Schüler)}</td>
                    <td>{b.Klasse}</td>
                    <td><span className={`pill pill-${b.Status === "Genehmegt" ? "done" : "pending"}`}>{b.Status}</span></td>
                    <td className="cell-muted">{b.Status === "Genehmegt" ? `${ausgi.toFixed(2)} € / ${max} €` : "–"}</td>
                    <td>
                      {b.Status === "Ageraecht" && (
                        <button className="btn-gen" disabled={genehmegId === b.Schüler} onClick={() => kostenplanGenehmegen(b.Schüler, b.Klasse)}>
                          {genehmegId === b.Schüler ? "…" : "✅ Genehmegen"}
                        </button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </main>

      <h2 className="section-titel">Wochenberichter</h2>
      <main className="table-wrap">
        <div className="wb-link-row">
          <a className="link-btn" href="wochenberichte-korrigeieren.html">📋 Alleguer korrigéieren →</a>
        </div>
        {!loading && !error && wochenberichte.length === 0 && <div className="empty">Nach keng Wochenberichter ofginn.</div>}
        {!loading && !error && wochenberichte.length > 0 && (
          <table className="table">
            <thead>
              <tr>
                <th>Schüler/-in</th><th>Klasse</th><th>Periode</th><th>Woch</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {wochenberichte
                .slice()
                .sort((a, b) => (a.Status === "Agereecht" ? -1 : 1) - (b.Status === "Agereecht" ? -1 : 1))
                .slice(0, 15)
                .map((w, i) => (
                  <tr key={i}>
                    <td className="cell-strong">{ufweis(w.Schüler)}</td>
                    <td>{w.Klasse}</td>
                    <td>{w.Periode}</td>
                    <td>{w.Woche}</td>
                    <td><span className={`pill pill-${w.Status === "Bewäert" ? "done" : "pending"}`}>{w.Status}</span></td>
                  </tr>
                ))}
            </tbody>
          </table>
        )}
      </main>

      {kommentarModal && (
        <div className="modal-overlay" onClick={schliesKommentarModal}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <h3>
              {kommentarModal.mode === "reopen"
                ? `Projektplang vun "${ufweis(kommentarModal.schueler)}" zréck op Entwurf setzen`
                : `Kommentar fir "${ufweis(kommentarModal.schueler)}"`}
            </h3>
            <p className="modal-hint">
              {kommentarModal.mode === "reopen"
                ? "Optionale Kommentar fir de Schüler (gëtt him/hir am Formulaire ugewisen) — kann och eidel bleiwen."
                : "Gëtt him/hir am Projektplang-Formulaire ugewisen. De Schüler kann en duerno als „geännert“ markéieren."}
            </p>
            <textarea
              className="modal-textarea"
              rows={10}
              autoFocus
              value={kommentarModalText}
              onChange={(e) => setKommentarModalText(e.target.value)}
              placeholder="Kommentar schreiwen…"
              disabled={kommentarModalSenden}
            />
            <div className="modal-actions">
              <button type="button" className="btn-gen" onClick={schliesKommentarModal} disabled={kommentarModalSenden}>
                Ofbriechen
              </button>
              <button
                type="button"
                className="btn-gen btn-gen-primary"
                onClick={kommentarModalAbschécken}
                disabled={kommentarModalSenden || (kommentarModal.mode === "add" && !kommentarModalText.trim())}
              >
                {kommentarModalSenden
                  ? "…"
                  : kommentarModal.mode === "reopen"
                  ? "Zréck op Entwurf setzen"
                  : "Kommentar späicheren"}
              </button>
            </div>
          </div>
        </div>
      )}

      {checkModal && (
        <div className="modal-overlay" onClick={schliesCheck}>
          <div className="modal-box modal-box-breet" onClick={(e) => e.stopPropagation()}>
            <h3>🔍 Feedback-Check — {ufweis(checkModal.schueler)}</h3>
            <p className="modal-hint">
              KI-Ufangsbewäertung: gouf d'Feedback am aktuelle Projektplang ëmgesat? De Prof entscheed. Nëmme Proffen gesinn dat, de Schüler net.
            </p>
            {checkFehler && <div className="check-fehler">{checkFehler}</div>}
            {checkAktuell && checkResultat ? (
              <>
                <p className="check-meta">
                  Check vum {String(checkAktuell.Erstallt)}{checkAktuell.VunProf ? ` · ${checkAktuell.VunProf}` : ""}
                  {checkAktuell["Feedback-Dateien"] ? ` · Feedback: ${checkAktuell["Feedback-Dateien"]}` : ""}
                </p>
                {checkResultat.zesummefaassung && <p className="check-zesummefaassung">{checkResultat.zesummefaassung}</p>}
                <ul className="check-liste">
                  {(checkResultat.punkten || []).map((k, i) => {
                    const st = CHECK_STATUS[k.status] || CHECK_STATUS.oppen;
                    return (
                      <li key={i} className={st.klass}>
                        <span className="check-status">{st.label}</span>
                        <span className="check-punkt">{k.punkt}</span>
                        {k.beleg && <span className="check-beleg">{k.beleg}</span>}
                      </li>
                    );
                  })}
                </ul>
                {checkResultat.proffHiweis && <p className="check-hiweis">💡 {checkResultat.proffHiweis}</p>}
              </>
            ) : (
              <p className="modal-hint">Nach kee Check fir dëse Schüler.</p>
            )}
            <div className="modal-actions">
              <button type="button" className="btn-gen" onClick={schliesCheck} disabled={!!checkLaeuftId}>Zoumaachen</button>
              <button type="button" className="btn-gen btn-gen-primary" onClick={starteCheck} disabled={!!checkLaeuftId}>
                {checkLaeuftId ? "Préift… (kann bis zu 1 Minutt daueren)" : checkAktuell ? "🔍 Nei préifen" : "🔍 Check starten"}
              </button>
            </div>
          </div>
        </div>
      )}

      {plangCheckModal && (
        <div className="modal-overlay" onClick={schliesPlangCheck}>
          <div className="modal-box modal-box-breet" onClick={(e) => e.stopPropagation()}>
            <h3>🧪 Plang-Check — {ufweis(plangCheckModal.schueler)}</h3>
            <p className="modal-hint">
              {plangCheckModal.titel ? <><b>{plangCheckModal.titel}</b> · </> : null}
              Automatesch Kritären aus dem Bewäertungsraster. Mat „KI-Entworf“ kommen nach Kommentaren, Aufgaben (Theorie/Praxis) a Meilesteng derbäi.
              Ugehaakte Punkte ginn als Kommentar un de Schüler; den Text kanns de virdrun änneren.
            </p>
            {plangKiFehler && <div className="check-fehler">{plangKiFehler}</div>}
            {plangKiLehrer && (
              <div className="pc-lehrer">
                <div className="pc-lehrer-titel">Nëmme fir d'Léierpersonal</div>
                {plangKiLehrer.zusammenfassung && <p>{plangKiLehrer.zusammenfassung}</p>}
                {plangKiLehrer.raster_schaetzung && <p><b>Raster (Aschätzung):</b> {plangKiLehrer.raster_schaetzung}</p>}
                {plangKiLehrer.ki_indizien && <p><b>KI-Indizien:</b> {plangKiLehrer.ki_indizien}</p>}
                {(plangKiLehrer.gespraechsfragen || []).length > 0 && (
                  <>
                    <b>Froen fir d'Gespréich:</b>
                    <ul>{plangKiLehrer.gespraechsfragen.map((f, i) => <li key={i}>{f}</li>)}</ul>
                  </>
                )}
              </div>
            )}
            {plangCheckPunkte.length === 0 ? (
              <p className="modal-hint">Keng automatesch Punkten — de Plang erfëllt d'Basis-Kritären.</p>
            ) : (
              <ul className="pc-liste">
                {plangCheckPunkte.map((k) => (
                  <li key={k.id} className={`pc-${k.prioritaet}${k.aktiv ? "" : " pc-aus"}`}>
                    <label className="pc-kopf">
                      <input type="checkbox" checked={k.aktiv} onChange={(e) => plangPunktAendern(k.id, { aktiv: e.target.checked })} />
                      <span className="pc-feld">{k.feld}</span>
                      <span className="pc-prio">{PRIO_LABEL[k.prioritaet] || k.prioritaet}</span>
                      <span className="pc-quell">{k.quell}</span>
                    </label>
                    <textarea
                      className="pc-text"
                      value={k.text}
                      rows={Math.min(8, Math.max(2, String(k.text).split("\n").length + 1))}
                      onChange={(e) => plangPunktAendern(k.id, { text: e.target.value })}
                    />
                  </li>
                ))}
              </ul>
            )}
            <div className="modal-actions">
              <button type="button" className="btn-gen" onClick={schliesPlangCheck} disabled={plangKiLaeuft || plangCheckSenden}>Zoumaachen</button>
              <button type="button" className="btn-gen" onClick={plangKiStarten} disabled={plangKiLaeuft || plangCheckSenden}>
                {plangKiLaeuft ? "KI schafft… (bis zu 1 Minutt)" : "🤖 KI-Entworf"}
              </button>
              <button
                type="button"
                className="btn-gen btn-gen-primary"
                onClick={plangCheckAlsKommentar}
                disabled={plangKiLaeuft || plangCheckSenden || plangCheckPunkte.filter((k) => k.aktiv).length === 0}
              >
                {plangCheckSenden ? "Schéckt…" : `💬 ${plangCheckPunkte.filter((k) => k.aktiv).length} als Kommentar schécken`}
              </button>
            </div>
          </div>
        </div>
      )}

      {feedbackModal && (
        <div className="modal-overlay" onClick={schliesFeedbackModal}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <h3>Feedback-PDF fir "{ufweis(feedbackModal.schueler)}"</h3>
            <p className="modal-hint">
              De Schüler gesäit d'PDF an sengem Projektplang-Formulaire a kann se erofluede. Nëmmen PDF, max. {FEEDBACK_MAX_MB} MB pro Datei.
            </p>
            {feedbackFuer(feedbackModal.schueler).length > 0 && (
              <ul className="fb-liste">
                {feedbackFuer(feedbackModal.schueler).map((f) => (
                  <li key={f.ID}>
                    <a className="link" href={f.Link} target="_blank" rel="noreferrer">📄 {f.Dateiname}</a>
                    <span className="fb-meta">{f.VunProf} · {f.Erstallt}</span>
                    <button type="button" className="datei-weg" disabled={feedbackLoeschId === f.ID} onClick={() => feedbackLoeschen(f)} title="Ewechhuelen">
                      {feedbackLoeschId === f.ID ? "…" : "🗑️"}
                    </button>
                  </li>
                ))}
              </ul>
            )}
            <div
              className={`dropzone${feedbackDragOver ? " dropzone-aktiv" : ""}`}
              onDragOver={(e) => { e.preventDefault(); setFeedbackDragOver(true); }}
              onDragLeave={() => setFeedbackDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setFeedbackDragOver(false); feedbackDateienBeifuegen(e.dataTransfer.files); }}
              onClick={() => document.getElementById("feedback-pdf-input").click()}
            >
              📎 PDF hei dropen oder klicken zum Auswielen
              <input
                id="feedback-pdf-input"
                type="file"
                multiple
                accept="application/pdf,.pdf"
                style={{ display: "none" }}
                onChange={(e) => { feedbackDateienBeifuegen(e.target.files); e.target.value = ""; }}
              />
            </div>
            {feedbackDateien.length > 0 && (
              <ul className="extern-datei-liste">
                {feedbackDateien.map((d, i) => (
                  <li key={i}>
                    <span>{d.name} ({Math.round(d.size / 1024)} KB)</span>
                    <button type="button" className="datei-weg" disabled={feedbackSenden} onClick={() => setFeedbackDateien((l) => l.filter((_, j) => j !== i))}>✕</button>
                  </li>
                ))}
              </ul>
            )}
            <div className="modal-actions">
              <button type="button" className="btn-gen" onClick={schliesFeedbackModal} disabled={feedbackSenden}>Zoumaachen</button>
              <button
                type="button"
                className="btn-gen btn-gen-primary"
                onClick={feedbackEropLueden}
                disabled={feedbackSenden || feedbackDateien.length === 0}
              >
                {feedbackSenden ? "Lued erop…" : `📤 Eroplueden${feedbackDateien.length > 0 ? ` (${feedbackDateien.length})` : ""}`}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
