<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="LogoSE_weisHintergrund.png" />
<title>PPREN Mäin Suivi</title>
<script src="auth-guard.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif;color:#8a2b1f;white-space:pre-wrap;">' +
      '<h2 style="margin-top:0;">Fehler beim Laden</h2>' +
      (e.message || "Unbekannter Fehler") +
      (e.filename ? "\n\nDatei: " + e.filename + " Zeile " + e.lineno : "") +
      "</div>";
  });
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymF-ntji7pYfnRIYxgRREtxVTUUgP38AHUjlbcpxyumpT3G2B1WdBf4M1ehmjXL4c/exec";

const PERIODEN_2GSE = ["Trimester 1", "Trimester 2", "Trimester 3"];
const PERIODEN_1GSE = ["Semester 1", "Semester 2"];

// Déiselwecht Faarfpalett wéi am Planungstool/Gantt-Chart, fir konsequent Faarwen
// iwwerall wou Meilensteng-Kategorien ugewisen ginn.
const KATEGORIE_FARWEN = { "Event": "#f0ec3a", "Iwwerpréiwung": "#d9d3f5", "Praktesch Phase": "#1ecdc4", "Ofgab": "#a9d92d", "Eegen": "#F67E1B", "Projektplang": "#5b9bd5" };
const KATEGORIE_TEXT = { "Event": "#1c2621", "Iwwerpréiwung": "#1c2621", "Praktesch Phase": "#04342c", "Ofgab": "#1c2621", "Eegen": "#ffffff", "Projektplang": "#ffffff" };

function sicherJson(text, fallback) {
  if (!text) return fallback;
  try { return JSON.parse(text); } catch { return fallback; }
}

function Fortschrittsbar({ prozent, farbe }) {
  return (
    <div className="bar-track">
      <div className="bar-fill" style={{ width: `${Math.min(100, Math.max(0, prozent))}%`, background: farbe }} />
    </div>
  );
}

/** Extrahéiert den éischte Kalennerdatum aus engem Woche-Label ("dd.mm.yyyy – dd.mm.yyyy"). */
function ersteDatumVunWoche(wocheLabel) {
  const m = (wocheLabel || "").match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function formatDatumKuerz(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}
/** Wandelt "dd.mm.yyyy" (Rendezvousen-Format) an ISO "yyyy-mm-dd" fir Sortéieren/Vergläichen um. */
function dmyZuIso(dmy) {
  if (!dmy) return "";
  const [t, m, j] = String(dmy).split(".");
  if (!t || !m || !j) return "";
  return `${j}-${m}-${t}`;
}

function App() {
  const istSchueler = window.PPREN_SESSION?.rolle === "Schüler";

  // M1: Nimm live vum Backend lueden, keng hart-codéiert Lëscht méi.
  const [personen, setPersonen] = useState([]);
  const [personenGelueden, setPersonenGelueden] = useState(false);
  useEffect(() => {
    fetch(WEB_APP_URL + "?namen=1")
      .then((r) => r.json())
      .then((d) => setPersonen(d.personen || []))
      .catch(() => {})
      .finally(() => setPersonenGelueden(true));
  }, []);
  const SCHUELER = useMemo(
    () => personen.filter((p) => p.rolle === "Schüler").map((p) => ({ id: p.numm, name: p.numm, virnumm: p.virnumm || "", klasse: p.klasse })),
    [personen]
  );
  const KLASSEN = useMemo(() => ["alle", ...new Set(SCHUELER.map((s) => s.klasse).filter(Boolean))], [SCHUELER]);

  const [filterKlasse, setFilterKlasse] = useState("alle");
  const SCHUELER_GEFILTERT = useMemo(
    () => (filterKlasse === "alle" ? SCHUELER : SCHUELER.filter((s) => s.klasse === filterKlasse)),
    [SCHUELER, filterKlasse]
  );

  const [schuelerId, setSchuelerId] = useState("");
  useEffect(() => {
    if (!personenGelueden || !istSchueler || schuelerId) return;
    const numm = window.PPREN_SESSION?.numm;
    if (numm && SCHUELER.find((s) => s.id === numm)) setSchuelerId(numm);
    // eslint-disable-next-line
  }, [personenGelueden, SCHUELER]);

  const [projekt, setProjekt] = useState(null);
  const [bewertungen, setBewertungen] = useState([]);
  const [wochenberichte, setWochenberichte] = useState([]);
  const [meilensteng, setMeilensteng] = useState([]);
  const [fachgespraeche, setFachgespraeche] = useState([]);
  const [zieluewerpreiwungen, setZieluewerpreiwungen] = useState([]);
  const [budgetInfo, setBudgetInfo] = useState(null); // { status, max } oder null wann näischt ugefrot
  const [ausgaben, setAusgaben] = useState([]);
  const [rendezvousen, setRendezvousen] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [geladen, setGeladen] = useState(false);

  const currentSchueler = SCHUELER.find((s) => s.id === schuelerId);
  const istGSE2 = currentSchueler?.klasse === "2GSE";
  const perioden = istGSE2 ? PERIODEN_2GSE : PERIODEN_1GSE;

  useEffect(() => {
    if (!schuelerId) return;
    setLoading(true);
    setError(null);
    setGeladen(false);
    fetch(WEB_APP_URL + "?token=" + encodeURIComponent(window.PPREN_SESSION?.token || ""))
      .then((res) => res.json())
      .then((data) => {
        const alleProjekte = data.projekte || [];
        const meins = alleProjekte.find((p) => p.Schüler === currentSchueler.name);
        setProjekt(meins || null);
        setBewertungen((data.bewertungen || []).filter((b) => b.Schüler === currentSchueler.name));
        setWochenberichte((data.wochenberichte || []).filter((w) => w.Schüler === currentSchueler.name));
        setFachgespraeche((data.fachgespraeche || []).filter((f) => f.Schüler === currentSchueler.name));
        setZieluewerpreiwungen((data.zieluewerpreiwungen || []).filter((z) => z.Schüler === currentSchueler.name));

        const meinBudget = (data.budget || []).find((b) => b.Schüler === currentSchueler.name);
        setBudgetInfo(meinBudget ? { status: meinBudget.Status, max: Number(meinBudget.Max) || 500 } : null);
        setAusgaben((data.ausgaben || []).filter((a) => a.Schüler === currentSchueler.name));
        setRendezvousen((data.rendezvousen || []).filter((r) => r.Schüler === currentSchueler.name));

        let gespäichert = [];
        const eintrag = (data.meilensteng || []).find((m) => m.Schüler === currentSchueler.name);
        if (eintrag && eintrag["Meilensteng (JSON)"]) {
          try { gespäichert = JSON.parse(eintrag["Meilensteng (JSON)"]); } catch { gespäichert = []; }
        }
        const offiziell = (data.offiziellZaitplang || [])
          .filter((m) => m.Klasse === currentSchueler.klasse)
          .map((m) => ({ titel: m.Titel, datum: m.Datum, status: "Ausstoend", quell: "Offiziell", kategorie: m.Kategorie || "Event" }));
        const eegenUndProjektplang = gespäichert
          .filter((m) => m.titel && m.datum && m.quell !== "Vakanz")
          .map((m) => ({ titel: m.titel, datum: m.datum, status: m.status || "Ausstoend", quell: m.quell || "Eegen", kategorie: m.quell === "Projektplang" ? "Projektplang" : "Eegen" }));
        const alleMeilensteng = [...offiziell, ...eegenUndProjektplang]
          .filter((m, i, arr) => arr.findIndex((x) => x.titel === m.titel) === i)
          .sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
        setMeilensteng(alleMeilensteng);
      })
      .catch(() => setError("Konnte Daten nicht laden."))
      .finally(() => { setLoading(false); setGeladen(true); });
  }, [schuelerId]);

  // WICHTEG: Just eng VALIDÉIERT (finalisiert) Bewertung gëtt hei ugewisen —
  // en Entworf (Status "Entwurf") ass just fir de Prof am Bewertungs-Tool
  // sichtbar, ëmol och wann e Prof selwer duerch dëst Suivi-Tool guckt. Esou
  // gesäit de Schüler nëmmen déi definitiv Punkten/Kommentaren, ni eng
  // laafend, nach net fäerdeg Bewertung.
  const bewertungFuer = (periode) => bewertungen.find((b) => b.Periode === periode && b.Status === "Finalisiert");
  const entworfFuer = (periode) => bewertungen.find((b) => b.Periode === periode && b.Status !== "Finalisiert");
  const planDetails = projekt ? sicherJson(projekt["Projektplan-Details (JSON)"], null) : null;

  // ===== Projet-Journal: alles chronologesch zesummesetzen =====
  const journal = useMemo(() => {
    if (meilensteng.length === 0 && wochenberichte.length === 0) return null;

    const findNootstMeilensteen = (isoDatum) => {
      if (!isoDatum || meilensteng.length === 0) return null;
      let bescht = null, bestDiff = Infinity;
      meilensteng.forEach((m) => {
        const diff = Math.abs(new Date(m.datum) - new Date(isoDatum));
        if (!isNaN(diff) && diff < bestDiff) { bestDiff = diff; bescht = m.titel; }
      });
      return bescht;
    };

    const wbNoMeilensteen = {};
    wochenberichte.forEach((w) => {
      const wocheDatum = ersteDatumVunWoche(w.Woche);
      const bezug = w.Meilensteen && w.Meilensteen.trim() ? w.Meilensteen.trim() : findNootstMeilensteen(wocheDatum);
      const schlëssel = bezug || "__ouni__";
      if (!wbNoMeilensteen[schlëssel]) wbNoMeilensteen[schlëssel] = [];
      wbNoMeilensteen[schlëssel].push({ ...w, isoDatum: wocheDatum });
    });
    Object.keys(wbNoMeilensteen).forEach((k) => wbNoMeilensteen[k].sort((a, b) => (a.isoDatum || "").localeCompare(b.isoDatum || "")));

    const zeitleischt = [
      ...meilensteng.map((m) => ({ art: "meilensteen", datum: m.datum, titel: m.titel, status: m.status, quell: m.quell, kategorie: m.kategorie })),
      ...fachgespraeche.map((f) => ({ art: "fachgespraech", datum: f.Datum, titel: `Fachgespréich — ${f.Periode}`, gesamt: f.Gesamt })),
      ...zieluewerpreiwungen.map((z) => ({ art: "ziler", datum: z.Datum, titel: `Ziel-Iwwerpréiwung Termin ${z.Termin} — ${z.Periode}`, punkte: z.Punkte, max: z.Max })),
    ]
      .filter((x) => x.datum)
      .sort((a, b) => String(a.datum).localeCompare(String(b.datum)));

    return { zeitleischt, wbNoMeilensteen };
  }, [meilensteng, wochenberichte, fachgespraeche, zieluewerpreiwungen]);

  // ===== Gesamt-Iwwerbléck: nächst Ofgab, nächst Rendez-vous, Gesamt-Fortschrëtt =====
  const iwwerbleck = useMemo(() => {
    const heidegIso = new Date().toISOString().slice(0, 10);

    const nächstOfgab = meilensteng
      .filter((m) => m.kategorie === "Ofgab" && m.datum >= heidegIso)
      .sort((a, b) => a.datum.localeCompare(b.datum))[0] || null;

    const nächstRv = [...rendezvousen]
      .map((r) => ({ ...r, isoDatum: dmyZuIso(r.Datum) }))
      .filter((r) => r.isoDatum && r.isoDatum >= heidegIso)
      .sort((a, b) => a.isoDatum.localeCompare(b.isoDatum))[0] || null;

    const relevant = meilensteng.filter((m) => m.quell !== "Vakanz");
    const erreecht = relevant.filter((m) => m.status === "Erreecht").length;
    const fortschrëttProzent = relevant.length > 0 ? Math.round((erreecht / relevant.length) * 100) : 0;

    return { nächstOfgab, nächstRv, fortschrëttProzent, gesamtMeilensteng: relevant.length, erreechtMeilensteng: erreecht };
  }, [meilensteng, rendezvousen]);

  // ===== Wochenberichter-Punkte-Zesummefaassung =====
  const wbZesummefaassung = useMemo(() => {
    let summe = 0, max = 0, verpasst = 0;
    wochenberichte.forEach((w) => {
      if (w.Status === "Entschëllegt") return;
      if (w.Status === "Bewäert") {
        try {
          const p = JSON.parse(w["Punkte (JSON)"]);
          summe += (p.zusammenfassung || 0) + (p.fortschritt || 0) + (p.anhaenge || 0) + (p.grammatik || 0);
        } catch {}
        max += 5;
      } else if (w.Status === "Verpasst") {
        verpasst++;
        max += 5;
      }
    });
    return { summe, max, verpasst };
  }, [wochenberichte]);

  const drécken = () => {
    document.body.classList.add("print-journal");
    window.print();
    setTimeout(() => document.body.classList.remove("print-journal"), 800);
  };

  return (
    <div className="wrap">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">PPREN</span>
          <span className="brand-sub">Mäin Suivi · Sciences Environnementales</span>
        </div>
      </header>

      <main className="content">
        <section className="card">
          {istSchueler ? (
            <div className="field">
              <span className="field-label">Ugemellt als</span>
              <div className="identitaet-box">👤 {currentSchueler?.virnumm ? `${currentSchueler.virnumm} — ` : ""}{currentSchueler?.name} ({currentSchueler?.klasse})</div>
            </div>
          ) : (
            <>
              {KLASSEN.length > 2 && (
                <div className="klasse-filter">
                  {KLASSEN.map((k) => (
                    <button
                      key={k}
                      className={`klasse-btn ${filterKlasse === k ? "active" : ""}`}
                      onClick={() => { setFilterKlasse(k); if (currentSchueler && k !== "alle" && currentSchueler.klasse !== k) setSchuelerId(""); }}
                    >
                      {k === "alle" ? "Alle Klassen" : k}
                    </button>
                  ))}
                </div>
              )}
              <label className="field">
                <span className="field-label">Schüler/-in</span>
                <select className="select" value={schuelerId} onChange={(e) => setSchuelerId(e.target.value)}>
                  <option value="">– auswählen –</option>
                  {SCHUELER_GEFILTERT.map((s) => <option key={s.id} value={s.id}>{s.virnumm ? `${s.virnumm} — ` : ""}{s.name} ({s.klasse})</option>)}
                </select>
              </label>
            </>
          )}
        </section>

        {loading && <div className="empty">Lädt…</div>}
        {error && <div className="empty error">{error}</div>}

        {geladen && !loading && !error && (
          <>
            {/* ===== Gesamt-Iwwerbléck: kompakte Kaart ganz uewen ===== */}
            <section className="card iwwerbleck-card">
              <span className="kapitel-label">Iwwerbléck</span>
              <div className="iwwerbleck-grid">
                <div className="iwwerbleck-item">
                  <span className="iwwerbleck-label">Fortschrëtt</span>
                  <span className="iwwerbleck-wert">{iwwerbleck.fortschrëttProzent}%</span>
                  <span className="iwwerbleck-sub">{iwwerbleck.erreechtMeilensteng} / {iwwerbleck.gesamtMeilensteng} Meilensteng erreecht</span>
                </div>
                <div className="iwwerbleck-item">
                  <span className="iwwerbleck-label">Nächst Ofgab</span>
                  <span className="iwwerbleck-wert iwwerbleck-wert-klengt">{iwwerbleck.nächstOfgab ? iwwerbleck.nächstOfgab.titel : "–"}</span>
                  <span className="iwwerbleck-sub">{iwwerbleck.nächstOfgab ? formatDatumKuerz(iwwerbleck.nächstOfgab.datum) : "keng geplangt"}</span>
                </div>
                <div className="iwwerbleck-item">
                  <span className="iwwerbleck-label">Nächst Rendez-vous</span>
                  <span className="iwwerbleck-wert iwwerbleck-wert-klengt">{iwwerbleck.nächstRv ? iwwerbleck.nächstRv.Typ : "–"}</span>
                  <span className="iwwerbleck-sub">{iwwerbleck.nächstRv ? `${iwwerbleck.nächstRv.Datum}${iwwerbleck.nächstRv.Zäit ? " · " + iwwerbleck.nächstRv.Zäit : ""}` : "keen geplangt"}</span>
                </div>
              </div>
            </section>

            <section className="card">
              <span className="kapitel-label">Kapitel 1</span>
              <h2>{projekt?.Titel || "(nach kee Projektplang ageraecht)"}</h2>
              <p className="status-line">
                Status: <strong>{projekt?.Status || "–"}</strong>
                {" · "}Betreuer/-in: <strong>{projekt?.Betreuer || "–"}</strong>
              </p>

              <div className="feld-block">
                <span className="feld-label">Inhalt / Beschreibung</span>
                <p className="feld-text">{planDetails?.inhalt || "–"}</p>
              </div>
              <div className="feld-block">
                <span className="feld-label">Motivation</span>
                <p className="feld-text">{planDetails?.motivation || "–"}</p>
              </div>
              <div className="feld-block">
                <span className="feld-label">Ziele</span>
                <p className="feld-text">{planDetails?.ziele || "–"}</p>
              </div>
              <div className="feld-block">
                <span className="feld-label">Gruppenarbeit</span>
                <p className="feld-text">
                  {planDetails ? (planDetails.gruppenarbeit ? `Ja, mit ${planDetails.partner || "–"}` : "Nein, Einzelarbeit") : "–"}
                </p>
                {planDetails?.gruppenarbeit && planDetails.aufgabenteilung && (
                  <p className="feld-text feld-text-sub">{planDetails.aufgabenteilung}</p>
                )}
              </div>
              <div className="feld-block">
                <span className="feld-label">Kostenplan (max. 500 €, geplangt)</span>
                {planDetails?.kostenplanNoetig && (planDetails.kosten || []).length > 0 ? (
                  <ul className="kosten-liste">
                    {planDetails.kosten.map((k, i) => (
                      <li key={i}>{k.bezeichnung}: <strong>{k.betrag} €</strong></li>
                    ))}
                  </ul>
                ) : <p className="feld-text">{projekt ? "nicht erforderlich" : "–"}</p>}
              </div>

              <div className="link-row">
                {projekt?.["Projektplan-Link"] && (
                  <a className="btn btn-ghost" href={projekt["Projektplan-Link"]} target="_blank" rel="noreferrer">📝 Projektplan als Word öffnen</a>
                )}
                {projekt?.["Dokumentatioun-Link"] && (
                  <a className="btn btn-ghost" href={projekt["Dokumentatioun-Link"]} target="_blank" rel="noreferrer">🔗 Dokumentatioun opmaachen</a>
                )}
              </div>
            </section>

            {/* ===== Budget: ëmmer ugewisen, onofhängeg vum Projektplang-Status ===== */}
            <section className="card">
              <span className="kapitel-label">Budget</span>
              <h2 className="periode-h2">💰 Kostenplang / Ausgaben</h2>

              {!budgetInfo && (
                <p className="notice">Nach keng Budgetufro gestallt. <a href="budget.html">Budget-Tool opmaachen →</a></p>
              )}

              {budgetInfo?.status === "Ageraecht" && (
                <p className="feld-text feld-text-sub">⏳ Genehmegung ugefrot ({budgetInfo.max} € Max) — waart nach op de Prof.</p>
              )}

              {budgetInfo?.status === "Genehmegt" && (() => {
                const summeAusgi = ausgaben.reduce((s, a) => s + (Number(a.Betrag) || 0), 0);
                const prozent = Math.round((summeAusgi / budgetInfo.max) * 100);
                return (
                  <>
                    <Fortschrittsbar prozent={prozent} farbe={prozent > 100 ? "#c0392b" : "#4576B5"} />
                    <p className="punkte-summe">{summeAusgi.toFixed(2)} € von {budgetInfo.max} € ausginn ({prozent}%)</p>
                    {ausgaben.length > 0 && (
                      <ul className="kosten-liste">
                        {ausgaben.map((a, i) => (
                          <li key={i}>{a.Bezeechnung}: <strong>{Number(a.Betrag).toFixed(2)} €</strong>{a.Datum ? ` · ${a.Datum}` : ""}</li>
                        ))}
                      </ul>
                    )}
                  </>
                );
              })()}

              <div className="link-row">
                <a className="btn btn-ghost" href="budget.html" target="_blank" rel="noreferrer">💰 Budget-Tool opmaachen</a>
              </div>
            </section>

            {/* ===== Wochenberichter: eege Iwwersiicht mat Status a Punkte pro Bericht ===== */}
            <section className="card">
              <span className="kapitel-label">Wochenberichter</span>
              <h2 className="periode-h2">📋 Iwwersiicht</h2>
              {wochenberichte.length === 0 ? (
                <p className="notice">Nach keng Wochenberichter ofginn.</p>
              ) : (
                <>
                  <p className="punkte-summe">Gesamt: {wbZesummefaassung.summe} / {wbZesummefaassung.max} Punkte{wbZesummefaassung.verpasst > 0 ? ` · ${wbZesummefaassung.verpasst} verpasst` : ""}</p>
                  <table className="wb-tabelle">
                    <thead>
                      <tr><th>Woch</th><th>Status</th><th>Punkte</th></tr>
                    </thead>
                    <tbody>
                      {[...wochenberichte].sort((a, b) => (ersteDatumVunWoche(a.Woche) || "").localeCompare(ersteDatumVunWoche(b.Woche) || "")).map((w, i) => {
                        let punkteAnzeigen = "–";
                        if (w.Status === "Bewäert") {
                          try {
                            const p = JSON.parse(w["Punkte (JSON)"]);
                            punkteAnzeigen = `${(p.zusammenfassung || 0) + (p.fortschritt || 0) + (p.anhaenge || 0) + (p.grammatik || 0)} / 5`;
                          } catch { punkteAnzeigen = "–"; }
                        } else if (w.Status === "Verpasst") {
                          punkteAnzeigen = "0 / 5";
                        }
                        return (
                          <tr key={i}>
                            <td>{w.Woche}</td>
                            <td><span className={`journal-status journal-status-${{ "Bewäert": "erreecht", "Verpasst": "verspéit", "Agereecht": "neutral", "Entschëllegt": "ausstoend" }[w.Status] || "neutral"}`}>{w.Status}</span></td>
                            <td>{punkteAnzeigen}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </>
              )}
              <div className="link-row">
                <a className="btn btn-ghost" href="wochenbericht.html" target="_blank" rel="noreferrer">📝 Wochenbericht-Tool opmaachen</a>
              </div>
            </section>

            {/* ===== Rendez-vousen: Termine mam Prof ===== */}
            <section className="card">
              <span className="kapitel-label">Rendez-vousen</span>
              <h2 className="periode-h2">📅 Termine mam Prof</h2>
              {rendezvousen.length === 0 ? (
                <p className="notice">Nach keng Rendez-vousen geplangt.</p>
              ) : (() => {
                const heidegIso = new Date().toISOString().slice(0, 10);
                const sortéiert = [...rendezvousen]
                  .map((r) => ({ ...r, isoDatum: dmyZuIso(r.Datum) }))
                  .sort((a, b) => a.isoDatum.localeCompare(b.isoDatum));
                const zukunft = sortéiert.filter((r) => r.isoDatum >= heidegIso);
                const vergaangen = sortéiert.filter((r) => r.isoDatum < heidegIso);
                return (
                  <>
                    {zukunft.length === 0 && <p className="notice">Keng opstoend Rendez-vousen.</p>}
                    {zukunft.length > 0 && (
                      <ul className="rv-liste">
                        {zukunft.map((r, i) => (
                          <li key={i} className="rv-item rv-item-zukunft">
                            <span className="rv-datum">{r.Datum}{r.Zäit ? ` · ${r.Zäit}` : ""}</span>
                            <span className="rv-typ">{r.Typ}</span>
                            {r.Notiz && <span className="rv-notiz">{r.Notiz}</span>}
                          </li>
                        ))}
                      </ul>
                    )}
                    {vergaangen.length > 0 && (
                      <>
                        <span className="feld-sub-label">Vergaangen</span>
                        <ul className="rv-liste">
                          {vergaangen.slice(-5).map((r, i) => (
                            <li key={i} className="rv-item">
                              <span className="rv-datum">{r.Datum}</span>
                              <span className="rv-typ">{r.Typ}</span>
                            </li>
                          ))}
                        </ul>
                      </>
                    )}
                  </>
                );
              })()}
            </section>

            {/* ===== Projet-Journal: chronologesche Verlaf — onofhängeg vum Projektplang-Status ===== */}
            {journal && (
              <section className="card journal-card">
                <div className="journal-head">
                  <div>
                    <span className="kapitel-label">Verlaf</span>
                    <h2>📖 Projet-Journal</h2>
                    <p className="journal-sub">All Meilensteng, Wochenberichter, Fachgespréicher a Ziel-Iwwerpréiwungen chronologesch — fir Dokumentatioun oder Iwwerbléck.</p>
                  </div>
                  <button className="btn btn-ghost journal-print-btn" onClick={drécken}>🖨️ Als PDF exportéieren</button>
                </div>

                {journal.zeitleischt.length > 0 && (
                  <div className="journal-legend">
                    {Object.keys(KATEGORIE_FARWEN).map((k) => (
                      <span key={k} className="journal-legend-item"><span className="journal-legend-dot" style={{ background: KATEGORIE_FARWEN[k] }} />{k}</span>
                    ))}
                  </div>
                )}

                {journal.zeitleischt.length === 0 && (
                  <p className="notice">Nach keng Meilensteng oder Wochenberichter fir e Journal.</p>
                )}

                <div className="journal-timeline">
                  {journal.zeitleischt.map((item, i) => {
                    if (item.art === "meilensteen") {
                      const wbListe = journal.wbNoMeilensteen[item.titel] || [];
                      const kFarw = KATEGORIE_FARWEN[item.kategorie] || "#93a098";
                      const kText = KATEGORIE_TEXT[item.kategorie] || "#1c2621";
                      return (
                        <div className="journal-item journal-item-meilensteen" key={i}>
                          <div className="journal-marker" style={{ background: kFarw, width: "13px", height: "13px" }}></div>
                          <div className="journal-body">
                            <div className="journal-item-head">
                              <span className="journal-datum">{formatDatumKuerz(item.datum)}</span>
                              <span className="journal-badges">
                                <span className="journal-kategorie-badge" style={{ background: kFarw, color: kText }}>{item.kategorie}</span>
                                <span className={`journal-status journal-status-${(item.status || "Ausstoend").toLowerCase()}`}>{item.status || "Ausstoend"}</span>
                              </span>
                            </div>
                            <strong className="journal-titel">🏁 {item.titel}</strong>
                            {wbListe.length > 0 && (
                              <ul className="journal-wb-liste">
                                {wbListe.map((w, j) => (
                                  <li key={j}>
                                    <span className="journal-wb-datum">{w.Woche}</span>
                                    <span className="journal-wb-text">{w.Zusammenfassung}</span>
                                  </li>
                                ))}
                              </ul>
                            )}
                          </div>
                        </div>
                      );
                    }
                    if (item.art === "fachgespraech") {
                      return (
                        <div className="journal-item journal-item-klengt" key={i}>
                          <div className="journal-marker journal-marker-klengt"></div>
                          <div className="journal-body">
                            <div className="journal-item-head">
                              <span className="journal-datum">{formatDatumKuerz(item.datum)}</span>
                              <span className="journal-status journal-status-neutral">{item.gesamt} / 30</span>
                            </div>
                            <span className="journal-titel-klengt">🗣️ {item.titel}</span>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div className="journal-item journal-item-klengt" key={i}>
                        <div className="journal-marker journal-marker-klengt"></div>
                        <div className="journal-body">
                          <div className="journal-item-head">
                            <span className="journal-datum">{formatDatumKuerz(item.datum)}</span>
                            <span className="journal-status journal-status-neutral">{item.punkte} / {item.max}</span>
                          </div>
                          <span className="journal-titel-klengt">🎯 {item.titel}</span>
                        </div>
                      </div>
                    );
                  })}

                  {journal.wbNoMeilensteen["__ouni__"] && journal.wbNoMeilensteen["__ouni__"].length > 0 && (
                    <div className="journal-item journal-item-meilensteen">
                      <div className="journal-marker journal-marker-gro"></div>
                      <div className="journal-body">
                        <strong className="journal-titel">📝 Wochenberichter ouni Meilensteen-Bezuch</strong>
                        <ul className="journal-wb-liste">
                          {journal.wbNoMeilensteen["__ouni__"].map((w, j) => (
                            <li key={j}>
                              <span className="journal-wb-datum">{w.Woche}</span>
                              <span className="journal-wb-text">{w.Zusammenfassung}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* ===== Bewertungsperioden — onofhängeg vum Projektplang-Status ===== */}
            {perioden.map((periode) => {
              const b = bewertungFuer(periode);
              const prozent = b ? Math.round((Number(b.Note) / 60) * 100) : 0;
              const kategorien = b ? sicherJson(b["Kategorien (JSON)"], []) : [];
              const gruppenBemerkungen = b ? sicherJson(b["Gruppenbemerkungen (JSON)"], []) : [];

              const gruppiert = {};
              kategorien.forEach((k) => {
                const teile = (k.name || "").split(" — ");
                const gruppe = teile[0];
                const pos = teile.slice(1).join(" — ") || k.name;
                if (!gruppiert[gruppe]) gruppiert[gruppe] = [];
                gruppiert[gruppe].push({ name: pos, punkte: k.punkte, max: k.max });
              });

              return (
                <section className="card" key={periode}>
                  <span className="kapitel-label">{periode}</span>
                  <div className="periode-head">
                    <h2 className="periode-h2">Bewertung &amp; Kommentar</h2>
                    {!b && <span className="pill pill-offen">Nach net bewäert</span>}
                    {b && <span className="pill pill-fertig">Note {b.Note} / 60</span>}
                  </div>

                  {!b && <p className="notice">
                    {!istSchueler && entworfFuer(periode)
                      ? "📝 Entworf existéiert (nach net validéiert) — de Schüler gesäit dëst nach net. Fäerdeg maachen a validéieren am Bewertungs-Tool."
                      : "Fir dës Period läit nach keng Bewertung vir."}
                  </p>}

                  {b && (
                    <>
                      <Fortschrittsbar prozent={prozent} farbe={prozent >= 50 ? "#00A94F" : "#c0392b"} />
                      <p className="punkte-summe">Gesamt: {b.Punkte} / {b.Max} Punkte</p>

                      {Object.keys(gruppiert).map((gruppe) => {
                        const items = gruppiert[gruppe];
                        const gSumme = items.reduce((s, i) => s + (Number(i.punkte) || 0), 0);
                        const gMax = items.reduce((s, i) => s + (Number(i.max) || 0), 0);
                        const gProzent = gMax > 0 ? Math.round((gSumme / gMax) * 100) : 0;
                        const gBem = gruppenBemerkungen.find((g) => g.titel === gruppe);
                        return (
                          <div className="gruppe-block" key={gruppe}>
                            <div className="gruppe-head">
                              <span className="gruppe-name">{gruppe}</span>
                              <span className="gruppe-punkte">{gSumme} / {gMax}</span>
                            </div>
                            <Fortschrittsbar prozent={gProzent} farbe="#4576B5" />
                            <ul className="positionen-liste">
                              {items.map((i, idx) => (
                                <li key={idx}>{i.name}: <strong>{i.punkte} / {i.max}</strong></li>
                              ))}
                            </ul>
                            {gBem && (gBem.positiv || []).map((r) => (
                              <div className="remarque remarque-pos" key={r}>✓ {r}</div>
                            ))}
                            {gBem && (gBem.negativ || []).map((r) => (
                              <div className="remarque remarque-neg" key={r}>✗ {r}</div>
                            ))}
                            {gBem && gBem.kommentar && <div className="remarque-kommentar">{gBem.kommentar}</div>}
                          </div>
                        );
                      })}

                      {(() => {
                        const allgemein = sicherJson(b["Allgemeine Remarquen (JSON)"], { positiv: [], negativ: [] });
                        const hatAllgemein = (allgemein.positiv || []).length > 0 || (allgemein.negativ || []).length > 0;
                        return hatAllgemein ? (
                          <div className="allgemeine-remarquen">
                            {(allgemein.positiv || []).map((r) => (
                              <div className="remarque remarque-pos" key={r}>✓ {r}</div>
                            ))}
                            {(allgemein.negativ || []).map((r) => (
                              <div className="remarque remarque-neg" key={r}>✗ {r}</div>
                            ))}
                          </div>
                        ) : null;
                      })()}

                      {b.Kommentar && (
                        <div className="allgemeiner-kommentar">
                          <span className="ak-label">Kommentar der Lehrperson</span>
                          <p>{b.Kommentar}</p>
                        </div>
                      )}

                      {b["Suivi-PDF-Link (Schüler)"] && (
                        <a className="btn btn-primary" href={b["Suivi-PDF-Link (Schüler)"]} target="_blank" rel="noreferrer">
                          📄 Ganzen Suivi als PDF opmaachen
                        </a>
                      )}
                    </>
                  )}
                </section>
              );
            })}
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
